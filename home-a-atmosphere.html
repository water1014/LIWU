<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d5d6d4"><title>里屋 · 双人生活首页</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--soft:rgba(255,255,255,.78);--glass:rgba(74,77,79,.34);--glass2:rgba(238,239,237,.27);--stroke:rgba(255,255,255,.48);--blur:17px;--radius:25px}
*{box-sizing:border-box}html{min-height:100%;background:#c7c9c8}body{margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans','Noto Serif SC',sans-serif;background:#c7c9c8}button{font:inherit;color:inherit;cursor:pointer}.wallpaper{position:fixed;inset:0;background:linear-gradient(180deg,rgba(23,26,28,.18),rgba(24,27,29,.17) 35%,rgba(29,32,34,.31)),url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=2200&q=88') center/cover no-repeat;filter:grayscale(1);transform:scale(1.015)}.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.13),transparent 40%,rgba(0,0,0,.08))}.shell{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);gap:0}.sidebar{position:sticky;top:0;height:100vh;padding:34px 22px 24px;background:rgba(38,41,43,.30);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column}.brand{font:300 29px 'Noto Serif SC';letter-spacing:.04em}.brand-sub{font-size:9px;letter-spacing:.24em;color:rgba(255,255,255,.62);margin-top:3px}.couple-mini{display:flex;align-items:center;gap:10px;padding:22px 0 19px;margin-bottom:13px;border-bottom:1px solid rgba(255,255,255,.24)}.mini-avatars{display:flex;padding-left:3px}.mini-avatars img{width:31px;height:31px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.9);margin-left:-4px}.couple-mini b{font:400 12px 'Noto Serif SC';display:block}.couple-mini small{font-size:9px;color:rgba(255,255,255,.64)}.navgroup{margin:10px 0 2px}.navgroup label{display:block;font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.53);padding:0 10px 7px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;display:flex;align-items:center;gap:12px;border-radius:12px;font-size:12px;color:rgba(255,255,255,.76);transition:.2s}.nav i{font-style:normal;width:20px;height:20px;border:1px solid rgba(255,255,255,.43);border-radius:7px;display:grid;place-items:center;font-size:10px}.nav.active,.nav:hover{background:rgba(255,255,255,.19);color:white}.sidefoot{margin-top:auto;padding:15px 9px 0;border-top:1px solid rgba(255,255,255,.2);font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.5)}
main{width:min(100%,1080px);margin:0 auto;padding:34px clamp(22px,5vw,72px) 50px}.top{display:flex;align-items:center;justify-content:space-between}.top .wordmark{font:300 29px 'Noto Serif SC';letter-spacing:.02em;text-shadow:0 2px 15px #3335}.top-actions{display:flex;gap:10px}.glass-btn{width:43px;height:43px;border:1px solid var(--stroke);border-radius:50%;background:var(--glass2);backdrop-filter:blur(var(--blur));display:grid;place-items:center;font-size:19px;box-shadow:0 8px 25px #20202018}.glass-btn:hover{background:rgba(255,255,255,.36)}
.identity{text-align:center;padding:48px 0 24px}.avatars{display:flex;justify-content:center;align-items:center;margin-bottom:19px}.avatars img{width:104px;height:104px;object-fit:cover;border-radius:50%;border:3px solid rgba(255,255,255,.72);box-shadow:0 10px 35px #2224}.avatars img+img{margin-left:19px}.heart{font-size:28px;margin:0 13px;text-shadow:0 2px 12px #2227}.names{font:300 clamp(25px,4vw,36px) 'Noto Serif SC';letter-spacing:.12em;text-shadow:0 2px 15px #2228}.names small{font:400 9px 'DM Sans';display:block;letter-spacing:.35em;margin-top:9px;color:rgba(255,255,255,.74)}.signature{font:300 14px 'Noto Serif SC';letter-spacing:.13em;color:rgba(255,255,255,.85);margin:16px 0 22px;text-shadow:0 2px 10px #2227}.stats{display:flex;justify-content:center;gap:56px}.stat strong{font:300 35px 'DM Sans';display:block;text-shadow:0 2px 14px #2226}.stat span{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.78)}
.date-row{display:flex;justify-content:center;margin:10px auto 20px}.date-pill{display:flex;align-items:center;gap:11px;padding:13px 23px;border:1px solid var(--stroke);border-radius:999px;background:var(--glass);backdrop-filter:blur(var(--blur));font-size:12px;letter-spacing:.04em;box-shadow:0 10px 28px #2222}
.widgets{display:grid;grid-template-columns:1.04fr .96fr;gap:13px;max-width:790px;margin:0 auto}.music{min-height:238px;padding:22px 23px;border:1px solid var(--stroke);border-radius:var(--radius);background:var(--glass);backdrop-filter:blur(var(--blur));box-shadow:0 12px 35px #20202024;display:flex;flex-direction:column}.music-top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:9px;letter-spacing:.22em;color:rgba(255,255,255,.68)}.track{font:300 24px 'Noto Serif SC';margin-top:19px}.artist{font-size:11px;color:rgba(255,255,255,.73);margin-top:5px}.lyric{font:300 12px 'Noto Serif SC';margin-top:15px;color:rgba(255,255,255,.83)}.progress{height:3px;border-radius:3px;background:#ffffff55;margin-top:auto;position:relative}.progress:before{content:"";display:block;width:37%;height:100%;background:white;border-radius:3px}.times{display:flex;justify-content:space-between;font-size:9px;color:#ffffffb8;margin-top:5px}.controls{display:flex;align-items:center;gap:28px;margin-top:13px;font-size:21px}.controls button{border:0;background:none;padding:0}.controls .play{font-size:25px}.photo-tile{position:relative;min-height:238px;border:1px solid var(--stroke);border-radius:var(--radius);overflow:hidden;background:var(--glass);backdrop-filter:blur(var(--blur));padding:13px;box-shadow:0 12px 35px #20202024}.photo-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.photo-top button{width:39px;height:39px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass2);font-size:20px}.photo{height:174px;border-radius:19px;overflow:hidden;border:1px solid rgba(255,255,255,.65)}.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(.65)}
.chat-entry{display:block;text-decoration:none;color:white;max-width:790px;margin:15px auto 0;padding:23px 28px 25px;border-radius:var(--radius);border:1px solid var(--stroke);background:rgba(66,70,72,.39);backdrop-filter:blur(20px);box-shadow:0 13px 38px #20202024;transition:.2s}.chat-entry:hover{background:rgba(66,70,72,.53);transform:translateY(-2px)}.chat-entry .eyebrow{letter-spacing:.24em}.chat-entry h2{font:300 34px 'Noto Serif SC';margin:8px 0 2px}.chat-entry p{font:300 12px 'Noto Serif SC';color:rgba(255,255,255,.75);margin:0}.chat-entry .go{float:right;margin-top:-36px;font-size:22px;color:#ffffffc7}
.toast{position:fixed;z-index:8;bottom:25px;left:50%;transform:translate(-50%,15px);opacity:0;background:rgba(38,42,44,.78);backdrop-filter:blur(15px);border:1px solid #ffffff55;border-radius:99px;padding:10px 16px;font-size:11px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-menu{display:none}.scrim{display:none}
@media(max-width:800px){.shell{display:block}.sidebar{position:fixed;z-index:7;left:0;top:0;width:min(290px,82vw);height:100dvh;transform:translateX(-105%);transition:transform .25s;background:rgba(43,46,48,.78);padding-top:30px}.sidebar.open{transform:translateX(0)}.scrim.show{display:block;position:fixed;z-index:6;inset:0;background:#1116;backdrop-filter:blur(3px)}main{padding:22px 17px 38px}.top .wordmark{display:none}.mobile-menu{display:grid}.identity{padding:30px 0 18px}.avatars img{width:88px;height:88px}.heart{font-size:25px;margin:0 9px}.names{font-size:26px}.signature{font-size:12px;margin:13px 0 17px}.stats{gap:42px}.stat strong{font-size:31px}.widgets{gap:9px}.music{padding:16px;min-height:205px}.photo-tile{padding:10px;min-height:205px}.photo{height:153px}.track{font-size:19px}.lyric{font-size:11px}.controls{gap:21px}.chat-entry{padding:19px 21px}.chat-entry h2{font-size:30px}}
@media(max-width:390px){.widgets{grid-template-columns:1fr}.music,.photo-tile{min-height:190px}.photo{height:145px}.identity{padding-top:23px}.avatars img{width:78px;height:78px}.names{font-size:23px}.stats{gap:32px}}
</style></head><body><div class="wallpaper"></div><div class="scrim" id="scrim"></div><div class="shell">
<aside class="sidebar" id="sidebar"><div class="brand">里屋</div><div class="brand-sub">LIWU · A SPACE FOR TWO</div><div class="couple-mini"><div class="mini-avatars"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt=""><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop" alt=""></div><div><b>你与宋祁</b><small>两个人的生活空间</small></div></div>

<script>const toast=document.getElementById('toast');let timer;function show(s){toast.textContent=s;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1600)}document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.toast)));document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');show('功能入口示意 · '+b.textContent.trim())}));const side=document.getElementById('sidebar'),scrim=document.getElementById('scrim');document.getElementById('menu').addEventListener('click',()=>{side.classList.add('open');scrim.classList.add('show')});scrim.addEventListener('click',()=>{side.classList.remove('open');scrim.classList.remove('show')});let playing=true;document.getElementById('play').addEventListener('click',e=>{playing=!playing;e.currentTarget.textContent=playing?'Ⅱ':'▶';show(playing?'播放示意':'暂停示意')});document.getElementById('chat').addEventListener('click',e=>{e.preventDefault();show('聊天页面入口示意')});</script></body></html>
