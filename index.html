<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e5e2"><title>里屋 · LIWU</title>
<style>
:root{--ink:#29282a;--muted:#858184;--paper:#f7f4f1;--glass:rgba(255,255,255,.48);--line:rgba(255,255,255,.58);--rose:#9b6267;--wine:#713f48;--shadow:0 18px 55px #30232a20;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;min-height:100%;}body{min-height:100vh;color:var(--ink);background:#d8d3d0}button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #9b6267;outline-offset:3px}
.phone-os{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(145deg,#d9d1cf,#b9b1b2 52%,#8e8186);isolation:isolate}
.wallpaper{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 78% 12%,#f7e9e5aa 0,transparent 34%),radial-gradient(ellipse at 12% 76%,#7c626c88 0,transparent 38%),linear-gradient(145deg,#d8ccca 0%,#b8aaac 45%,#776c75 100%)}
.wallpaper:before{content:"";position:absolute;width:72vw;height:72vw;max-width:760px;max-height:760px;right:-18vw;top:8vh;border:1px solid #ffffff4d;border-radius:50%;box-shadow:0 0 0 34px #ffffff0d,0 0 0 90px #ffffff0a}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#fff2 0%,transparent 45%,#382b351c 100%);backdrop-filter:saturate(.8)}
.status{height:34px;padding:9px max(22px,env(safe-area-inset-left)) 0;display:flex;justify-content:space-between;align-items:center;color:#342e32;font-size:11px;font-weight:650;letter-spacing:.2px;position:relative;z-index:20}
.status-right{display:flex;gap:7px;align-items:center}.signal{display:flex;gap:2px;align-items:end;height:11px}.signal i{display:block;width:3px;background:currentColor;border-radius:2px}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}.battery{width:19px;height:9px;border:1px solid currentColor;border-radius:3px;position:relative}.battery:before{content:"";position:absolute;inset:1.5px 3px 1.5px 1.5px;background:currentColor;border-radius:1px}.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.home{min-height:calc(100vh - 34px);padding:24px clamp(22px,5vw,64px) max(28px,env(safe-area-inset-bottom));max-width:1100px;margin:auto;display:flex;flex-direction:column;position:relative;z-index:1}
.home-top{display:flex;justify-content:space-between;align-items:flex-start}.dateblock .day{font-size:clamp(58px,11vw,92px);line-height:.92;font-weight:200;letter-spacing:-5px;color:#342c31}.dateblock .date{margin-top:12px;font-size:12px;letter-spacing:2px;color:#55474d}.dateblock .greeting{margin-top:7px;font:italic 13px Georgia;color:#6c5b61}
.weather{width:125px;padding:13px 14px;border:1px solid #ffffff70;border-radius:18px;background:#ffffff36;backdrop-filter:blur(20px);box-shadow:0 10px 30px #49373c0c}.weather b{display:block;font:25px Georgia;font-weight:400}.weather small{display:block;color:#62565b;font-size:9px;letter-spacing:1px;margin-top:5px}
.widget-row{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:26px;max-width:610px}.widget{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);border-radius:20px;padding:16px 18px;box-shadow:0 12px 32px #3b2d3210;min-height:104px}.widget-kicker{font-size:9px;letter-spacing:2px;color:#786b70}.widget-title{font:19px Georgia;margin-top:12px}.widget-sub{font-size:10px;color:#786e72;margin-top:5px}.couple-widget{display:flex;align-items:center;gap:11px}.orbit{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid #fff;background:linear-gradient(145deg,#f4e5e1,#b99599);color:#72535a;font:16px Georgia}.couple-widget strong{font:16px Georgia;font-weight:400}.couple-widget small{display:block;color:#7f7377;font-size:9px;margin-top:5px}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px;margin-top:clamp(32px,7vh,64px);max-width:650px}.app-icon{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;min-width:0}.app-glyph{width:clamp(54px,8vw,68px);height:clamp(54px,8vw,68px);border:1px solid #ffffffa6;border-radius:20px;background:linear-gradient(145deg,#ffffffb8,#ffffff48);box-shadow:0 9px 22px #40323818,inset 0 1px 0 #fff;backdrop-filter:blur(18px);display:grid;place-items:center;position:relative;transition:transform .2s,box-shadow .2s}.app-icon:active .app-glyph{transform:scale(.91)}.app-glyph svg{width:27px;height:27px;stroke:#59484f;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.app-label{font-size:10px;color:#43383d;text-shadow:0 1px 8px #fff8;white-space:nowrap}
.dock-wrap{margin-top:auto;padding-top:40px}.dock{display:flex;justify-content:center;gap:clamp(12px,3vw,25px);width:max-content;max-width:100%;margin:auto;padding:13px 19px;border:1px solid #ffffff90;border-radius:25px;background:#ffffff4c;backdrop-filter:blur(26px);box-shadow:0 16px 42px #37293020}.dock .app-glyph{width:57px;height:57px;border-radius:18px}.page-dots{display:flex;justify-content:center;gap:6px;margin-top:15px}.page-dots i{width:5px;height:5px;border-radius:50%;background:#ffffff80}.page-dots i.active{width:16px;border-radius:5px;background:#fff}
.home-indicator{width:105px;height:4px;background:#3f353b99;border-radius:9px;margin:20px auto 0}
.app-screen{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;animation:open .28s cubic-bezier(.2,.75,.2,1);overflow:hidden}@keyframes open{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.appbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #e9e3e0;background:#faf8f6;flex:none}.back{width:34px;height:34px;border-radius:12px;background:#eee9e6;color:#57484c;font-size:19px}.appbar h2{font:20px Georgia;font-weight:400;margin:0;flex:1}.appbar small{font-size:9px;color:#9a8e91;letter-spacing:1px}.appbody{padding:20px;overflow:auto;flex:1;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.section-label{font-size:9px;letter-spacing:2px;color:#a09496;margin:8px 0 12px}.surface{background:#fff;border:1px solid #eee8e5;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 25px #43333a08}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{font-size:11px;color:#958b8d}.primary{background:#754b54;color:white;border-radius:12px;padding:11px 15px;font-size:11px}.soft{background:#f0e9e7;color:#73555b;border-radius:12px;padding:10px 13px;font-size:11px}.text-input,.text-area{width:100%;border:1px solid #e8e0dd;border-radius:12px;background:#fff;padding:12px;font-size:12px;outline:none;color:#342e30}.text-area{min-height:90px;resize:vertical;line-height:1.6}.chat-list{display:flex;flex-direction:column;gap:10px}.chat-msg{max-width:84%;padding:11px 14px;border-radius:15px;background:#eee9e7;font-size:12px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.chat-msg.mine{align-self:flex-end;background:#e8dadd}.chat-time{font-size:8px;color:#aaa0a2;margin-top:4px}.chat-compose{display:flex;gap:8px;margin-top:14px}.chat-compose input{flex:1;min-width:0}.app-tile{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0ebE8}.app-tile:last-child{border:0}.tile-mark{width:39px;height:39px;border-radius:13px;background:#f0e7e5;display:grid;place-items:center;color:#79555d;font:17px Georgia}.tile-copy b{font-size:12px;font-weight:550}.tile-copy small{display:block;color:#a09798;font-size:9px;margin-top:4px}
.control{position:fixed;inset:0;z-index:60;background:#29232bcf;backdrop-filter:blur(25px);color:#fff;padding:56px 22px 30px;animation:open .2s}.control h2{font:30px Georgia;font-weight:400;margin:0 0 8px}.control p{font-size:11px;color:#ffffff9a}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}.control-item{padding:18px;border-radius:18px;background:#ffffff20;border:1px solid #ffffff24;text-align:left;color:#fff}.control-item b{display:block;font-size:12px;margin-top:12px}.control-item small{font-size:9px;color:#ffffff9a}.close-control{position:absolute;right:22px;top:18px;background:#ffffff25;color:#fff;border-radius:50%;width:36px;height:36px;font-size:20px}
.lock{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;color:#3d3036;background:linear-gradient(145deg,#e7d8d5ed,#b9a5a9ed 56%,#83747eee),radial-gradient(circle at 70% 20%,#fff8,transparent 38%);backdrop-filter:blur(22px);padding:14vh 25px 30px}.lock-time{font:clamp(72px,16vw,112px)/1 Georgia;font-weight:400;letter-spacing:-5px}.lock-date{font-size:12px;letter-spacing:2px;margin-top:13px}.lock-note{margin-top:auto;text-align:center;font:italic 14px Georgia;color:#66545b}.unlock{margin-top:25px;padding:12px 25px;border:1px solid #ffffffb0;border-radius:30px;background:#ffffff45;backdrop-filter:blur(16px);font-size:11px;color:#51434a}
.toast{position:fixed;z-index:100;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#30272c;color:#fff;border-radius:20px;font-size:11px;white-space:nowrap}
@media(min-width:760px){.home{padding-top:34px}.app-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 20px}.app-screen{inset:20px max(20px,calc((100vw - 900px)/2));border-radius:28px;box-shadow:0 25px 100px #2b20284d;border:1px solid #ffffffaa}.lock{padding-top:16vh}}
@media(max-width:420px){.home{padding:18px 20px max(24px,env(safe-area-inset-bottom))}.widget-row{gap:8px;margin-top:20px}.widget{padding:13px;min-height:94px}.weather{width:105px;padding:11px}.app-grid{gap:20px 10px;margin-top:32px}.dock{gap:12px;padding:11px 14px}.dock .app-glyph{width:51px;height:51px}}
</style>
</head>
<body><div id="app">
<div class="phone-os" @touchstart.passive="touchStart=$event.touches[0].clientX" @touchend.passive="swipeHome($event)">
<div class="wallpaper"></div>
<div class="status" @click="toggleControl"><span>{{clock}}</span><span class="status-right"><span>5G</span><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div>
<main class="home" v-if="!activeApp">
<div class="home-top"><div class="dateblock"><div class="day">{{day}}</div><div class="date">{{dateText}}</div><div class="greeting">a little place, just for us.</div></div><div class="weather"><b>里屋</b><small>LIWU · PRIVATE SPACE</small></div></div>
<div class="widget-row"><div class="widget"><div class="widget-kicker">OUR LITTLE WORLD</div><div class="widget-title">把日子收进来。</div><div class="widget-sub">每一次打开，都是回到自己的空间</div></div><div class="widget couple-widget"><div class="orbit">里</div><div><strong>两个人的事</strong><small>从这里慢慢开始</small></div></div></div>
<div class="app-grid">
<button class="app-icon" v-for="a in desktopPages[homePage]" :key="a.id" @click="openApp(a.id)"><span class="app-glyph"><svg viewBox="0 0 32 32"><path :d="a.path"/></svg></span><span class="app-label">{{a.name}}</span></button>
</div>
<div class="dock-wrap"><div class="dock"><button class="app-icon" v-for="a in dockApps" :key="a.id" @click="openApp(a.id)"><span class="app-glyph"><svg viewBox="0 0 32 32"><path :d="a.path"/></svg></span></button></div><div class="page-dots"><i v-for="(_,i) in desktopPages" :class="{active:i===homePage}"></i></div><div class="home-indicator"></div></div>
</main>
<section v-if="activeApp" class="app-screen"><header class="appbar"><button class="back" @click="closeApp">‹</button><h2>{{appName(activeApp)}}</h2><small>LIWU</small></header>
<div class="appbody">
<template v-if="activeApp==='chat'">
<div class="section-label">CONVERSATIONS</div><div class="surface" v-if="!friendName"><div class="muted">还没有创建聊天对象</div><p class="muted">先在「我们」里建立角色档案，再开始对话。</p><button class="primary" @click="openApp('us')">创建角色</button></div>
<template v-else><div class="surface row"><div><b style="font-size:13px">{{friendName}}</b><div class="muted">专属对话空间</div></div><button class="soft" @click="openApp('us')">角色设置</button></div><div class="chat-list"><div v-for="m in chatMessages" :key="m.id" :class="{'chat-msg':true,'mine':m.role==='me'}"><div>{{m.text}}</div><div class="chat-time">{{m.time}}</div></div><div v-if="!chatMessages.length" class="muted" style="text-align:center;padding:35px 0">你们的故事，从第一句话开始。</div></div><div class="chat-compose"><input class="text-input" v-model="draft" placeholder="写一句想说的话…" @keydown.enter.prevent="sendMessage"><button class="primary" @click="sendMessage">发送</button></div><p class="muted">尚未配置模型服务时，只保存你的消息，不会生成虚假的回复。</p></template>
</template>
<template v-else-if="activeApp==='us'"><div class="section-label">YOUR PERSONA</div><div class="surface"><label class="muted">角色名称</label><input class="text-input" v-model="friendDraft" placeholder="给TA取个名字"><label class="muted" style="display:block;margin:14px 0 6px">角色设定 / 人物简介</label><textarea class="text-area" v-model="personaDraft" placeholder="写下性格、经历、说话方式、与你的关系…"></textarea><button class="primary" style="margin-top:12px" @click="savePersona">保存角色</button></div><div class="surface"><div class="row"><b style="font-size:12px">关于我们</b><span class="muted">双人空间</span></div><p class="muted">这里会逐步承载角色档案、关系设定、共同记录与纪念日。</p></div></template>
<template v-else-if="activeApp==='memory'"><div class="section-label">MEMORY BOX</div><div class="surface"><div class="row"><b style="font-size:13px">记忆收藏</b><button class="soft" @click="memoryDraftOpen=!memoryDraftOpen">＋ 添加</button></div><div v-if="memoryDraftOpen"><textarea class="text-area" v-model="memoryDraft" placeholder="记下重要的事…"></textarea><button class="primary" style="margin-top:8px" @click="addMemory">收好这条记忆</button></div><div v-for="m in memories" class="app-tile"><div class="tile-mark">记</div><div class="tile-copy"><b>{{m.text}}</b><small>{{m.date}}</small></div></div><p v-if="!memories.length" class="muted">还没有收藏。重要的瞬间，可以从这里开始保存。</p></div><div class="surface"><b style="font-size:12px">三层记忆</b><p class="muted">短时记忆、主题索引、永久记忆。后续接入模型后再加入自动总结与检索。</p></div></template>
<template v-else-if="activeApp==='together'"><div class="section-label">TOGETHER SPACE</div><div class="surface"><b style="font:22px Georgia;font-weight:400">一起生活的地方</b><p class="muted">日历、纪念日、共同清单与双人小组件会在这里展开。</p><div class="app-tile"><div class="tile-mark">日</div><div class="tile-copy"><b>共同日历</b><small>记录重要日期与日常安排</small></div></div><div class="app-tile"><div class="tile-mark">信</div><div class="tile-copy"><b>信箱</b><small>把想留给彼此的话放进来</small></div></div></div></template>
<template v-else-if="activeApp==='gallery'"><div class="section-label">GALLERY</div><div class="surface"><b style="font-size:13px">我们的相册</b><p class="muted">照片与图片会保存在本机数据库中。上传功能将在下一轮接入。</p><input type="file" accept="image/*" @change="savePhoto"></div><div class="photo-grid"><img v-for="p in photos" :src="p.url" style="width:100%;border-radius:12px"></div></template>
<template v-else-if="activeApp==='music'"><div class="section-label">MUSIC ROOM</div><div class="surface"><b style="font:24px Georgia;font-weight:400">留一首歌给今天。</b><p class="muted">音乐链接与播放列表稍后加入。这里不会预置未经你选择的歌曲。</p><input class="text-input" v-model="musicUrl" placeholder="粘贴音乐链接"><button class="primary" style="margin-top:10px" @click="saveMusic">保存链接</button><div v-for="u in musicLinks" class="app-tile"><div class="tile-mark">♫</div><div class="tile-copy"><b>{{u}}</b><small>已保存</small></div></div></div></template>
<template v-else-if="activeApp==='mail'"><div class="section-label">LETTER BOX</div><div class="surface"><b style="font-size:13px">信箱</b><p class="muted">给未来的自己，或给某个人，留一封信。</p><textarea class="text-area" v-model="letterDraft" placeholder="写下暂时不想发送的话…"></textarea><button class="primary" style="margin-top:10px" @click="saveLetter">保存到信箱</button></div><div v-for="l in letters" class="surface"><div class="muted">{{l.date}}</div><p style="font-size:12px;line-height:1.8">{{l.text}}</p></div></template>
<template v-else-if="activeApp==='settings'"><div class="section-label">PERSONALIZE</div><div class="surface"><div class="row"><b style="font-size:13px">桌面设置</b><span class="muted">自定义空间</span></div><div class="app-tile"><div class="tile-copy"><b>壁纸氛围</b><small>切换日间与夜间色调</small></div><button class="soft" @click="night=!night;document.querySelector('.wallpaper').style.filter=night?'brightness(.65) saturate(.8)':'none'">{{night?'夜间':'日间'}}</button></div><div class="app-tile"><div class="tile-copy"><b>桌面分页</b><small>应用图标分页浏览</small></div><span class="muted">{{desktopPages.length}} 页</span></div><div class="app-tile"><div class="tile-copy"><b>锁屏</b><small>进入时显示锁屏界面</small></div><button class="soft" @click="locked=true">预览锁屏</button></div></div><div class="surface"><b style="font-size:13px">模型 API</b><p class="muted">连接后才能进行真实 AI 对话。密钥只保存在当前设备的 IndexedDB 中，不要把密钥写进公开代码。</p><label class="muted">接口地址</label><input class="text-input" v-model="apiBase" placeholder="https://你的服务地址/v1"><label class="muted" style="display:block;margin:12px 0 6px">API Key</label><input class="text-input" type="password" v-model="apiKey" placeholder="sk-…"><label class="muted" style="display:block;margin:12px 0 6px">模型名称</label><input class="text-input" v-model="modelName" placeholder="模型 ID"><button class="primary" style="margin-top:12px" @click="saveApi">保存 API 配置</button></div><div class="surface"><b style="font-size:13px">数据管理</b><p class="muted">当前数据保存在此浏览器的 IndexedDB。清除浏览器站点数据会删除本机内容。</p><button class="soft" @click="exportData">导出数据备份</button></div></template>
<template v-else-if="activeApp==='book'"><div class="section-label">WORLD BOOK</div><div class="surface"><b style="font-size:13px">世界书</b><p class="muted">保存背景设定、人物关系、地点和规则。关键词注入与前中后位将在后续接入聊天提示词。</p><textarea class="text-area" v-model="worldDraft" placeholder="写下一条世界设定…"></textarea><button class="primary" style="margin-top:10px" @click="addWorld">添加条目</button><div v-for="w in worlds" class="app-tile"><div class="tile-mark">界</div><div class="tile-copy"><b>{{w.text}}</b><small>{{w.date}}</small></div></div></div></template>
<template v-else><div class="section-label">COMING INTO BEING</div><div class="surface"><b style="font:24px Georgia;font-weight:400">{{appName(activeApp)}}</b><p class="muted">这个应用已经在里屋的桌面上。功能会逐步补齐，你可以先体验整体结构。</p></div></template>
</div></section>
<div v-if="controlOpen" class="control"><button class="close-control" @click="controlOpen=false">×</button><h2>控制中心</h2><p>{{dateText}} · 里屋的快捷设置</p><div class="control-grid"><button class="control-item" @click="night=!night;document.querySelector('.wallpaper').style.filter=night?'brightness(.65)':'none'">◐<b>外观</b><small>{{night?'夜间模式':'日间模式'}}</small></button><button class="control-item" @click="locked=true;controlOpen=false">⌑<b>锁定屏幕</b><small>返回锁屏</small></button><button class="control-item" @click="openApp('settings');controlOpen=false">⚙<b>设置</b><small>个性化与数据</small></button><button class="control-item" @click="controlOpen=false">⌂<b>返回桌面</b><small>关闭控制中心</small></button></div></div>
<div v-if="locked" class="lock"><div class="lock-time">{{clock}}</div><div class="lock-date">{{dateText}}</div><div class="lock-note">a quiet place to come home to.</div><button class="unlock" @click="locked=false">轻触进入里屋</button></div>
<div v-if="toast" class="toast">{{toast}}</div>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const {createApp,ref,computed,onMounted}=Vue;
createApp({setup(){
const apps=[
{id:'chat',name:'聊天',path:'M5 7.5A3.5 3.5 0 0 1 8.5 4h15A3.5 3.5 0 0 1 27 7.5v10a3.5 3.5 0 0 1-3.5 3.5H13l-6 5v-5.4a3.5 3.5 0 0 1-2-3.1z'},

const desktopPages=[apps.slice(0,8),apps.slice(8)];
const dockApps=[apps[0],apps[5],apps[6],apps[8]];
const activeApp=ref(''),homePage=ref(0),locked=ref(false),controlOpen=ref(false),night=ref(false),toast=ref('');
const now=ref(new Date()),clock=computed(()=>now.value.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})),day=computed(()=>String(now.value.getDate()).padStart(2,'0')),dateText=computed(()=>now.value.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}));
const friendName=ref(''),friendDraft=ref(''),personaDraft=ref(''),draft=ref(''),chatMessages=ref([]),memories=ref([]),memoryDraft=ref(''),memoryDraftOpen=ref(false),worlds=ref([]),worldDraft=ref(''),letters=ref([]),letterDraft=ref(''),photos=ref([]),musicLinks=ref([]),musicUrl=ref('');
const apiBase=ref(''),apiKey=ref(''),modelName=ref(''),touchStart=ref(0);
let db;
function notify(t){toast.value=t;setTimeout(()=>toast.value='',2200)}
function openApp(id){activeApp.value=id}
function closeApp(){activeApp.value=''}
function toggleControl(){controlOpen.value=!controlOpen.value}
function swipeHome(e){const dx=e.changedTouches[0].clientX-touchStart.value;if(Math.abs(dx)>70&&!activeApp.value){homePage.value=dx<0?Math.min(homePage.value+1,desktopPages.length-1):Math.max(0,homePage.value-1)}}
function appName(id){return apps.find(a=>a.id===id)?.name||'里屋'}
function persist(key,value){if(!db)return;const tx=db.transaction('data','readwrite');tx.objectStore('data').put(value,key)}
function load(key,fallback){return new Promise(resolve=>{if(!db)return resolve(fallback);const r=db.transaction('data').objectStore('data').get(key);r.onsuccess=()=>resolve(r.result??fallback);r.onerror=()=>resolve(fallback)})}
async function savePersona(){friendName.value=friendDraft.value.trim();persist('friendName',friendName.value);persist('persona',personaDraft.value);notify(friendName.value?'角色档案已保存':'请先填写角色名称')}
function sendMessage(){const text=draft.value.trim();if(!text)return;chatMessages.value.push({id:Date.now(),role:'me',text,time:clock.value});draft.value='';persist('chatMessages',chatMessages.value);notify('消息已保存。配置模型后即可启用 AI 回复。')}
function addMemory(){if(!memoryDraft.value.trim())return;memories.value.unshift({text:memoryDraft.value.trim(),date:dateText.value});memoryDraft.value='';memoryDraftOpen.value=false;persist('memories',memories.value)}
function addWorld(){if(!worldDraft.value.trim())return;worlds.value.unshift({text:worldDraft.value.trim(),date:dateText.value});worldDraft.value='';persist('worlds',worlds.value)}
function saveLetter(){if(!letterDraft.value.trim())return;letters.value.unshift({text:letterDraft.value.trim(),date:dateText.value});letterDraft.value='';persist('letters',letters.value);notify('已放进信箱')}
function saveMusic(){if(!musicUrl.value.trim())return;musicLinks.value.unshift(musicUrl.value.trim());musicUrl.value='';persist('musicLinks',musicLinks.value);notify('音乐链接已保存')}
async function savePhoto(e){const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file);photos.value.push({url,name:file.name});notify('图片已载入当前页面。持久化相册正在完善')}
function saveApi(){persist('api',{base:apiBase.value,key:apiKey.value,model:modelName.value});notify('API 配置已保存在本机')}
function exportData(){const data={friendName:friendName.value,persona:personaDraft.value,chatMessages:chatMessages.value,memories:memories.value,worlds:worlds.value,letters:letters.value,musicLinks:musicLinks.value};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='liwu-backup.json';a.click();URL.revokeObjectURL(a.href)}
onMounted(async()=>{setInterval(()=>now.value=new Date(),1000);try{const req=indexedDB.open('liwu-phone',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=async()=>{db=req.result;for(const [key,state] of Object.entries({friendName,persona:personaDraft,chatMessages,memories,worlds,letters,musicLinks})){const v=await load(key,state.value);state.value=v}friendDraft.value=friendName.value;const api=await load('api',{});apiBase.value=api.base||'';apiKey.value=api.key||'';modelName.value=api.model||''};req.onerror=()=>notify('本浏览器无法使用 IndexedDB，请更换浏览器') }catch(e){notify('本浏览器无法使用 IndexedDB，请更换浏览器')}});
return{apps,desktopPages,dockApps,activeApp,homePage,locked,controlOpen,night,toast,clock,day,dateText,friendName,friendDraft,personaDraft,draft,chatMessages,memories,memoryDraft,memoryDraftOpen,worlds,worldDraft,letters,letterDraft,photos,musicLinks,musicUrl,apiBase,apiKey,modelName,touchStart,openApp,closeApp,toggleControl,swipeHome,appName,savePersona,sendMessage,addMemory,addWorld,saveLetter,saveMusic,savePhoto,saveApi,exportData}
}}).mount('#app');
