<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#eef3fb">
<meta name="description" content="里屋 · 雨夜书房。屋子不大，够两个人住。">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>里屋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230a0908%27/%3E%3Crect x=%2715.4%27 y=%278%27 width=%271.2%27 height=%2716%27 fill=%27%23c9a84c%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=40">
<style>
/* ===== 基础覆盖 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#eef3fb;color:#33445f;font-family:'Noto Serif SC',serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}

/* 3D 容器 */
#scene-container{position:fixed;inset:0;z-index:1}
#scene-container canvas{display:block;width:100%;height:100%;touch-action:none}

/* 模式切换：desk 时显示 3D，隐藏 2D UI */
body:not(.desk) #scene-container{display:none}
body.desk #app,
body.desk .scrim,
body.desk .drawer,
body.desk .view,
body.desk .back-gate{display:none}

/* 加载 */
#loader{position:fixed;inset:0;z-index:200;background:#eef3fb;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s}
#loader .t{font-family:'Noto Serif SC',serif;font-size:20px;letter-spacing:.35em;color:#a7a0dc}
#loader .s{font-size:11px;color:#5a4e42;margin-top:14px;letter-spacing:.12em}
#loader.done{opacity:0;pointer-events:none}

/* 标题 */
.room-title{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none;transition:opacity .6s;opacity:0;animation:fadeInTitle 1.5s 1.2s forwards}
.room-title .cn{font-family:'Noto Serif SC',serif;font-size:22px;letter-spacing:.28em;color:rgba(66,82,119,.78)}
.room-title .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;letter-spacing:.18em;color:rgba(93,110,147,.56);margin-top:5px}
@keyframes fadeInTitle{to{opacity:1}}

/* 场景导航 */
.scene-nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:30;display:flex;gap:8px;padding:6px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(247,250,255,.68);box-shadow:0 8px 28px rgba(75,101,150,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.scene-nav button{appearance:none;border:0;border-radius:999px;padding:9px 18px;background:transparent;color:#667895;font:400 12px 'Noto Serif SC',serif;letter-spacing:.12em;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.scene-nav button.active{background:rgba(255,255,255,.92);color:#526b9a;box-shadow:0 2px 10px rgba(77,102,151,.12)}
.scene-nav button:active{transform:scale(.97)}
@media(max-width:480px){.scene-nav{bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}.scene-nav button{padding:8px 15px}}

/* 提示 */
.hint-3d{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:10px;letter-spacing:.22em;color:rgba(82,101,139,.58);z-index:10;pointer-events:none;transition:opacity .6s;opacity:0;animation:fadeInHint 1.5s 2s forwards}
@keyframes fadeInHint{to{opacity:1}}

/* 常规二维界面：关闭 3D 展示层，恢复聊天主界面 */
#scene-container,.room-title,.hint-3d,.scene-nav,#loader{display:none!important}
#app{display:flex!important}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body data-theme="paper">

<!-- 加载 -->
<div id="loader">
  <div class="t">里屋</div>
  <div class="s">正在布置雨夜书房……</div>
</div>

<!-- 3D 场景 -->
<div id="scene-container"></div>

<!-- 标题 -->
<div class="room-title">
  <div class="cn">里屋</div>
  <div class="en">Rainy Night Study</div>
</div>

<!-- 提示 -->
<div class="hint-3d">单指拖动探索 · 双指缩放 · 点击物件聚焦</div>
<nav class="scene-nav" aria-label="空间视角"><button type="button" id="deskViewBtn" class="active">桌面</button><button type="button" id="windowViewBtn">窗边</button></nav>

<!-- App —— 与原有结构完全一致 -->
<div id="app">
  <header class="top">
    <button class="icon" id="menuBtn" type="button" aria-label="会话列表">≡</button>
    <div class="top-mid"><span class="top-title" id="topTitle">里屋</span><span class="top-sub" id="topSub"></span></div>
    <div class="top-right"><span class="days" id="topDays"></span><button class="icon" id="newBtn" type="button" aria-label="新的一段">＋</button></div>
  </header>
  <main class="thread" id="thread"></main>
  <footer class="composer">
    <form class="in-row" id="form">
      <textarea id="input" rows="1" placeholder="说一句" autocapitalize="off"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="发">↑</button>
      <button class="stop" id="stopBtn" type="button" aria-label="停" hidden>■</button>
    </form>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-in">
    <div class="drawer-top"><span class="brandmark">里屋</span><span class="drawer-days" id="drawerDays"></span></div>
    <button class="newchat" id="newChat" type="button">新的一段</button>
    <input class="search" id="search" placeholder="找一段话" autocomplete="off">
    <div class="sessions" id="sessions"></div>
    <nav class="drawer-nav">
      <button type="button" data-view="home">回桌子</button>
      <button type="button" data-view="diary">日记</button>
      <button type="button" data-view="album">相册</button>
      <button type="button" data-view="memory">记忆</button>
      <button type="button" data-view="settings">设置</button>
    </nav>
  </div>
</aside>

<section class="view" id="view" hidden>
  <header class="view-top">
    <button class="icon" id="viewBack" type="button" aria-label="回去">←</button>
    <span class="view-title" id="viewTitle"></span><span class="view-en" id="viewEn"></span>
  </header>
  <div class="view-body" id="viewBody"></div>
</section>

<button class="back-gate" id="backGate" type="button">回桌子</button>

<script>
window.addEventListener('error', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.message || '未知');
});
window.addEventListener('unhandledrejection', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.reason && e.reason.message || '未知');
});
</script>
<script src="data.js?v=39"></script>

<script src="assets/app.js?v=39"></script>
</body>
</html>
