<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F7F8FA">
<meta name="description" content="里屋 · 两个人的私人 AI 伴侣空间。">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>里屋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23111519%27/%3E%3Crect x=%2715.4%27 y=%278%27 width=%271.2%27 height=%2716%27 fill=%27%2391A4BC%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=45">
</head>
<body data-theme="paper">



<!-- App —— 与原有结构完全一致 -->
<section class="home-screen" id="homeScreen" aria-label="里屋首页">
  <header class="home-top"><button class="icon" id="homeMenuBtn" type="button" aria-label="打开导航">≡</button><span class="home-brand">里屋</span><span class="home-day" id="homeDays"></span></header>
  <main class="home-content" id="homeContent">
    <section class="home-portrait"><div class="home-kicker">只属于我们的日常</div><div class="home-identity"><div class="home-avatar home-avatar-you">我</div><span class="home-heart">和</span><div class="home-avatar home-avatar-him">祁</div></div><h1>你和宋祁</h1><p class="home-quote" id="homeHero"></p><div class="home-count"><strong id="homeCount">—</strong><span>相伴的日子</span></div></section>
    <section class="home-feature-row"><button class="home-chat" type="button" data-home-go="chat"><span class="home-feature-kicker">现在就去</span><strong>和宋祁说说话</strong><span class="home-feature-arrow">↗</span></button><button class="home-photo" type="button" data-home-go="album"><span class="home-feature-kicker">一起留下</span><strong>我们的相册</strong><span class="home-photo-mark">◌</span></button></section>
    <section class="home-lower"><div class="home-section"><div class="home-section-head"><span>共同生活</span><button type="button" data-home-go="diary">打开日记 ↗</button></div><div class="home-diary" id="homeDiary"></div></div><div class="home-section home-memory-section"><div class="home-section-head"><span>记得的事</span><button type="button" data-home-go="memory">更多记忆 ↗</button></div><div class="home-memory" id="homeMemory"></div></div></section>
  </main>
  <nav class="home-tabbar" aria-label="首页快捷导航"><button class="home-tab active" type="button" data-home-tab="home"><span>⌂</span><small>首页</small></button><button class="home-tab" type="button" data-home-tab="chat"><span>◌</span><small>聊天</small></button><button class="home-tab" type="button" data-home-tab="diary"><span>▤</span><small>日常</small></button><button class="home-tab" type="button" data-home-tab="settings"><span>⌘</span><small>设置</small></button></nav>
</section>
<div id="app" hidden>
  <header class="top">
    <button class="icon" id="menuBtn" type="button" aria-label="打开导航">≡</button>
    <div class="top-mid"><span class="top-title" id="topTitle">里屋</span><span class="top-sub" id="topSub"></span></div>
    <div class="top-right"><span class="days" id="topDays"></span><button class="icon" id="newBtn" type="button" aria-label="新的一段">＋</button></div>
  </header>
  <main class="thread" id="thread"></main>
  <footer class="composer">
    <form class="in-row" id="form">
      <textarea id="input" rows="1" placeholder="说一句" autocapitalize="off" aria-label="发消息给宋祁"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="发">↑</button>
      <button class="stop" id="stopBtn" type="button" aria-label="停" hidden>■</button>
    </form>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-in">
    <div class="drawer-top"><div><span class="brandmark">里屋</span><span class="drawer-caption">LIWU · PRIVATE SPACE</span></div><span class="drawer-days" id="drawerDays"></span></div>
    <div class="drawer-presence"><span class="presence-mark" aria-hidden="true"></span><div><strong>两个人的空间</strong><small>只在这里，慢慢生活</small></div></div>
    <button class="newchat" id="newChat" type="button">新的一段</button>
    <input class="search" id="search" placeholder="找一段话" autocomplete="off" aria-label="搜索会话">
    <div class="sessions" id="sessions"></div>
    <div class="drawer-section-label">相处</div>
    <nav class="drawer-nav" aria-label="空间导航">
      <button type="button" data-view="chat" class="nav-current"><span class="nav-index">01</span><span class="nav-copy"><strong>聊天</strong><small>继续说话</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
      <div class="drawer-section-label nav-subhead">共同生活</div>
      <button type="button" data-view="diary"><span class="nav-index">02</span><span class="nav-copy"><strong>日记</strong><small>写下今天</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
      <button type="button" data-view="album"><span class="nav-index">03</span><span class="nav-copy"><strong>相册</strong><small>留下照片</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
      <button type="button" data-view="memory"><span class="nav-index">04</span><span class="nav-copy"><strong>记忆</strong><small>重要的事</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
      <div class="drawer-section-label nav-subhead">空间管理</div>
      <button type="button" data-view="settings"><span class="nav-index">05</span><span class="nav-copy"><strong>设置</strong><small>连接与外观</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
    </nav>
    <div class="drawer-foot">A SMALL SPACE FOR TWO</div>
  </div>
</aside>

<section class="view" id="view" hidden>
  <header class="view-top">
    <button class="icon" id="viewBack" type="button" aria-label="回去">←</button>
    <span class="view-title" id="viewTitle"></span><span class="view-en" id="viewEn"></span>
  </header>
  <div class="view-body" id="viewBody"></div>
</section><script>
window.addEventListener('error', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.message || '未知');
});
window.addEventListener('unhandledrejection', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.reason && e.reason.message || '未知');
});
</script>
<script src="data.js?v=39"></script>

<script src="assets/app.js?v=44"></script>
</body>
</html>
