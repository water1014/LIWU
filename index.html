  /* ---------------- sending & replying ---------------- */
  async send(chatId, text, opts) {
    text = (text || '').trim();
    if (!text) return;
    state.typing[chatId] = true;
    await A.appendMessage(chatId, 'user', text, { narration: opts && opts.narration ? true : false });
    A.scheduleReply(chatId);
  },

  scheduleReply(chatId) {
    clearTimeout(timers[chatId]);
    state.typing[chatId] = true;
    const wait = 3000 + Math.random() * 4000;
    timers[chatId] = setTimeout(() => A.runReply(chatId), wait);
  },

  async runReply(chatId) {
    const chat = A.chatById(chatId);
    if (!chat) { state.typing[chatId] = false; return; }
    const char = A.charById(chat.charId);
    try {
      const cfg = A.pickApi(char);
      let raw;
      if (cfg && cfg.key) {
        raw = await A.callAPI(cfg, A.buildChatMessages(chat, char));
      } else {
        await new Promise((r) => setTimeout(r, 260));
        raw = A.mockReply(chat, char);
      }
      raw = (raw || '').trim();
      if (!raw) throw new Error('空回复');
      state.typing[chatId] = false;
      await A.appendMessage(chatId, 'char', raw);
    } catch (e) {
      state.typing[chatId] = false;
      A.toast('接口调用失败，已使用本地模拟：' + (e.message || ''), 2600);
      const raw = A.mockReply(chat, char);
      await A.appendMessage(chatId, 'char', raw);
    }
  },

  async regenerate(chatId, msgId) {
    const arr = state.msgs[chatId] || [];
    const idx = arr.findIndex((m) => m.id === msgId);
    if (idx < 0) return;
    const cut = arr.slice(idx);
    for (const m of cut) await DB.del('messages', m.id);
    state.msgs[chatId] = arr.slice(0, idx);
    if (!state.msgs[chatId].length) {
      const chat = A.chatById(chatId);
      if (chat) chat.seq = 0;
    }
    A.scheduleReply(chatId);
  },

  pickApi(char) {
    const list = state.cfg.api || [];
    if (!list.length) return null;
    const id = char && char.apiId && char.apiId !== 'inherit' ? char.apiId : null;
    return (id && list.find((a) => a.id === id)) || list.find((a) => a.isDefault) || list[0];
  },

  async callAPI(cfg, messages) {
    const base = (cfg.baseUrl || '').replace(/\/+$/, '');
    if (!base) throw new Error('未填写 Base URL');
    let url, headers = { 'Content-Type': 'application/json' }, body;
    if (cfg.protocol === 'anthropic') {
      url = base + '/messages';
      headers['x-api-key'] = cfg.key;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
      body = { model: cfg.model, max_tokens: cfg.maxTokens || 1024, temperature: cfg.temp == null ? 0.9 : cfg.temp, system: messages.filter((m) => m.role === 'system').map((m) => m.content).join('\n\n'), messages: messages.filter((m) => m.role !== 'system').map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
    } else if (cfg.protocol === 'gemini') {
      url = base + '/models/' + cfg.model + ':generateContent?key=' + encodeURIComponent(cfg.key);
      body = { contents: messages.filter((m) => m.role !== 'system').map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), systemInstruction: { parts: [{ text: messages.filter((m) => m.role === 'system').map((m) => m.content).join('\n\n') }] } };
    } else {
      url = base + '/chat/completions';
      headers['Authorization'] = 'Bearer ' + cfg.key;
      body = { model: cfg.model, messages, temperature: cfg.temp == null ? 0.9 : cfg.temp, max_tokens: cfg.maxTokens || 1024 };
    }
    const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
    const txt = await res.text();
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + txt.slice(0, 90));
    let data;
    try { data = JSON.parse(txt); } catch (e) { throw new Error('返回不是 JSON'); }
    if (cfg.protocol === 'anthropic') return (data.content || []).map((c) => c.text || '').join('');
    if (cfg.protocol === 'gemini') return ((data.candidates || [])[0] || {}).content?.parts?.map((p) => p.text).join('') || '';
    return (data.choices || [])[0]?.message?.content || '';
  },

  async fetchModels(cfg) {
    const base = (cfg.baseUrl || '').replace(/\/+$/, '');
    if (!base) throw new Error('请先填写 Base URL');
    if (cfg.protocol === 'anthropic') throw new Error('Anthropic 协议不支持模型列表，请手动填写');
    const res = await fetch(base + '/models', { headers: cfg.key ? { Authorization: 'Bearer ' + cfg.key } : {} });
    if (!res.ok) throw new Error('拉取失败 HTTP ' + res.status);
    const data = await res.json();
    return (data.data || data.models || []).map((m) => m.id || m.name).filter(Boolean);
  },

  /* ---------------- prompt assembly ---------------- */
  blockContent(blockId, chat, char) {
    const user = state.account || { name: '我', persona: '' };
    const all = (state.msgs[chat.id] || []);
    if (blockId === 'system') {
      return [
        '你是「' + char.name + '」，正在与「' + user.name + '」进行线上聊天。',
        '严格只输出角色本身的回复，不要解释、不要跳出角色。',
        '每次回复先输出 <think>内心想法</think>，再进行正文输出。',
        '旁白使用 <narratage>旁白</narratage> 包裹，居中呈现，每段不超过 50 字，旁白不超过全文一半。',
        '不同的聊天气泡之间用两个换行分隔。每次回复 1-6 句话语，可以没有旁白，但不能没有话语。',
        '不要模仿历史消息的格式，不要替用户说话，不要输出时间戳，不要输出任何审美/排版指令。'
      ].join('\n');
    }
    if (blockId === 'persona') {
      return [
        '姓名：' + char.name + '｜性别：' + char.gender,
        char.persona ? '人设：' + char.persona : '',
        char.background ? '背景：' + char.background : '',
        char.jung ? '荣格八维：' + char.jung : '',
        char.mbti ? '十六型人格：' + char.mbti : '',
        char.taboos ? '禁忌：' + char.taboos : '',
        char.examples ? '参考对话：\n' + char.examples : ''
      ].filter(Boolean).join('\n');
    }
    if (blockId === 'user') {
      return ['用户昵称：' + user.name, user.gender ? '性别：' + user.gender : '', user.persona ? '人设：' + user.persona : '', user.jung ? '荣格八维：' + user.jung : '', user.mbti ? '十六型人格：' + user.mbti : ''].filter(Boolean).join('\n');
    }
    if (blockId.indexOf('world_') === 0) {
      const pos = blockId.replace('world_', '');
      const books = state.worldbooks.filter((b) => (char.worldbookIds || []).includes(b.id));
      const recent = all.slice(-6).map((m) => m.raw).join(' ');
      const lines = [];
      books.forEach((b) => {
        (b.entries || []).forEach((e) => {
          if (e.enabled === false) return;
          if (e.position !== pos) return;
          if (e.mode === 'always') lines.push('· ' + e.name + '：' + e.content);
          else if (e.mode === 'keyword' && (e.keys || []).some((k) => k && recent.includes(k))) lines.push('· ' + e.name + '：' + e.content);
          else if (e.mode === 'random' && Math.random() * 100 < (e.probability || 30)) lines.push('· ' + e.name + '：' + e.content);
        });
      });
      return lines.join('\n');
    }
    if (blockId === 'memory') {
      const perm = state.memories.filter((m) => m.charId === char.id && m.type === 'permanent');
      const idx = state.memories.filter((m) => m.charId === char.id && m.type === 'index');
      const short = state.memories.filter((m) => m.charId === char.id && m.type === 'short');
      const recent = all.slice(-4).map((m) => m.raw).join(' ');
      const hit = idx.filter((m) => (m.keywords || []).some((k) => k && recent.includes(k))).slice(0, 4);
      const parts = [];
      if (perm.length) parts.push('【底色】' + perm.map((m) => m.content).join('；'));
      if (hit.length) parts.push('【相关主题】' + hit.map((m) => m.title + '：' + m.content).join('；'));
      if (short.length) parts.push('【最近】' + short[short.length - 1].content);
      return parts.join('\n');
    }
    if (blockId === 'context') {
      const recent = all.slice(-24);
      return recent.map((m) => {
        const who = m.role === 'user' ? user.name : char.name;
        const tag = m.role === 'user' ? '用户' : '好友';
        const time = chat.timeAware ? '[' + U.fullTime(m.ts) + ']' : '';
        const body = m.raw.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
        const narr = [];
        body.replace(/<narratage>([\s\S]*?)<\/narratage>/gi, (_, t) => { narr.push(t.trim()); return ''; });
        const spoken = body.replace(/<narratage>[\s\S]*?<\/narratage>/gi, '').replace(/\n{2,}/g, ' / ').replace(/\n/g, ' ').trim();
        return time + '#' + m.seq + '（' + tag + '｜' + who + '）：“' + spoken + '”' + (narr.length ? '\n<narratage>' + narr.join('</narratage>\n<narratage>') + '</narratage>' : '');
      }).join('\n');
    }
    return '';
  },

  buildChatMessages(chat, char) {
    const order = (state.cfg.prompts.chat || []);
    let system = '';
    const turns = [];
    order.forEach((b) => {
      if (!b.enabled) return;
      const c = A.blockContent(b.id, chat, char);
      if (!c) return;
      if (b.id === 'context') {
        turns.push({ role: 'user', content: '以下是最近的聊天记录：\n' + c });
      } else {
        system += '\n\n【' + (PROMPT_DEFS.chat.find((d) => d.id === b.id) || {}).label + '】\n' + c;
      }
    });
    const arr = [{ role: 'system', content: system.trim() }];
    const recent = (state.msgs[chat.id] || []).slice(-10);
    recent.forEach((m) => {
      const clean = m.raw.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
      if (clean) arr.push({ role: m.role === 'user' ? 'user' : 'assistant', content: clean });
    });
    arr.push({ role: 'user', content: '请以' + char.name + '的身份继续这段对话，直接输出格式化的回复。' });
    return arr;
  },

  /* ---------------- local mock writer ---------------- */
  mockReply(chat, char) {
    const arr = state.msgs[chat.id] || [];
    const last = [...arr].reverse().find((m) => m.role === 'user');
    const text = last ? U.stripTags(last.raw) : '你好';
    const topic = U.clip(text.replace(/[？?！!。，,]/g, '').slice(0, 14), 14) || '这件事';
    const seed = parseInt(U.hash(text + arr.length), 36);
    const pick = (a) => a[seed % a.length];
    const thinks = [
      '（' + topic + '。他愿意说这个，说明多少是信任我的。先接住，不要急着给结论。）',
      '（这句话底下有别的东西。' + topic + '只是表面，我得让他自己再往下说一点。）',
      '（我不想把话说得太满。' + topic + '这件事，我更想知道他此刻的感受，而不是对错。）',
      '（他大概已经想很久了。我先回应情绪，再谈别的。）'
    ];
    const narrs = [
      '窗外的光挪到桌角，' + char.name + '把杯子往里推了推。',
      '屏幕亮着，' + char.name + '看了很久，才慢慢打字。',
      '风从半开的窗灌进来，' + char.name + '拢了拢袖口。',
      '那边沉默了一小会儿，才跳出一行字。'
    ];
    const open = [
      '嗯，我在听。',
      '你说的「' + topic + '」，我记住了。',
      '我刚刚也正好在想这件事。',
      '不用急着说得很清楚。'
    ];
    const mid = [
      '不过我更想知道，你现在是真的想解决它，还是只是想有个人在旁边？',
      '你先别急着替别人找理由——你自己呢，你难不难受？',
      '如果是我，大概会先停下来一晚。不是因为想通了，是因为太累了。',
      '这件事没有标准答案，但我可以陪你把它拆开看。'
    ];
    const end = [
      '慢慢说，我不走。',
      '你要是愿意，我们从最小的一步开始。',
      '不用回得很漂亮，说人话就行。',
      '今晚先到这儿也可以，我在。'
    ];
    const useTool = /记得|以前|上次|曾经|记忆|那时候/.test(text) || seed % 5 === 0;
    let out = '<think>' + pick(thinks) + '</think>\n';
    out += '<narratage>' + pick(narrs) + '</narratage>\n\n';
    if (useTool) {
      out += '<tool name="memory.search">{"query":"' + topic + '"} → 命中索引记忆 1 条 · 原始对话 ' + (2 + (seed % 4)) + ' 条</tool>\n\n';
    }
    out += pick(open) + '\n\n' + pick(mid) + pick(end);
    return out;
  },

  /* ---------------- memory ---------------- */
  async maybeSummarize(chat) {
    const arr = state.msgs[chat.id] || [];
    const threshold = state.cfg.memory.threshold || 50;
    if (arr.length < threshold) return;
    if (chat.lastSummaryAt && arr.length - chat.lastSummaryAt < threshold) return;
    await A.summarize(chat, true);
  },

  async summarize(chat, auto) {
    const char = A.charById(chat.charId);
    const arr = state.msgs[chat.id] || [];
    if (arr.length < 2) { A.toast('消息太少，暂时无法总结'); return; }
    state.busy = 'summary';
    try {
      const batch = arr.slice(-Math.min(arr.length, 60));
      let summary, topics;
      let cfg = A.pickApi(char);
      const memId = state.cfg.memory.apiId;
      if (memId && memId !== 'inherit') {
        const found = (state.cfg.api || []).find((a) => a.id === memId);
        if (found) cfg = found;
      }
      if (cfg && cfg.key) {
        const prompt = '请把下面的聊天压缩成一段记忆，并给出 3-5 个主题关键词。输出 JSON：{"summary":"...","topics":["..."]}\n\n' +
          batch.map((m) => (m.role === 'user' ? '用户：' : char.name + '：') + U.stripTags(m.raw)).join('\n');
        const out = await A.callAPI(cfg, [{ role: 'user', content: prompt }]);
        try {
          const j = JSON.parse(out.replace(/```json|```/g, '').trim());
          summary = j.summary; topics = j.topics || [];
        } catch (e) { summary = out.slice(0, 240); topics = []; }
      } else {
        const userLines = batch.filter((m) => m.role === 'user').map((m) => U.stripTags(m.raw)).filter(Boolean);
        summary = '在最近 ' + batch.length + ' 条消息里，' + (state.account ? state.account.name : '用户') + '与' + char.name + '主要围绕「' +
          U.clip(userLines.slice(-3).join('；') || '日常', 46) + '」展开。' + char.name + '保持了' +
          (char.persona ? U.clip(char.persona, 18) : '一贯的') + '的回应方式，情绪基调偏' + (batch.length % 2 ? '安静' : '松弛') + '。';
        topics = [U.clip(userLines[userLines.length - 1] || '日常', 6), char.name + '的回应', '近况'];
      }
      const short = {
        id: U.uid('mem'), accountId: state.account.id, charId: char.id, type: 'short',
        title: '短时记忆 · ' + U.dayLabel(Date.now()), content: summary, ts: Date.now(),
        chatId: chat.id, range: [batch[0].seq, batch[batch.length - 1].seq], auto: !!auto
      };
      await DB.put('memories', JSON.parse(JSON.stringify(short)));
      state.memories.push(short);
      const index = {
        id: U.uid('mem'), accountId: state.account.id, charId: char.id, type: 'index',
        title: U.clip(topics[0] || '一段对话', 12), content: summary,
        keywords: topics.slice(0, 5), ts: Date.now(), chatId: chat.id,
        msgIds: batch.map((m) => m.id), shortId: short.id, auto: !!auto
      };
      await DB.put('memories', JSON.parse(JSON.stringify(index)));
      state.memories.push(index);
      chat.lastSummaryAt = batch.length;
      await DB.put('chats', JSON.parse(JSON.stringify(chat)));
      A.refreshSizes();
      A.toast(auto ? '已自动生成一段短时记忆' : '已总结 ' + batch.length + ' 条消息');
    } catch (e) {
      A.toast('总结失败：' + (e.message || e));
    } finally {
      state.busy = '';
    }
  },

  async addMemory(m) {
    const rec = Object.assign({ id: U.uid('mem'), accountId: state.account.id, ts: Date.now() }, m);
    await DB.put('memories', JSON.parse(JSON.stringify(rec)));
    state.memories.push(rec);
    A.refreshSizes();
  },
  async deleteMemory(id) {
    await DB.del('memories', id);
    state.memories = state.memories.filter((m) => m.id !== id);
    A.refreshSizes();
  },

  /* ---------------- worldbook ---------------- */
  async saveBook(book) {
    if (book.id) {
      const b = state.worldbooks.find((x) => x.id === book.id);
      Object.assign(b, book, { updatedAt: Date.now() });
      await DB.put('worldbooks', JSON.parse(JSON.stringify(b)));
      return b;
    }
    const rec = Object.assign({ id: U.uid('wb'), accountId: state.account.id, entries: [], createdAt: Date.now() }, book);
    await DB.put('worldbooks', JSON.parse(JSON.stringify(rec)));
    state.worldbooks.push(rec);
    return rec;
  },
  async deleteBook(id) {
    await DB.del('worldbooks', id);
    state.worldbooks = state.worldbooks.filter((b) => b.id !== id);
    state.chars.forEach(async (c) => {
      if ((c.worldbookIds || []).includes(id)) {
        c.worldbookIds = c.worldbookIds.filter((x) => x !== id);
        await DB.put('characters', JSON.parse(JSON.stringify(c)));
      }
    });
  },

  /* ---------------- layout ---------------- */
  layout() { return state.cfg.layout; },
  appInLayout(app) {
    return (state.cfg.layout.dock || []).includes(app) ||
      state.cfg.layout.pages.some((p) => p.some((it) => it.kind === 'app' && it.app === app));
  },
  openApp(appId) {
    const app = APPS[appId];
    if (!app) return;
    A.go(app.route);
  },
  resetLayout() {
    state.cfg.layout = defaultCfg().layout;
    state.cfg.removedApps = [];
    state.layoutKey++;
    saveCfg();
    A.recomputeSizes();
  },
  removeAppFromHome(appId) {
    state.cfg.layout.pages.forEach((p) => {
      for (let i = p.length - 1; i >= 0; i--) if (p[i].kind === 'app' && p[i].app === appId) p.splice(i, 1);
    });
    state.cfg.layout.dock = state.cfg.layout.dock.filter((x) => x !== appId);
    state.cfg.removedApps = Array.from(new Set([...(state.cfg.removedApps || []), appId]));
    state.layoutKey++;
    saveCfg();
  },
  restoreApp(appId) {
    const page = state.cfg.layout.pages[0];
    const free = A.findFree(page, 1, 1);
    page.push({ id: U.uid('app'), x: free.x, y: free.y, w: 1, h: 1, kind: 'app', app: appId });
    state.cfg.removedApps = (state.cfg.removedApps || []).filter((x) => x !== appId);
    state.layoutKey++;
    saveCfg();
  },
  findFree(items, w, h, skipId) {
    const occ = (x, y, it) => x < it.x + it.w && x + w > it.x && y < it.y + it.h && y + h > it.y;
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x <= 4 - w; x++) {
        if (!items.some((it) => it.id !== skipId && occ(x, y, it))) return { x, y };
      }
    }
    return { x: 0, y: 0 };
  },

  /* ---------------- storage view ---------------- */
  async refreshSizes() {
    try {
      state.sizes = await DB.sizes();
      A.recomputeSizes();
    } catch (e) { /* ignore */ }
  },
  recomputeSizes() {
    const wrap = state.sizes.map((s) => Object.assign({}, s));
    const totalBytes = wrap.reduce((a, b) => a + b.bytes, 0);
    state.storageTotal = totalBytes;
  },
  async clearVars(which) {
    if (which === 'all') { await DB.wipeAll(); location.reload(); return; }
    await DB.wipeStore(which);
    A.toast('已清空「' + (DB.LABEL[which] || which) + '」');
    await A.refreshSizes();
  },

  /* ---------------- global beauty (home only) ---------------- */
  applyGlobalBeauty() {
    const css = state.cfg.ui.css || '';
    const js = state.cfg.ui.js || '';
    let el = document.getElementById('liwu-user-css');
    if (!el) { el = document.createElement('style'); el.id = 'liwu-user-css'; document.head.appendChild(el); }
    el.textContent = css ? A.scopeCss(css) : '';
    clearTimeout(A._jsT);
    A._jsT = setTimeout(() => {
      if (!js) return;
      try {
        const box = document.getElementById('home-stage');
        if (!box) return;
        const fn = new Function('root', 'toast', 'with (window) {' + js + '}');
        fn(box, A.toast);
      } catch (e) { A.toast('JS 片段错误：' + e.message); }
    }, 120);
  },
  scopeCss(css) {
    // home-only fence: every top-level selector is prefixed with #home-stage
    return css.replace(/(^|\})\s*([^@}{]+)\{/g, (m, brace, sel) => {
      if (!sel.trim()) return m;
      const scoped = sel.split(',').map((s) => '#home-stage ' + s.trim()).join(',');
      return brace + scoped + '{';
    });
  },

  go() { /* replaced by router */ }
};

HOME.Home = {
  components: { 'pc-card': HOME.Postcard, 'pol-card': HOME.Polaroid, 'music-card': HOME.Music, 'dlg-card': HOME.Dialog },
  data() {
    return {
      S, editing: false, press: null, drag: null, dragStyle: {},
      sheet: '', postForm: null, tick: null, suppressClick: false, pageTimer: 0
    };
  },
  computed: {
    layout() { return S.cfg.layout; },
    pages() { return this.layout.pages; },
    dock() { return this.layout.dock; },
    home() { return S.cfg.home; },
    wallStyle() {
      const k = S.cfg.ui.wallpaperKey;
      if (k && S.imgCache[k]) return { backgroundImage: 'url(' + S.imgCache[k] + ')' };
      const p = (window.WALLS && WALLS[S.cfg.ui.wallpaperPreset || 0]) || null;
      return p ? { backgroundImage: p.css } : {};
    },
    hasWall() { return !!(S.cfg.ui.wallpaperKey && S.imgCache[S.cfg.ui.wallpaperKey]); }
  },
  watch: {
    'S.cfg.ui.wallpaperKey': { immediate: true, handler(k) { if (k) A.resolveImg(k); } },
    editing(v) { S.editing = v; }
  },
  mounted() {
    this.tick = setInterval(() => {
      if (!S.musicPlaying) return;
      const m = S.cfg.home.music;
      m.played += 1;
      if (m.played >= m.dur) { m.played = 0; S.musicPlaying = false; }
    }, 1000);
  },
  beforeUnmount() { clearInterval(this.tick); },
  methods: {
    meta(id) { return window.appMeta(id); },
    cellStyle(it) {
      return {
        gridColumn: (it.x + 1) + ' / span ' + it.w,
        gridRow: (it.y + 1) + ' / span ' + it.h
      };
    },
    dragStyleFor(id, appId) {
      if (!this.drag) return {};
      const same = id ? this.drag.id === id : this.drag.appId === appId;
      return same ? { transform: 'translate(' + this.drag.dx + 'px,' + this.drag.dy + 'px) scale(1.06)', zIndex: 90, position: 'relative' } : {};
    },
    onScroll() {
      const el = this.$refs.pages;
      S.homePage = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
    },
    gotoPage(i) {
      const el = this.$refs.pages;
      el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
    },
    /* ---------- press / long press / drag ---------- */
    downGrid(e, it, pi) {
      if (e.button && e.button !== 0) return;
      this.beginPress(e, { from: 'grid', it, pi });
    },
    downDock(e, appId, index) {
      if (e.button && e.button !== 0) return;
      this.beginPress(e, { from: 'dock', appId, index });
    },
    beginPress(e, ctx) {
      this.suppressClick = false;
      const p = Object.assign({ sx: e.clientX, sy: e.clientY, moved: false, long: false }, ctx);
      p.timer = setTimeout(() => {
        p.long = true;
        this.editing = true;
        this.suppressClick = true;
        if (navigator.vibrate) navigator.vibrate(8);
      }, 460);
      this.press = p;
      window.addEventListener('pointermove', this.move);
      window.addEventListener('pointerup', this.up, { once: true });
      window.addEventListener('pointercancel', this.up, { once: true });
    },
    move(e) {
      const p = this.press;
      if (!p) return;
      const dx = e.clientX - p.sx, dy = e.clientY - p.sy;
      const dist = Math.hypot(dx, dy);
      if (dist > 7) {
        p.moved = true;
        clearTimeout(p.timer);
      }
      if (!this.drag && p.moved && this.editing && dist > 7) {
        this.drag = Object.assign({ dx: 0, dy: 0 }, p.it ? { id: p.it.id } : { appId: p.appId });
      }
      if (this.drag) {
        this.drag.dx = dx; this.drag.dy = dy;
        this.edgeFlip(e.clientX);
      }
    },
    edgeFlip(x) {
      const scr = document.querySelector('.screen').getBoundingClientRect();
      const now = Date.now();
      if (now - this.pageTimer < 620) return;
      if (x < scr.left + 34 && S.homePage > 0) { S.homePage--; this.gotoPage(S.homePage); this.pageTimer = now; this.drag.dx += scr.width * 0.5; }
      else if (x > scr.right - 34 && S.homePage < this.pages.length - 1) { S.homePage++; this.gotoPage(S.homePage); this.pageTimer = now; this.drag.dx -= scr.width * 0.5; }
    },
    up(e) {
      window.removeEventListener('pointermove', this.move);
      const p = this.press;
      this.press = null;
      if (p) clearTimeout(p.timer);
      if (this.drag) {
        this.drop(e.clientX, e.clientY);
        this.drag = null;
        saveCfg();
      }
      setTimeout(() => { this.press = null; }, 0);
    },
    drop(x, y) {
      const d = this.drag;
      const el = document.elementFromPoint(x, y);
      const grid = el && el.closest ? el.closest('.page-grid') : null;
      const dockEl = el && el.closest ? el.closest('.dock') : null;
      const p = this.press;

      if (dockEl) {
        if (d.appId) return; // already in dock
        const page = this.pages[d.page];
        const idx = page.findIndex((i) => i.id === d.id);
        if (idx < 0) return;
        const item = page[idx];
        if (item.kind !== 'app') { this.resetDrag(); return; }
        page.splice(idx, 1);
        if (!S.cfg.layout.dock.includes(item.app)) S.cfg.layout.dock.push(item.app);
        this.layoutKey = Date.now();
        S.layoutKey++;
        return;
      }

      if (!grid) { this.resetDrag(); return; }
      const rect = grid.getBoundingClientRect();
      const pi = Number(grid.dataset.page);
      const gap = 12, rowH = 94, padTop = 6;
      const cellW = (rect.width - gap * 3) / 4;
      let col = Math.floor((x - rect.left) / (cellW + gap));
      let row = Math.floor((y - rect.top - padTop) / (rowH + gap));
      const target = d.it || (p && p.it);
      const w = target ? target.w : 1, h = target ? target.h : 1;
      col = Math.max(0, Math.min(4 - w, col));
      row = Math.max(0, Math.min(6 - h, row));

      if (d.appId) {
        // dock -> grid
        const appId = d.appId;
        S.cfg.layout.dock = S.cfg.layout.dock.filter((a) => a !== appId);
        const item = { id: U.uid('app'), x: col, y: row, w: 1, h: 1, kind: 'app', app: appId };
        this.placeWithCollision(pi, item, null);
        S.cfg.removedApps = (S.cfg.removedApps || []).filter((a) => a !== appId);
        return;
      }
      if (!target) return;
      if (d.page === pi) {
        this.placeWithCollision(pi, target, target.x + ',' + target.y);
      } else {
        const oldPage = this.pages[d.page];
        oldPage.splice(oldPage.indexOf(target), 1);
        this.placeWithCollision(pi, target, null);
      }
    },
    placeWithCollision(pi, item, oldPos) {
      const page = this.pages[pi];
      if (!page.includes(item)) page.push(item);
      const rect = { x: item.x, y: item.y, w: item.w, h: item.h };
      const hits = page.filter((o) => o.id !== item.id && o.x < rect.x + rect.w && o.x + o.w > rect.x && o.y < rect.y + rect.h && o.y + o.h > rect.y);
      if (hits.length) {
        if (hits.length === 1 && hits[0].w === item.w && hits[0].h === item.h && oldPos) {
          const [ox, oy] = oldPos.split(',').map(Number);
          hits[0].x = ox; hits[0].y = oy;
        } else {
          hits.forEach((h) => {
            const f = this.findSpot(pi, h.w, h.h, item.id, hits);
            h.x = f.x; h.y = f.y;
          });
        }
      }
      S.layoutKey++;
    },
    findSpot(pi, w, h, skipId, alsoSkip) {
      const page = this.pages[pi];
      const conflict = (x, y) => page.some((o) => o.id !== skipId && !(alsoSkip || []).includes(o) &&
        x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y);
      for (let y = 0; y < 8; y++) for (let x = 0; x <= 4 - w; x++) if (!conflict(x, y)) return { x, y };
      return { x: 0, y: 0 };
    },
    resetDrag() { this.drag = null; },
    /* ---------- app / widget actions ---------- */
    onAppClick(item) {
      if (this.suppressClick || this.editing) return;
      A.openApp(item.app);

    delApp(item, pi) {

      S.layoutKey++;
      saveCfg();
      A.toast(APPS[item.app].name + ' 已移除，可在商店重新下载');
    },
    editWidget(kind) {

    },
    pickFile(cb) {

/* ============================================================
   CHAT — login, list, room, settings, beauty, moments
   ============================================================ */
window.parseRaw = function (raw) {
  const out = [];
  const src = String(raw || '');
  const re = /<think>([\s\S]*?)<\/think>|<narratage>([\s\S]*?)<\/narratage>|<tool(?:\s+name="([^"]*)")?\s*>([\s\S]*?)<\/tool>/gi;
  let last = 0, m;
  const pushSay = (text, base) => {
    const t = text.replace(/^\s+|\s+$/g, '');
    if (!t) return;
    const parts = t.split(/\n\s*\n/);
    let cursor = base;
    parts.forEach((p) => {
      const trimmed = p.trim();
      if (!trimmed) { cursor += p.length; return; }
      const idx = src.indexOf(trimmed, cursor);
      const start = idx >= 0 ? idx : cursor;
      const end = start + trimmed.length;
      out.push({ type: 'say', text: trimmed, start, end });
      cursor = end;
    });
  };
  while ((m = re.exec(src))) {
    if (m.index > last) pushSay(src.slice(last, m.index), last);
    if (m[1] !== undefined) out.push({ type: 'think', text: m[1].trim(), start: m.index, end: re.lastIndex });
    else if (m[2] !== undefined) out.push({ type: 'narr', text: m[2].trim(), start: m.index, end: re.lastIndex });
    else out.push({ type: 'tool', name: m[3] || 'tool', text: m[4].trim(), start: m.index, end: re.lastIndex });
    last = re.lastIndex;
  }
  if (last < src.length) pushSay(src.slice(last), last);
  return out;
};

CHAT.Room = {
  props: { params: Object },
  data() {
    return {
      S, text: '', drawer: false, narration: '', limit: 40,
      menu: null, editMsg: null, editText: '', editSheet: false,
      scrollEl: null, atBottom: true, cssTag: ''
    };
  },
  computed: {
    chat() { return A.chatById(this.params.chatId); },
    char() { return this.chat ? A.charById(this.chat.charId) : null; },
    title() { return this.chat ? (this.chat.remark || (this.char ? this.char.name : '聊天')) : '聊天'; },
    msgs() { return (S.msgs[this.chat.id] || []).slice(-this.limit); },
    typing() { return !!S.typing[this.chat.id]; },
    canMore() { return (S.msgs[this.chat.id] || []).length > this.limit; },
    bgStyle() {
      const k = this.chat.bgKey;
      return k && S.imgCache[k] ? { backgroundImage: 'url(' + S.imgCache[k] + ')' } : {};
    }
  },
  watch: {
    'msgs.length'() { this.toBottom(); }
  },
  async mounted() {
    await A.loadMessages(this.chat.id);
    if (this.chat.bgKey) await A.resolveImg(this.chat.bgKey);
    this.applyCss();
    this.$nextTick(this.toBottom);
    this.scrollEl = this.$refs.msgs;
    this.scrollEl.addEventListener('scroll', this.onScroll, { passive: true });
  },
  beforeUnmount() {
    if (this.scrollEl) this.scrollEl.removeEventListener('scroll', this.onScroll);
    document.getElementById('room-user-css')?.remove();
  },
  methods: {
    applyCss() {
      let el = document.getElementById('room-user-css');
      if (!el) { el = document.createElement('style'); el.id = 'room-user-css'; document.head.appendChild(el); }
      const scope = '.room-' + this.chat.id;
      const sc = (css, extra) => css.replace(/(^|\})\s*([^@}{]+)\{/g, (m, b, sel) => b + sel.split(',').map((s) => scope + (extra || '') + ' ' + s.trim()).join(',') + '{');
      el.textContent = sc(this.chat.chatCss || '') + '\n' + sc(this.chat.bubbleCss || '', ' .bubble');
    },
    onScroll() {
      const el = this.$refs.msgs;
      this.atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
      if (el.scrollTop < 40 && this.canMore) this.limit += 30;
    },
    toBottom() {
      this.$nextTick(() => {
        const el = this.$refs.msgs;
        if (el && this.atBottom !== false) el.scrollTop = el.scrollHeight;
      });
    },
    blocks(m) { return parseRaw(m.raw); },
    isNarrOnly(m) { return m.narration && !parseRaw(m.raw).some((b) => b.type === 'say'); },
    sendText() {
      const t = this.text.trim();
      if (!t) return;
      this.text = '';
      this.$nextTick(() => { if (this.$refs.ta) this.$refs.ta.style.height = '32px'; });
      this.atBottom = true;
      A.send(this.chat.id, t);
      this.toBottom();
    },
    grow(e) {
      const el = e.target;
      el.style.height = '32px';
      el.style.height = Math.min(100, el.scrollHeight) + 'px';
    },
    sendNarration() {
      const t = this.narration.trim();
      if (!t) return;
      if (t.length > 50) { A.toast('单段旁白不超过 50 字'); return; }
      A.send(this.chat.id, t, { narration: true });
      this.narration = '';
      this.drawer = false;
      this.atBottom = true;
      this.toBottom();
    },
    toggleTimeAware(v) {
      this.chat.timeAware = v;
      DB.put('chats', JSON.parse(JSON.stringify(this.chat)));
      A.toast(v ? '已开启时间感知：上下文将带上真实时间' : '已关闭时间感知');
    },
    pressBubble(e, m, block) {
      if (this.editSheet) return;
      const startX = e.clientX, startY = e.clientY;
      const timer = setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate(8);
        const scr = document.querySelector('.screen').getBoundingClientRect();
        this.menu = {
          x: Math.min(Math.max(12, e.clientX - scr.left - 66), scr.width - 150),
          y: Math.max(56, e.clientY - scr.top - 8),
          msg: m, block
        };
        setTimeout(() => {
          document.addEventListener('pointerdown', this.closeMenu, { once: true });
        }, 60);
      }, 420);
      const cancel = (ev) => {
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
        window.removeEventListener('pointermove', cancel);
      };
      window.addEventListener('pointermove', cancel);
    },
    closeMenu() { this.menu = null; },
    startEdit() {
      this.editMsg = this.menu.msg;
      this.editText = this.menu.msg.raw;
      this.menu = null;
      this.editSheet = true;
    },
    async saveEdit() {
      await A.updateMessage(this.chat.id, this.editMsg.id, this.editText);
      this.editSheet = false;
      A.toast('已保存');
    },
    async deleteBubble() {
      const { msg, block } = this.menu;
      this.menu = null;
      const raw = msg.raw;
      const start = block.start, end = block.end;
      let next = (raw.slice(0, start) + raw.slice(end)).replace(/\n{3,}/g, '\n\n').trim();
      if (!next) {
        await A.deleteMessage(this.chat.id, msg.id);
      } else {
        await A.updateMessage(this.chat.id, msg.id, next);
      }
      A.toast('已删除这一段');
    },
    async regenerate() {
      const msg = this.menu.msg;
      this.menu = null;
      await A.regenerate(this.chat.id, msg.id);
      this.atBottom = true;
      A.toast('正在重新回应…');
    },
    goSettings() { A.go('chat.settings', { chatId: this.chat.id }); },
    fmtTime(ts) { return U.hhmm(ts); },
    dayShown(i) {
      const arr = this.msgs;
      if (i === 0) return true;
      return U.dayKey(arr[i].ts) !== U.dayKey(arr[i - 1].ts);
    },
    openTool(b) { b.open = !b.open; }
  },
  template: `<div class="page room" :class="'room-'+chat.id">

CHAT.Moments = {
  data() { return { S, compose: false, draft: '', imgs: [], commentFor: null, commentText: '', fwd: null }; },
  computed: {
    list() { return S.cfg.moments || []; },
    me() { return S.account || {}; }
  },
  methods: {
    uploadCover() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = async () => {
        if (!input.files[0]) return;
        S.cfg.momentsCoverKey = await A.replaceImage(S.cfg.momentsCoverKey, input.files[0]);
        await A.resolveImg(S.cfg.momentsCoverKey);
        saveCfg(true);
        A.toast('封面已更新');
      };
      input.click();
    },
    openCompose() { this.draft = ''; this.imgs = []; this.compose = true; },
    async addImages() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
      input.onchange = async () => {
        for (const f of Array.from(input.files).slice(0, 9 - this.imgs.length)) {
          const key = await A.uploadImage(f);
          this.imgs.push(key);
        }
      };
      input.click();
    },
    async post() {
      if (!this.draft.trim() && !this.imgs.length) return;
      S.cfg.moments.unshift({
        id: U.uid('mo'), text: this.draft.trim(), imgs: this.imgs, ts: Date.now(),
        likes: [], comments: [], shares: 0
      });
      await saveCfg(true);
      this.compose = false;
      A.toast('已发布');
    },
    like(m) {
      const i = m.likes.indexOf(this.me.id);
      if (i >= 0) m.likes.splice(i, 1); else m.likes.push(this.me.id);
      saveCfg();
    },
    isLiked(m) { return m.likes.includes(this.me.id); },
    openComment(m) { this.commentFor = m; this.commentText = ''; },
    addComment() {
      if (!this.commentText.trim()) return;
      this.commentFor.comments.push({ id: U.uid('c'), name: me.name, text: this.commentText.trim() });
      saveCfg();
      this.commentFor = null;
      A.toast('已评论');
    },
    share(m) { m.shares = (m.shares || 0) + 1; saveCfg(); A.toast('已转发到你的主页'); },
    remove(m) {
      if (!confirm('删除这条动态？')) return;
      S.cfg.moments = S.cfg.moments.filter((x) => x.id !== m.id);

      A.go('worldbook.detail', { bookId: b.id });

WB.Detail = {
  props: { params: Object },
  data() {
    return {
      S, sheet: false, editing: null,
      form: { name: '', keys: '', content: '', position: 'pre', mode: 'always', probability: 30, enabled: true },
      bookSheet: false, bookName: '', bookDesc: ''
    };
  },
  computed: {
    book() { return S.worldbooks.find((b) => b.id === this.params.bookId); },
    entries() { return this.book ? (this.book.entries || []) : []; }
  },
  mounted() {
    if (this.book) { this.bookName = this.book.name; this.bookDesc = this.book.desc || ''; }
  },
  methods: {
    openEntry(e) {
      this.editing = e || null;
      this.form = e ? { name: e.name, keys: (e.keys || []).join(', '), content: e.content, position: e.position, mode: e.mode, probability: e.probability || 30, enabled: e.enabled !== false }
        : { name: '', keys: '', content: '', position: 'pre', mode: 'always', probability: 30, enabled: true };
      this.sheet = true;
    },
    async saveEntry() {
      if (!this.form.name.trim() || !this.form.content.trim()) { A.toast('名称与内容不能为空'); return; }
      const data = {
        id: this.editing ? this.editing.id : U.uid('e'),
        name: this.form.name.trim(),
        keys: this.form.keys.split(/[,，\s]+/).filter(Boolean),
        content: this.form.content.trim(),
        position: this.form.position,
        mode: this.form.mode,
        probability: Number(this.form.probability) || 30,
        enabled: this.form.enabled
      };
      const e = this.book.entries || (this.book.entries = []);
      if (this.editing) Object.assign(this.editing, data);
      else e.push(data);
      await DB.put('worldbooks', JSON.parse(JSON.stringify(this.book)));
      this.sheet = false;
      A.toast('条目已保存');
    },
    async removeEntry(e) {
      if (!confirm('删除条目「' + e.name + '」？')) return;
      this.book.entries = this.entries.filter((x) => x.id !== e.id);
      await DB.put('worldbooks', JSON.parse(JSON.stringify(this.book)));
    },
    async toggle(e) {
      e.enabled = !e.enabled;
      await DB.put('worldbooks', JSON.parse(JSON.stringify(this.book)));
    },
    async saveBook() {
      this.book.name = this.bookName;
      this.book.desc = this.bookDesc;
      await DB.put('worldbooks', JSON.parse(JSON.stringify(this.book)));
      this.bookSheet = false;
      A.toast('已保存');
    },
    async removeBook() {
      if (!confirm('删除整本世界书？绑定关系会一并解除。')) return;
      await A.deleteBook(this.book.id);
      A.back();
    },
    modeLabel(e) { return e.mode === 'always' ? '始终注入' : e.mode === 'keyword' ? '关键词' : '概率 ' + (e.probability || 30) + '%'; }
  },
  template: `<div class="page">
    <nav-bar title="">
      <template #right>
        <button class="icon-btn" @click="bookSheet=true"><ico name="edit" :size="17"/></button>
        <button class="icon-btn" @click="openEntry(null)"><ico name="plus" :size="20"/></button>
      </template>
    </nav-bar>
    <div class="body" v-if="book">
      <div class="app-head" style="padding-bottom:10px">
        <div class="ah-row">
          <div>
            <div class="mark">WORLD BOOK</div>
            <h1 style="font-size:20px;margin-top:6px">{{book.name}}</h1>
            <div class="desc">{{book.desc || '尚未填写简介'}}</div>
          </div>
        </div>
        <div class="f g6" style="margin-top:12px">
          <span class="tag">{{entries.length}} 个条目</span>
          <span class="tag pre">前置 {{entries.filter(e=>e.position==='pre').length}}</span>
          <span class="tag mid">中置 {{entries.filter(e=>e.position==='mid').length}}</span>
          <span class="tag post">后置 {{entries.filter(e=>e.position==='post').length}}</span>
        </div>
      </div>

      <div class="pad">
        <div class="entry" v-for="e in entries" :key="e.id" :class="{off:e.enabled===false}" @click="openEntry(e)">
          <div class="entry-top">
            <div class="entry-name">{{e.name}}</div>
            <toggle :model-value="e.enabled!==false" @update:model-value="toggle(e)" @click.stop/>
          </div>
          <div class="entry-keys" v-if="e.keys && e.keys.length"># {{e.keys.join(' · ')}}</div>
          <div class="entry-content">{{e.content}}</div>
          <div class="entry-tags">
            <span class="tag" :class="e.position">{{e.position==='pre'?'前置':e.position==='mid'?'中置':'后置'}}</span>
            <span class="tag">{{modeLabel(e)}}</span>
            <button class="tag" style="margin-left:auto;color:var(--muted-2);display:flex;align-items:center;gap:3px" @click.stop="removeEntry(e)"><ico name="trash" :size="9"/>删除</button>
          </div>
        </div>

        <div v-if="!entries.length" class="empty">
          <div class="e-ico"><ico name="file" :size="22"/></div>
          <div class="e-title">还没有条目</div>
          <div class="e-sub">一条设定、一段规则、一个只有你知道的秘密。</div>
          <button class="btn sm" @click="openEntry(null)">添加条目</button>
        </div>
        <button class="btn ghost block" style="margin-top:8px;color:var(--danger)" @click="removeBook">删除这本世界书</button>
      </div>
      <div style="height:26px"></div>
    </div>

    <sheet v-if="sheet" v-model="sheet" :title="editing?'编辑条目':'新建条目'" sub="位置决定它被拼接到提示词的哪一段">
      <div class="form-stack">
        <div class="field"><label>条目名称</label><input class="input" v-model="form.name" placeholder="如：雾港的潮汐规则"></div>
        <div class="field"><label>关键词（逗号分隔）</label><input class="input" v-model="form.keys" placeholder="潮汐, 雾, 港口"></div>
        <div class="field"><label>内容</label><textarea class="textarea" v-model="form.content" style="min-height:120px" placeholder="会被真实注入到提示词里的文本。"></textarea></div>
        <div class="field"><label>插入位置</label>
          <seg v-model="form.position" :options="[{value:'pre',label:'前置'},{value:'mid',label:'中置'},{value:'post',label:'后置'}]"/>
        </div>
        <div class="field"><label>注入方式</label>
          <seg v-model="form.mode" :options="[{value:'always',label:'始终'},{value:'keyword',label:'关键词'},{value:'random',label:'概率'}]"/>
        </div>
        <div class="field" v-if="form.mode==='random'">
          <label>触发概率 · {{form.probability}}%</label>
          <input type="range" min="5" max="100" step="5" v-model.number="form.probability" style="width:100%">
        </div>
      </div>
      <template #footer><button class="btn primary block" @click="saveEntry">保存条目</button></template>
    </sheet>

    <sheet v-if="bookSheet" v-model="bookSheet" title="世界书信息">
      <div class="form-stack">
        <div class="field"><label>名称</label><input class="input" v-model="bookName"></div>
        <div class="field"><label>简介</label><textarea class="textarea" v-model="bookDesc"></textarea></div>
      </div>
      <template #footer><button class="btn primary block" @click="saveBook">保存</button></template>
    </sheet>
  </div>`
};

/* ============================================================
   Memory
   ============================================================ */
const MEM = {};

MEM.Page = {
  props: { params: Object },
  data() {
    return {
      S, tab: 'short', sel: '', detail: null, detailMsgs: [], addSheet: false,
      form: { title: '', content: '', keywords: '' }, apiSheet: false
    };
  },
  computed: {
    chars() { return S.chars.filter((c) => A.charMemories(c.id).length || A.chatOfChar(c.id)); },
    char() { return A.charById(this.sel) || S.chars[0] || null; },
    chat() { return this.char ? A.chatOfChar(this.char.id) : null; },
    list() { return this.char ? A.charMemories(this.char.id, this.tab) : []; },
    shortCount() { return this.char ? A.charMemories(this.char.id, 'short').length : 0; },
    indexCount() { return this.char ? A.charMemories(this.char.id, 'index').length : 0; },
    permCount() { return this.char ? A.charMemories(this.char.id, 'permanent').length : 0; },
    apiName() {
      const id = S.cfg.memory.apiId;
      if (id === 'inherit' || !id) return '跟随角色配置';
      const a = S.cfg.api.find((x) => x.id === id);
      return a ? a.name : '跟随角色配置';
    }
  },
  async mounted() {
    this.sel = (this.params && this.params.charId) || (this.chars[0] && this.chars[0].id) || (S.chars[0] && S.chars[0].id) || '';
    if (this.chat) await A.loadMessages(this.chat.id);
  },
  methods: {
    async summarize() {
      if (!this.chat) { A.toast('这个角色还没有聊天记录'); return; }
      await A.summarize(this.chat);
    },
    step(d) {
      const v = Math.max(10, Math.min(300, (S.cfg.memory.threshold || 50) + d));
      S.cfg.memory.threshold = v;
      saveCfg();
    },
    async drill(m) {
      this.detail = m;
      const all = this.chat ? await A.loadMessages(this.chat.id) : [];
      this.detailMsgs = (m.msgIds || []).map((id) => all.find((x) => x.id === id)).filter(Boolean);
      if (!this.detailMsgs.length && m.shortId) {
        const short = S.memories.find((x) => x.id === m.shortId);
        if (short) this.detailMsgs = all.filter((x) => x.seq >= short.range[0] && x.seq <= short.range[1]);
      }
    },
    async add() {
      if (!this.form.title.trim() || !this.form.content.trim()) { A.toast('标题与内容不能为空'); return; }
      await A.addMemory({
        charId: this.char.id, type: 'permanent', title: this.form.title.trim(),
        content: this.form.content.trim(), keywords: this.form.keywords.split(/[,，\s]+/).filter(Boolean), pinned: true
      });
      this.addSheet = false;
      this.form = { title: '', content: '', keywords: '' };
      this.tab = 'permanent';
      A.toast('已写入永久记忆');
    },
    remove(m) { A.deleteMemory(m.id); },
    async summarizeOne(m) {
      if (!this.chat) return;
      await A.summarize(this.chat);
    }
  },
  template: `<div class="page">
    <nav-bar title="记忆">
      <template #right>
        <button class="icon-btn" @click="apiSheet=true"><ico name="cpu" :size="18"/></button>
        <button class="icon-btn" @click="addSheet=true"><ico name="plus" :size="20"/></button>
      </template>
    </nav-bar>
    <div class="body">

        <button v-for="c in S.chars" :key="c.id" class="chip" :class="{on:sel===c.id}" @click="sel=c.id">
          <av :file-key="c.avatarKey" :name="c.name" :size="16" style="margin-left:-2px"/>{{c.name}}
        </button>
      </div>

      <template v-if="char">
        <div class="mem-summary">
          <div class="ms-t">MEMORY OF {{char.name}}</div>
          <div class="f" style="align-items:flex-end;gap:10px">
            <div class="ms-n">{{shortCount + indexCount + permCount}}</div>
            <div class="ms-s" style="padding-bottom:4px">短时 {{shortCount}} · 索引 {{indexCount}} · 永久 {{permCount}}</div>
          </div>
          <div class="ms-s">记忆会在总结后自动绑定主题；索引记忆默认不带原文，需要下钻。</div>
          <div class="ms-actions">
            <button class="ms-btn solid" @click="summarize"><ico name="sparkle" :size="12"/>一键总结</button>
            <button class="ms-btn" @click="apiSheet=true"><ico name="cpu" :size="12"/>{{apiName}}</button>
          </div>
        </div>

        <div class="pad">
          <div class="threshold">
            <div class="grow">
              <div style="font-size:11.5px;font-weight:600">短时记忆阈值</div>
              <div class="helper" style="margin-top:3px">每积累 N 条消息自动总结一次</div>
            </div>
            <div class="stepper">
              <button @click="step(-10)"><ico name="minus" :size="11"/></button>
              <span>{{S.cfg.memory.threshold}}</span>
              <button @click="step(10)"><ico name="plus" :size="11"/></button>
            </div>
          </div>

          <seg v-model="tab" :options="[{value:'short',label:'短时'},{value:'index',label:'索引'},{value:'permanent',label:'永久'}]" style="margin-bottom:12px"/>

          <template v-if="tab==='short'">
            <div class="mem-card" v-for="m in list" :key="m.id">
              <div class="mt"><ico name="clock" :size="13"/>{{m.title}}</div>
              <div class="mc">{{m.content}}</div>
              <div class="mf"><span>{{U.rel(m.ts)}}</span><span class="dot-sep"></span><span>消息 #{{m.range?m.range[0]:'-'}} - #{{m.range?m.range[1]:'-'}}</span></div>
            </div>
            <empty v-if="!list.length" icon="clock" title="还没有短时记忆" sub="聊到阈值后会自动总结，也可以点上面的「一键总结」。"/>
          </template>

          <template v-else-if="tab==='index'">
            <div class="mem-card" v-for="m in list" :key="m.id">
              <div class="mt"><ico name="sparkle" :size="13"/>{{m.title}}
                <span class="tag" style="margin-left:auto">{{(m.msgIds||[]).length}} 段原文</span>
              </div>
              <div class="mc">{{m.content}}</div>
              <div class="entry-tags" v-if="m.keywords && m.keywords.length">

  props: { params: Object },
  data() {

      form: {

        background: '', taboos: '', examples: '', greeting: ''
      },
      worldbookIds: [], apiId: 'inherit'
    };
  },
  computed: {
    editing() { return !!(this.params && this.params.charId); },
    char() { return this.editing ? A.charById(this.params.charId) : null; },
    apiName() {
      if (this.apiId === 'inherit' || !this.apiId) return '跟随全局';
      const a = S.cfg.api.find((x) => x.id === this.apiId);
      return a ? a.name : '跟随全局';
    }
  },
  mounted() {
    if (this.char) {
      Object.keys(this.form).forEach((k) => { this.form[k] = this.char[k] || this.form[k]; });
      this.worldbookIds = [...(this.char.worldbookIds || [])];
      this.apiId = this.char.apiId || 'inherit';
    }
  },
  methods: {
    async pickAvatar() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = async () => {
        if (!input.files[0]) return;
        if (this.editing && this.form.avatarKey) {
          this.form.avatarKey = await A.replaceImage(this.form.avatarKey, input.files[0]);
          await A.resolveImg(this.form.avatarKey);
        } else {
          this.form.avatarKey = await A.uploadImage(input.files[0]);
          await A.resolveImg(this.form.avatarKey);
        }
      };
      input.click();
    },
    async save() {
      this.saving = true;
      try {
        const c = await A.saveCharacter(Object.assign({}, this.form, {
          worldbookIds: this.worldbookIds, apiId: this.apiId
        }), this.editing ? this.char.id : null);
        A.toast(this.editing ? '档案已更新' : '角色已创建 · 通讯号 ' + c.code);
        A.back();
      } catch (e) { A.toast(e.message); }
      this.saving = false;
    },
    async remove() {
      if (!confirm('删除角色「' + this.char.name + '」以及全部聊天与记忆？')) return;
      await A.deleteCharacter(this.char.id);
      A.toast('已删除');
      A.back();
    },
    toggleBook(id) {
      const i = this.worldbookIds.indexOf(id);
      if (i >= 0) this.worldbookIds.splice(i, 1); else this.worldbookIds.push(id);
    },

const STORE = {};

STORE.Page = {
  data() { return { S, uploadSheet: false, name: '', html: '' }; },
  computed: {
    installed() { return Object.keys(APPS).filter((id) => A.appInLayout(id)); },
    removed() { return S.cfg.removedApps || []; },
    custom() { return S.cfg.customApps || []; }
  },
  methods: {
    meta(id) { return window.appMeta(id); },
    download(id) {
      A.restoreApp(id);
      A.toast('已放回桌面');
    },
    remove(id) {
      A.removeAppFromHome(id);
      A.toast('已从桌面移除');
    },
    upload() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json,application/json';
      input.onchange = async () => {
        if (!input.files[0]) return;
        try {
          const text = await input.files[0].text();
          const j = JSON.parse(text);
          if (!j.name || !j.html) throw new Error('需要 name 与 html 字段');
          const app = { id: 'c_' + U.uid('x'), name: j.name, icon: j.icon || 'grid', tint: j.tint || 'linear-gradient(150deg,#B9B3A4,#8C8679)', html: String(j.html).slice(0, 20000) };
          S.cfg.customApps = [...(S.cfg.customApps || []), app];
          await saveCfg(true);
          A.restoreApp(app.id);
          A.toast('已安装「' + app.name + '」');
        } catch (e) { A.toast('组件格式不正确：' + e.message); }
      };
      input.click();
    },
    delCustom(a) {
      if (!confirm('删除自定义组件「' + a.name + '」？')) return;
      A.removeAppFromHome(a.id);
      S.cfg.customApps = this.custom.filter((x) => x.id !== a.id);
      saveCfg(true);
    }
  },
  template: `<div class="page">
    <nav-bar title="">
      <template #right><button class="icon-btn" @click="upload"><ico name="upload" :size="18"/></button></template>
    </nav-bar>
    <div class="body">

          <div class="mark">8 CORE</div>
        </div>
      </div>
      <div class="pad">
        <div class="store-grid">
          <div class="store-item" v-for="id in Object.keys(APPS)" :key="id">
            <div class="si-top">
              <span class="app-icon" :style="{background:meta(id).tint}"><ico :name="meta(id).icon" :size="18" :sw="1.5"/></span>
              <div class="grow"><div class="si-n">{{meta(id).name}}</div></div>

            <div class="si-d">{{A.appInLayout(id)?'已在桌面':'已移除，可重新下载'}}</div>

        delete S.imgCache[S.cfg.ui.wallpaperKey];
        S.cfg.ui.wallpaperKey = '';

      A.toast('桌面背景已更新');

    uploadWall() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = async () => {
        if (!input.files[0]) return;
        S.cfg.ui.wallpaperKey = await A.replaceImage(S.cfg.ui.wallpaperKey, input.files[0]);
        await A.resolveImg(S.cfg.ui.wallpaperKey);

    },
    removeWall() {
      if (S.cfg.ui.wallpaperKey) { DB.delFile(S.cfg.ui.wallpaperKey); delete S.imgCache[S.cfg.ui.wallpaperKey]; }
      S.cfg.ui.wallpaperKey = '';
      saveCfg(true);

    uploadFont() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.ttf,.otf,.woff,.woff2,font/*';

        if (!input.files[0]) return;
        const f = input.files[0];

        S.cfg.ui.fontKey = await DB.putFile(f, { name: f.name });

SET.Prompt = {
  data() { return { S, tab: 'chat', preview: false }; },
  computed: {
    defs() { return PROMPT_DEFS[this.tab]; },
    order() { return S.cfg.prompts[this.tab] || []; },
    ctx() {
      const chat = S.chats[0];
      const char = chat ? A.charById(chat.charId) : S.chars[0];
      return { chat, char };
    },
    rows() {
      return this.order.map((b) => {
        const def = this.defs.find((d) => d.id === b.id) || {};
        let len = 0;
        try {
          if (this.ctx.chat && this.ctx.char) len = A.blockContent(b.id, this.ctx.chat, this.ctx.char).length;
        } catch (e) { len = 0; }
        return { id: b.id, label: def.label || b.id, hint: def.hint || '', enabled: b.enabled, len };
      });
    },
    totalChars() { return this.rows.reduce((a, b) => a + (b.enabled ? b.len : 0), 0); },
    previewText() {
      if (!this.ctx.chat || !this.ctx.char) return '还没有可用的角色与聊天记录。';
      return this.order.filter((b) => b.enabled).map((b) => {
        const c = A.blockContent(b.id, this.ctx.chat, this.ctx.char);
        if (!c) return '';
        const label = (this.defs.find((d) => d.id === b.id) || {}).label || b.id;
        return '【' + label + '】\n' + c;
      }).filter(Boolean).join('\n\n');
    }
  },
  methods: {
    up(i) {
      if (i <= 0) return;
      const a = this.order;
      [a[i - 1], a[i]] = [a[i], a[i - 1]];
      saveCfg(true);
    },

/* ============================================================

const NAV = Vue.reactive({ stack: [], dir: 'push', seq: 0 });

window.__go = function (name, params) {
  NAV.dir = 'push';
  NAV.stack.push({ name, params: params || {}, key: ++NAV.seq });
};
window.__back = function () {
  if (!NAV.stack.length) return;
  NAV.dir = 'pop';
  NAV.stack.pop();
};

window.appMeta = function (id) {
  if (APPS[id]) return APPS[id];
  const c = (S.cfg.customApps || []).find((x) => x.id === id);
  return c || { id, name: '组件', icon: 'grid', tint: 'linear-gradient(150deg,#B9B3A4,#8C8679)' };
};

A.applyFont = async function () {
  try {
    const key = S.cfg.ui.fontKey;
    if (!key) { document.documentElement.style.removeProperty('--home-font'); return; }
    const url = await DB.fileURL(key);
    if (!url) return;
    const face = new FontFace('LIWUUserFont', 'url(' + url + ')');
    await face.load();
    document.fonts.add(face);
    document.documentElement.style.setProperty('--home-font', "'LIWUUserFont', -apple-system, 'PingFang SC', sans-serif");
  } catch (e) { A.toast('字体加载失败'); }
};
