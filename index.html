<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1'>
<meta name='theme-color' content='#EFE9DC'>
<meta name='description' content='里屋。一张能摆东西的桌子。'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<title>里屋</title>
<link rel='icon' href='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23EFE9DC%27/%3E%3Crect x=%2715.2%27 y=%277%27 width=%271.4%27 height=%2718%27 fill=%27%238A3B2C%27/%3E%3C/svg%3E'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='assets/style.css'>
<link rel='stylesheet' href='assets/desk.css'>
</head>
<body data-theme='paper' class='home'>

<div id='desk-wrap'>
  <div class='desk' id='desk'>
    <div class='plane' id='plane'>

      <div class='hud'>
        <button class='hud-btn' id='hudMenu' type='button' aria-label='会话'>≡</button>
        <div class='clock'>
          <span class='t' id='hudTime'>--:--</span>
          <span class='d' id='hudDate'></span>
        </div>
        <button class='pill' id='hudMode' type='button'>预览：白天</button>
      </div>

      <section class='thing paper'>
        <div class='paper-head'>
          <h1>里屋早报</h1>
          <span>THE LIWU MORNING POST</span>
        </div>
        <div class='paper-body'>
          <div class='memo' data-open='memory'>
            <h4>备忘 <em>NOTES</em></h4>
            <ul id='memoList'></ul>
          </div>
          <div class='feature' data-open='album'>
            <h4>今天 <em>TODAY</em></h4>
            <div class='shot' id='featureShot'><span>把照片放进来<br>它就贴在这儿</span></div>
            <p class='cap' id='featureCap'>还没有照片</p>
          </div>
        </div>
        <div class='paper-foot'>
          <span class='temp' id='hudTemp'>—</span>
          <span class='weather' id='hudWeather'></span>
          <span class='sep'></span>
          <span class='days' id='deskDays'>第 — 天</span>
        </div>
      </section>

      <div class='thing polaroid' data-open='album'>
        <div class='tape'></div>
        <div class='ph' id='ph1'></div>
        <span class='hand'>our room</span>
      </div>

      <div class='thing note' data-open='diary'>
        <span class='note-head'>今天想说的话</span>
        <span class='note-rule'></span>
        <span class='note-rule'></span>
        <span class='note-foot'>写一句 →</span>
      </div>

      <div class='thing vinyl-wrap' data-open='chat'>
        <div class='deck'></div>
        <div class='vinyl'><span class='label'></span></div>
        <span class='arm'></span>
        <span class='vinyl-cap'>点它，说话</span>
      </div>

      <div class='thing tag' data-open='settings'>
        <span class='clip'></span>
        <span class='tag-face'>里屋<em>LIWU</em></span>
      </div>

    </div>
  </div>

  <div class='desk-dock' id='deskDock'></div>
</div>

<div id='app'>

  <header class='top'>
    <button class='icon' id='menuBtn' type='button' aria-label='会话列表'>≡</button>
    <div class='top-mid'>
      <span class='top-title' id='topTitle'>里屋</span>
      <span class='top-sub' id='topSub'></span>
    </div>
    <div class='top-right'>
      <span class='days' id='topDays'></span>
      <button class='icon' id='newBtn' type='button' aria-label='新的一段'>＋</button>
    </div>
  </header>

  <main class='thread' id='thread'></main>

  <footer class='composer'>
    <form class='in-row' id='form'>
      <textarea id='input' rows='1' placeholder='说一句' autocapitalize='off'></textarea>
      <button class='send' id='sendBtn' type='submit' aria-label='发'>↑</button>
      <button class='stop' id='stopBtn' type='button' aria-label='停' hidden>■</button>
    </form>
    <div class='hint' id='hint'></div>
  </footer>

</div>

<div class='scrim' id='scrim' hidden></div>

<aside class='drawer' id='drawer' hidden>
  <div class='drawer-in'>
    <div class='drawer-top'>
      <span class='brandmark'>里屋</span>
      <span class='drawer-days' id='drawerDays'></span>
    </div>

    <button class='newchat' id='newChat' type='button'>新的一段</button>
    <input class='search' id='search' placeholder='找一段话' autocomplete='off'>

    <div class='sessions' id='sessions'></div>

    <nav class='drawer-nav'>
      <button type='button' data-view='home'>回桌子</button>
      <button type='button' data-view='diary'>日记</button>
      <button type='button' data-view='album'>相册</button>
      <button type='button' data-view='memory'>记忆</button>
      <button type='button' data-view='settings'>设置</button>
    </nav>
  </div>
</aside>

<section class='view' id='view' hidden>
  <header class='view-top'>
    <button class='icon' id='viewBack' type='button' aria-label='回去'>←</button>
    <span class='view-title' id='viewTitle'></span>
    <span class='view-en' id='viewEn'></span>
  </header>
  <div class='view-body' id='viewBody'></div>
</section>

<script>
window.addEventListener('error', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.message || '未知') + (e.lineno ? '（第 ' + e.lineno + ' 行）' : '');
});
</script>

<script src='data.js'></script>
<script src='assets/app.js'></script>
<script src='assets/desk.js'></script>
</body>
</html>
