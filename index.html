<style>
/* ===== 基础覆盖 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#eef3fb;color:#33445f;font-family:'Noto Serif SC',serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}

/* 3D 容器 */
#scene-container{position:fixed;inset:0;z-index:1}
#scene-container canvas{display:block;width:100%;height:100%;touch-action:none}

/* 模式切换：desk 时显示 3D，隐藏 2D UI */
body:not(.desk) #scene-container{display:none}
body.desk #app,
body.desk .scrim,
body.desk .drawer,
body.desk .view,
body.desk .back-gate{display:none}

/* 加载 */
#loader{position:fixed;inset:0;z-index:200;background:#eef3fb;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s}
#loader .t{font-family:'Noto Serif SC',serif;font-size:20px;letter-spacing:.35em;color:#a7a0dc}
#loader .s{font-size:11px;color:#5a4e42;margin-top:14px;letter-spacing:.12em}
#loader.done{opacity:0;pointer-events:none}

/* 标题 */
.room-title{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none;transition:opacity .6s;opacity:0;animation:fadeInTitle 1.5s 1.2s forwards}
.room-title .cn{font-family:'Noto Serif SC',serif;font-size:22px;letter-spacing:.28em;color:rgba(66,82,119,.78)}
.room-title .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;letter-spacing:.18em;color:rgba(93,110,147,.56);margin-top:5px}
@keyframes fadeInTitle{to{opacity:1}}

/* 场景导航 */
.scene-nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:30;display:flex;gap:8px;padding:6px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(247,250,255,.68);box-shadow:0 8px 28px rgba(75,101,150,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.scene-nav button{appearance:none;border:0;border-radius:999px;padding:9px 18px;background:transparent;color:#667895;font:400 12px 'Noto Serif SC',serif;letter-spacing:.12em;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.scene-nav button.active{background:rgba(255,255,255,.92);color:#526b9a;box-shadow:0 2px 10px rgba(77,102,151,.12)}
.scene-nav button:active{transform:scale(.97)}
@media(max-width:480px){.scene-nav{bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}.scene-nav button{padding:8px 15px}}

/* 提示 */
.hint-3d{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:10px;letter-spacing:.22em;color:rgba(82,101,139,.58);z-index:10;pointer-events:none;transition:opacity .6s;opacity:0;animation:fadeInHint 1.5s 2s forwards}
@keyframes fadeInHint{to{opacity:1}}
</style>

<body class="desk">

<!-- 加载 -->
<div id="loader">
  <div class="t">里屋</div>
  <div class="s">正在布置雨夜书房……</div>
</div>

<!-- 3D 场景 -->
<div id="scene-container"></div>

<!-- 标题 -->
<div class="room-title">
  <div class="cn">里屋</div>
  <div class="en">Rainy Night Study</div>
</div>

<!-- 提示 -->
<div class="hint-3d">单指拖动探索 · 双指缩放 · 点击物件聚焦</div>
<nav class="scene-nav" aria-label="空间视角"><button type="button" id="deskViewBtn" class="active">桌面</button><button type="button" id="windowViewBtn">窗边</button></nav>

<!-- App —— 与原有结构完全一致 -->
<div id="app">
  <header class="top">
    <button class="icon" id="menuBtn" type="button" aria-label="会话列表">≡</button>
    <div class="top-mid"><span class="top-title" id="topTitle">里屋</span><span class="top-sub" id="topSub"></span></div>
    <div class="top-right"><span class="days" id="topDays"></span><button class="icon" id="newBtn" type="button" aria-label="新的一段">＋</button></div>
  </header>
  <main class="thread" id="thread"></main>
  <footer class="composer">
    <form class="in-row" id="form">
      <textarea id="input" rows="1" placeholder="说一句" autocapitalize="off"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="发">↑</button>
      <button class="stop" id="stopBtn" type="button" aria-label="停" hidden>■</button>
    </form>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-in">
    <div class="drawer-top"><span class="brandmark">里屋</span><span class="drawer-days" id="drawerDays"></span></div>
    <button class="newchat" id="newChat" type="button">新的一段</button>
    <input class="search" id="search" placeholder="找一段话" autocomplete="off">
    <div class="sessions" id="sessions"></div>
    <nav class="drawer-nav">
      <button type="button" data-view="home">回桌子</button>
      <button type="button" data-view="diary">日记</button>
      <button type="button" data-view="album">相册</button>
      <button type="button" data-view="memory">记忆</button>

  </div>
</aside>

<section class="view" id="view" hidden>
  <header class="view-top">
    <button class="icon" id="viewBack" type="button" aria-label="回去">←</button>
    <span class="view-title" id="viewTitle"></span><span class="view-en" id="viewEn"></span>
  </header>
  <div class="view-body" id="viewBody"></div>
</section>

<button class="back-gate" id="backGate" type="button">回桌子</button>

<script>
window.addEventListener('error', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.message || '未知');
});
window.addEventListener('unhandledrejection', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.reason && e.reason.message || '未知');
});
</script>
<script src="data.js?v=39"></script>
<script type="module">
/* ============================================
   里屋 3D 雨夜书房 — Three.js 场景
   ============================================ */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef3fb);
scene.fog = new THREE.Fog(0xeef3fb, 6, 18);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.1, 100
);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(-1.65, 0.92, -0.45);
controls.minDistance = 1.8;
controls.maxDistance = 5.5;
controls.maxPolarAngle = Math.PI / 2.08;
controls.minPolarAngle = 0.35;
controls.enablePan = true;
controls.panSpeed = 0.65;
controls.screenSpacePanning = true;

/* ---- 灯光 ---- */
const ambientLight = new THREE.AmbientLight(0xb8c7e4, 0.4);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0x9abce8, 0.25);
moonLight.position.set(-8, 6, -4);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(512, 512);
scene.add(moonLight);

const lampLight = new THREE.PointLight(0xd8c9f3, 2.8, 9, 1.8);
lampLight.position.set(-0.55, 1.55, -0.65);
lampLight.castShadow = true;
lampLight.shadow.mapSize.set(768, 768);
lampLight.shadow.bias = -0.001;
scene.add(lampLight);

const lampBounce = new THREE.PointLight(0xc3d5f3, 0.4, 5, 2);
lampBounce.position.set(-1.65, 2.5, -0.35);
scene.add(lampBounce);

/* ---- 材质 ---- */
const mats = {
  woodDark: new THREE.MeshStandardMaterial({ color: 0xb8a9a1, roughness: 0.92 }),
  woodMid: new THREE.MeshStandardMaterial({ color: 0xd4c4bb, roughness: 0.88 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xe3eaf6, roughness: 1.0 }),
  wallSide: new THREE.MeshStandardMaterial({ color: 0xe8eefa, roughness: 1.0 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x9ba8c4, metalness: 0.8, roughness: 0.3 }),
  paper: new THREE.MeshStandardMaterial({ color: 0xf5f0e6, roughness: 0.9 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x9c8cae, roughness: 0.85 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xc6d9f3, transparent: true, opacity: 0.35, roughness: 0.05, metalness: 0.15 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xd4b6d5, metalness: 0.35, roughness: 0.5 }),
  ceramic: new THREE.MeshStandardMaterial({ color: 0xf5f0e6, roughness: 0.3 }),
  plant: new THREE.MeshStandardMaterial({ color: 0x9bb9b0, roughness: 0.8 }),
  frameWood: new THREE.MeshStandardMaterial({ color: 0x9eabc4, roughness: 0.9 }),
  lampShade: new THREE.MeshStandardMaterial({ color: 0xf5eaff, side: THREE.DoubleSide, transparent: true, opacity: 0.88 }),
  lampBulb: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  vinyl: new THREE.MeshStandardMaterial({ color: 0x8d9ab7, roughness: 0.25, metalness: 0.15 }),
  vinylLabel: new THREE.MeshStandardMaterial({ color: 0xd9b8d5 }),
  outside: new THREE.MeshBasicMaterial({ color: 0x8fa8c9 }),
};

/* ---- 房间 ---- */
function buildRoom() {
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), mats.woodDark);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  g.add(floor);
  const bw = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), mats.wall);
  bw.position.set(0, 5, -3); bw.receiveShadow = true; g.add(bw);
  const lw = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), mats.wallSide);
  lw.position.set(-3.5, 5, 0); lw.rotation.y = Math.PI / 2; lw.receiveShadow = true; g.add(lw);
  const rw = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), mats.wallSide);
  rw.position.set(3.5, 5, 0); rw.rotation.y = -Math.PI / 2; rw.receiveShadow = true; g.add(rw);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0xe9eef8, roughness: 1 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.y = 3.2; g.add(ceil);
  return g;
}
/* ---- 窗边场景：只保留桌面与窗户，不再搭建完整房间 ---- */
function buildWindow() {
  const g = new THREE.Group();
  const fc = mats.frameWood;
  const vGeo = new THREE.BoxGeometry(0.08, 2.2, 0.08);
  const hGeo = new THREE.BoxGeometry(0.08, 0.08, 1.7);
  g.add(new THREE.Mesh(vGeo, fc)).children[0].position.set(0, 1.1, -0.85);
  g.add(new THREE.Mesh(vGeo, fc)).children[1].position.set(0, 1.1, 0.85);
  g.add(new THREE.Mesh(hGeo, fc)).children[2].position.set(0, 2.2, 0);
  g.add(new THREE.Mesh(hGeo, fc)).children[3].position.set(0, 0, 0);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.2, 0.06), fc)).children[4].position.set(0, 1.1, 0);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 1.7), fc)).children[5].position.set(0, 1.1, 0);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.2),
    new THREE.MeshStandardMaterial({ color: 0x1a2a3a, transparent: true, opacity: 0.25, roughness: 0.02, metalness: 0.95 }));
  glass.rotation.y = Math.PI / 2; glass.position.set(0.02, 1.1, 0); g.add(glass);
  const out = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), mats.outside);
  out.rotation.y = Math.PI / 2; out.position.set(-0.075, 1.1, 0); g.add(out);
  const sill = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.06, 1.85), mats.woodMid);
  sill.position.set(0.06, 0.03, 0); g.add(sill);
  // 盆栽
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.055, 0.09, 12), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
  pot.position.set(0.08, 0.075, 0.4); g.add(pot);
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.015, 12), new THREE.MeshStandardMaterial({ color: 0x3d2b1a }));
  soil.position.set(0.08, 0.12, 0.4); g.add(soil);
  for (let i = 0; i < 6; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.03 + Math.random() * 0.025, 6, 6), mats.plant);
    leaf.position.set(0.08 + (Math.random() - 0.5) * 0.06, 0.16 + Math.random() * 0.08, 0.4 + (Math.random() - 0.5) * 0.06);
    leaf.scale.y = 1.4; g.add(leaf);
  }
  g.position.set(-1.65, 0, -1.22);
  g.rotation.y = Math.PI / 2;
  return g;
}
scene.add(buildWindow());

/* ---- 桌面 ---- */
const desk = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.06, 1.3), new THREE.MeshStandardMaterial({ color: 0xdce6f3, roughness: 0.72 }));
desk.position.set(-1.65, 0.78, -0.15);
const deskEdge = new THREE.Mesh(new THREE.BoxGeometry(2.58, 0.018, 1.28), new THREE.MeshStandardMaterial({ color: 0xaebfda, roughness: 0.65 }));
deskEdge.position.set(-1.65, 0.744, -0.15);
scene.add(deskEdge);
desk.receiveShadow = true; desk.castShadow = true;
scene.add(desk);

const legGeo = new THREE.BoxGeometry(0.08, 0.78, 0.08);
[[-2.8, 0.39, 0.2], [-0.5, 0.39, 0.2], [-2.8, 0.39, -0.7], [-0.5, 0.39, -0.7]].forEach(p => {
  const leg = new THREE.Mesh(legGeo, mats.woodDark);
  leg.position.set(...p); leg.castShadow = true; scene.add(leg);
});

/* ---- 交互物品 ---- */
const interactives = [];
function makeInteractive(group, key, label) {
  group.userData = { go: key, label };
  interactives.push(group);
  scene.add(group);
}

// 日记
function buildDiary() {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.02, 0.42), mats.leather);
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.015, 0.38), mats.paper);
  p.position.y = 0.017;
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.02, 0.42), mats.leather);
  t.position.set(0, 0.035, -0.04); t.rotation.x = -0.15;
  g.add(b, p, t);
  g.position.set(-2.42, 0.81, 0.08); g.rotation.y = 0.2;
  return g;
}
makeInteractive(buildDiary(), 'diary', '今日留字');

// 唱片机
function buildTurntable() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x9eacc5, roughness: 0.55 }));
  body.position.y = 0.05;
  const platter = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.015, 32), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  platter.position.y = 0.11;
  const vinyl = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.004, 32), mats.vinyl);
  vinyl.position.y = 0.118;
  const label = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.005, 16), mats.vinylLabel);
  label.position.y = 0.121;
  const armG = new THREE.Group();
  const armBase = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.035, 8), mats.metal);
  armBase.position.set(0.22, 0.11, -0.18);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 0.28), mats.metal);
  arm.position.set(0.1, 0.02, 0.05); arm.rotation.y = 0.35;
  armG.add(armBase, arm);
  g.add(body, platter, vinyl, label, armG);
  g.position.set(-1.42, 0.81, -0.28); g.rotation.y = -0.1;
  g.userData.platter = platter; g.userData.vinyl = vinyl; g.userData.label = label;
  return g;
}
makeInteractive(buildTurntable(), 'chat', '你的声音');

// 相框
function buildFrame() {
  const g = new THREE.Group();
  const outer = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.015, 0.48), mats.gold);
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.4), new THREE.MeshStandardMaterial({ color: 0x3a5a7a }));
  photo.rotation.x = -Math.PI / 2; photo.position.y = 0.008;
  const stand = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.18, 0.04), mats.gold);
  stand.position.set(0, -0.09, -0.24); stand.rotation.x = -0.4;
  g.add(outer, photo, stand);
  g.position.set(-1.92, 0.83, -0.66);
  return g;
}
makeInteractive(buildFrame(), 'album', '回忆相簿');

// 玻璃瓶
function buildBottle() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.22, 16), mats.glass);
  body.position.y = 0.11;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.07, 0.07, 16), mats.glass);
  neck.position.y = 0.255;
  const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.045, 16), new THREE.MeshStandardMaterial({ color: 0xb7a8c8, roughness: 0.8 }));
  cork.position.y = 0.31;
  const note = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.004), mats.paper);
  note.position.set(0.015, 0.13, 0); note.rotation.z = 0.25;
  g.add(body, neck, cork, note);
  g.position.set(-0.82, 0.81, 0.02); g.rotation.y = 0.4;
  return g;
}
makeInteractive(buildBottle(), 'memory', '漂流记忆');

// 设置盒
function buildBox() {
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.16, 0.22), mats.woodDark);
  box.position.y = 0.08;
  const lid = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.025, 0.24), new THREE.MeshStandardMaterial({ color: 0xb6c3d9, roughness: 0.85 }));
  lid.position.y = 0.172;
  const mark = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.06), new THREE.MeshStandardMaterial({ color: 0x1a1410 }));
  mark.rotation.x = -Math.PI / 2; mark.position.set(0, 0.186, 0);
  g.add(box, lid, mark);
  g.position.set(-2.62, 0.81, -0.58); g.rotation.y = 0.3;
  return g;
}
makeInteractive(buildBox(), 'settings', '偏好设置');

// 咖啡杯（装饰）
function buildCup() {
  const g = new THREE.Group();
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.045, 0.09, 16), mats.ceramic);
  cup.position.y = 0.045;
  const saucer = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.012, 16), mats.ceramic);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.007, 8, 14, Math.PI), mats.ceramic);
  handle.position.set(0.055, 0.045, 0); handle.rotation.y = Math.PI / 2;
  g.add(saucer, cup, handle);
  g.position.set(-1.02, 0.81, 0.18);
  return g;
}
scene.add(buildCup());

// 台灯
function buildLamp() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.02, 16), new THREE.MeshStandardMaterial({ color: 0xb6c3d9, metalness: 0.25, roughness: 0.42 }));
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.5, 8), mats.metal);
  pole.position.y = 0.26;
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.18, 16, 1, true), mats.lampShade);
  shade.position.y = 0.52;
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035), mats.lampBulb);
  bulb.position.y = 0.46;
  g.add(base, pole, shade, bulb, lampLight.clone());
  g.children[4].position.set(0, 0.46, 0);
  g.position.set(-0.62, 0.81, -0.58);
  return g;
}
const lampGroup = buildLamp();
scene.add(lampGroup);

/* ---- 雨滴 ---- */
const rainCount = 250;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(rainCount * 3);
const rainSpeed = new Float32Array(rainCount);
for (let i = 0; i < rainCount; i++) {
  rainPos[i * 3] = -3.35 + Math.random() * 1.7;
  rainPos[i * 3 + 1] = 0.2 + Math.random() * 2.8;
  rainPos[i * 3 + 2] = -1.1 + Math.random() * 1.7;
  rainSpeed[i] = 0.04 + Math.random() * 0.04;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({ color: 0xb8c9ee, size: 0.018, transparent: true, opacity: 0.28, sizeAttenuation: true });
const rainSystem = new THREE.Points(rainGeo, rainMat);
scene.add(rainSystem);

/* ---- 交互 ---- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-10, -10);
let hovered = null;
let tooltipEl = null;

function showTooltip(text, x, y) {
  if (!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.style.cssText = 'position:fixed;z-index:20;padding:4px 10px;border-radius:4px;background:rgba(20,16,12,.8);color:#33445f;font-size:11px;letter-spacing:.1em;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px);white-space:nowrap;';
    document.body.appendChild(tooltipEl);
  }
  tooltipEl.textContent = text;
  tooltipEl.style.left = (x + 14) + 'px';
  tooltipEl.style.top = (y - 28) + 'px';
  tooltipEl.style.opacity = '1';
}
function hideTooltip() { if (tooltipEl) tooltipEl.style.opacity = '0'; }

function updatePointer(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
// Pointer events cover mouse, touch and stylus. Keep the raycaster in sync on phones,
// where a tap may not produce a mousemove before the click.
window.addEventListener('pointermove', updatePointer, { passive: true });
window.addEventListener('pointerdown', updatePointer, { passive: true });

function highlight(obj) {
  obj.traverse(c => {
    if (c.isMesh && c.material && !c.userData.origEmissive) {
      c.userData.origEmissive = c.material.emissive ? c.material.emissive.clone() : new THREE.Color(0,0,0);
      if (c.material.emissive) c.material.emissive.setHex(0x221a10);
    }
  });
}
function unhighlight(obj) {
  obj.traverse(c => {
    if (c.isMesh && c.material && c.userData.origEmissive) {
      c.material.emissive.copy(c.userData.origEmissive);
      delete c.userData.origEmissive;
    }
  });
}

window.addEventListener('click', e => {
  if (!document.body.classList.contains('desk')) return;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(interactives, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj && !obj.userData.go) obj = obj.parent;
    if (obj && obj.userData.go) enterView(obj.userData.go, obj);
  }
});

/* 点击进入视图 */
let isTransitioning = false;
function enterView(goKey, targetObj) {
  if (isTransitioning) return;
  isTransitioning = true;
  const objPos = new THREE.Vector3();
  targetObj.getWorldPosition(objPos);
  const camEnd = objPos.clone().add(new THREE.Vector3(0.2, 0.25, 0.7));
  const lookEnd = objPos.clone();
  const camStart = camera.position.clone();
  const lookStart = controls.target.clone();
  let t = 0;
  function step() {
    t += 0.025;
    if (t >= 1) {
      camera.position.copy(camEnd);
      controls.target.copy(lookEnd);
      setTimeout(() => {
        document.body.classList.remove('desk');
        if (goKey === 'chat') {
          const inp = document.getElementById('input');
          if (inp) setTimeout(() => inp.focus(), 200);
        } else {
          const map = { diary: 'diary', album: 'album', memory: 'memory', settings: 'settings' };
          const viewKey = map[goKey];
          if (viewKey) {
            const btn = document.querySelector('.drawer-nav [data-view="' + viewKey + '"]');
            if (btn) btn.click();
          }
        }
        isTransitioning = false;
      }, 250);
      return;
    }
    const e = easeOutCubic(t);
    camera.position.lerpVectors(camStart, camEnd, e);
    controls.target.lerpVectors(lookStart, lookEnd, e);
    requestAnimationFrame(step);
  }
  step();
}

/* 桌面 / 窗边视角：连续的 3D 镜头移动，不切换场景 */
let sceneMoveToken = 0;
function moveSceneCamera(position, target, activeButton) {
  if (isTransitioning) return;
  const token = ++sceneMoveToken;
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const toPos = new THREE.Vector3(...position);
  const toTarget = new THREE.Vector3(...target);
  let t = 0;
  controls.enabled = false;
  document.querySelectorAll('.scene-nav button').forEach(b => b.classList.toggle('active', b === activeButton));
  function frame() {
    if (token !== sceneMoveToken) return;
    t = Math.min(1, t + 0.035);
    const k = easeOutCubic(t);
    camera.position.lerpVectors(fromPos, toPos, k);
    controls.target.lerpVectors(fromTarget, toTarget, k);
    if (t < 1) requestAnimationFrame(frame);
    else { controls.enabled = true; controls.update(); }
  }
  requestAnimationFrame(frame);
}
const deskViewBtn = document.getElementById('deskViewBtn');
const windowViewBtn = document.getElementById('windowViewBtn');
deskViewBtn.addEventListener('click', () => moveSceneCamera([-1.65, 2.15, 4.25], [-1.65, 0.92, -0.45], deskViewBtn));
windowViewBtn.addEventListener('click', () => moveSceneCamera([-1.65, 1.95, 1.35], [-1.65, 1.35, -4.2], windowViewBtn));

/* 回桌子 */
document.getElementById('backGate').addEventListener('click', () => {
  document.body.classList.add('desk');
  const v = document.getElementById('view');
  if (v) v.hidden = true;
});

/* 回桌子导航按钮 */
const homeNav = document.querySelector('.drawer-nav [data-view="home"]');
if (homeNav) {
  homeNav.addEventListener('click', () => {
    setTimeout(() => {
      document.body.classList.add('desk');
      const v = document.getElementById('view');
      if (v) v.hidden = true;
    }, 20);
  });
}

/* ---- 动画 ---- */
let introT = 0;
const introFrom = new THREE.Vector3(-1.65, 2.65, 5.8);
const introTo = new THREE.Vector3(-1.65, 2.15, 4.25);
camera.position.copy(introFrom);

function animate() {
  requestAnimationFrame(animate);
  if (introT < 1) {
    introT += 0.006;
    const e = easeOutCubic(Math.min(introT, 1));
    camera.position.lerpVectors(introFrom, introTo, e);
  }
  const positions = rainSystem.geometry.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    positions[i * 3 + 1] -= rainSpeed[i];
    if (positions[i * 3 + 1] < 0) {
      positions[i * 3 + 1] = 2.8;
      positions[i * 3] = -3.35 + Math.random() * 1.7;
      positions[i * 3 + 2] = -1.1 + Math.random() * 1.7;
    }
  }
  rainSystem.geometry.attributes.position.needsUpdate = true;

  const turntable = interactives.find(i => i.userData.go === 'chat');
  if (turntable && turntable.userData.vinyl) {
    turntable.userData.vinyl.rotation.y += 0.008;
    turntable.userData.label.rotation.y += 0.008;
    turntable.userData.platter.rotation.y += 0.008;
  }

  const time = Date.now() * 0.001;
  lampLight.intensity = 2.8 + Math.sin(time * 1.3) * 0.15;

  if (document.body.classList.contains('desk') && !isTransitioning) {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(interactives, true);
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj && !obj.userData.go) obj = obj.parent;
      if (obj && obj !== hovered) {
        if (hovered) unhighlight(hovered);
        hovered = obj;
        highlight(hovered);
        showTooltip(hovered.userData.label,
          (mouse.x + 1) * 0.5 * window.innerWidth,
          (-mouse.y + 1) * 0.5 * window.innerHeight);
      }
    } else {
      if (hovered) { unhighlight(hovered); hovered = null; hideTooltip(); }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* 加载完成 */
document.getElementById('loader').classList.add('done');
setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 900);
</script>
