<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#E7E4DE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317171B'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Helvetica' fill='%23F2EFE9' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<title>LIWU · 小手机</title>
<style>
/* ============================================================
   LIWU · design tokens & primitives
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:var(--stage);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
:root{
  --stage:#E7E4DE;
  --paper:#F2EFE9;
  --paper-2:#EDEAE5;
  --surface:#FFFFFF;
  --surface-2:#F8F7F4;
  --surface-3:#F1EFEB;
  --ink:#17171B;
  --ink-2:#4C4C55;
  --muted:#8B8B94;
  --muted-2:#A9A9B0;
  --line:rgba(23,23,27,.075);
  --line-2:rgba(23,23,27,.13);
  --accent:#8D9A87;
  --accent-ink:#5C6B57;
  --accent-soft:#EDF0EA;
  --danger:#B4645C;
  --r-xl:30px;
  --r-lg:24px;
  --r-md:18px;
  --r-sm:13px;
  --shadow-s:0 1px 2px rgba(23,23,27,.04);
  --shadow-m:0 2px 6px rgba(23,23,27,.05), 0 12px 30px -18px rgba(23,23,27,.28);
  --shadow-l:0 30px 80px -30px rgba(23,23,27,.45), 0 2px 0 rgba(255,255,255,.5) inset;
  --status-h:46px;
  --nav-h:52px;
  --tab-h:62px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
::selection{background:rgba(141,154,135,.28)}

/* scrollbars */
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0;height:0}

/* ---------- type ---------- */
.t-xs{font-size:10px;letter-spacing:.04em}
.t-sm{font-size:12px}
.t-md{font-size:14px}
.t-lg{font-size:17px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:-.01em}
.eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.serif{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 18px;border-radius:14px;font-size:13.5px;font-weight:600;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  transition:transform .18s var(--ease),background .18s,opacity .18s;
  white-space:nowrap;
}
.btn:active{transform:scale(.965)}
.btn.primary{background:var(--ink);color:#fff;border-color:transparent}
.btn.soft{background:var(--surface-2);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn.sm{height:32px;padding:0 13px;font-size:12px;border-radius:11px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.38;pointer-events:none}
.icon-btn{
  width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink);transition:background .18s,transform .18s;
}
.icon-btn:active{transform:scale(.9);background:rgba(23,23,27,.05)}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:9px;
  font-size:11px;font-weight:500;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent;
}
.chip.on{background:var(--ink);color:#fff}
.chip.line{border-color:var(--line);background:transparent}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field > label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding-left:2px}
.input,.textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;font-size:13.5px;line-height:1.6;color:var(--ink);
  transition:border-color .18s,box-shadow .18s;
}
.input:focus,.textarea:focus{border-color:rgba(23,23,27,.25);box-shadow:0 0 0 3px rgba(23,23,27,.04)}
.textarea{min-height:88px;resize:none}
.input::placeholder,.textarea::placeholder{color:var(--muted-2)}
.helper{font-size:10.5px;color:var(--muted);line-height:1.5}

.switch{
  position:relative;width:42px;height:25px;border-radius:20px;background:rgba(23,23,27,.14);
  transition:background .25s var(--ease);flex:none;
}
.switch:after{
  content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .25s var(--ease);
}
.switch.on{background:var(--ink)}
.switch.on:after{transform:translateX(17px)}

.segmented{
  display:flex;gap:3px;padding:3px;background:var(--surface-3);border-radius:12px;
}
.segmented button{
  flex:1;height:29px;border-radius:9px;font-size:11.5px;font-weight:600;color:var(--muted);
  transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center;gap:5px;
}
.segmented button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,23,27,.09)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:0 1px 2px rgba(23,23,27,.04),0 14px 30px -28px rgba(23,23,27,.55)}
.group{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-s)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative;transition:background .16s;min-height:52px}
.row + .row:before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row.tap:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.row-sub{font-size:11px;color:var(--muted);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-val{font-size:11.5px;color:var(--muted-2);display:flex;align-items:center;gap:5px;flex:none;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.section{padding:0 18px;margin-top:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px}
.section-title{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.section-act{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}

/* ---------- toast / sheet / dialog ---------- */
.toast-wrap{position:absolute;left:0;right:0;bottom:96px;display:flex;justify-content:center;z-index:400;pointer-events:none}
.toast{
  background:rgba(23,23,27,.9);backdrop-filter:blur(14px);color:#fff;font-size:12px;
  padding:9px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  animation:toastIn .28s var(--ease-out);
  max-width:80%;text-align:center;line-height:1.5;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

.backdrop{position:absolute;inset:0;background:rgba(20,20,24,.32);backdrop-filter:blur(2px);z-index:300}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:310;background:var(--surface);
  border-radius:26px 26px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.18);
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88%;display:flex;flex-direction:column;
  animation:sheetUp .34s var(--ease-out);
}
.sheet.pop{animation:sheetUp .3s var(--ease-out)}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grabber{width:34px;height:4px;border-radius:4px;background:rgba(23,23,27,.15);margin:4px auto 12px;flex:none}
.sheet-title{font-size:15px;font-weight:600;text-align:center;margin-bottom:4px}
.sheet-sub{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.5}
.sheet-body{overflow-y:auto;scrollbar-width:none;flex:1;margin:0 -2px}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-actions{display:flex;gap:8px;margin-top:14px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 30px;text-align:center;color:var(--muted)}
.empty .e-ico{width:56px;height:56px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted-2);margin-bottom:2px}
.empty .e-title{font-size:13px;font-weight:600;color:var(--ink-2)}
.empty .e-sub{font-size:11px;line-height:1.65;max-width:220px}

/* avatar */
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--surface-3);display:block}
.av-ph{display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:.02em;background:linear-gradient(145deg,#C6C2B8,#A9A69E)}

/* image placeholder stripes */
.stripes{
  background-image:repeating-linear-gradient(135deg,rgba(23,23,27,.045) 0 1px,transparent 1px 7px);
}
.dots{
  background-image:radial-gradient(rgba(23,23,27,.10) 1px,transparent 1px);
  background-size:14px 14px;
}

/* utility */
.f{display:flex;align-items:center}
.fc{display:flex;align-items:center;justify-content:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}
.w100{width:100%}
.rel{position:relative}
.hide{display:none!important}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ============================================================
   STAGE · DEVICE · HOME
   ============================================================ */
.stage{
  position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(90% 70% at 12% 0%,#F5F3EE 0%,rgba(245,243,238,0) 58%),
    radial-gradient(80% 60% at 92% 100%,#DBD6CD 0%,rgba(219,214,205,0) 62%),
    var(--stage);
}
.stage:before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(23,23,27,.10) 1px,transparent 1px);
  background-size:22px 22px;opacity:.5;
  mask-image:radial-gradient(70% 60% at 50% 50%,#000 20%,transparent 85%);
}
.brand{
  position:fixed;left:38px;top:34px;z-index:5;display:flex;flex-direction:column;gap:5px;pointer-events:none;
}
.brand .b1{font-size:20px;letter-spacing:.34em;font-weight:500}
.brand .b2{font-size:8px;letter-spacing:.28em;color:rgba(23,23,27,.42);text-transform:uppercase}
.brand .b3{width:26px;height:1px;background:rgba(23,23,27,.2);margin-top:4px}
.stage-hint{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
  font-size:10px;letter-spacing:.08em;color:rgba(23,23,27,.42);display:flex;align-items:center;gap:8px;
  pointer-events:none;white-space:nowrap;
}
.stage-hint i{width:16px;height:1px;background:rgba(23,23,27,.2);display:block}
.stage-side{
  position:fixed;right:34px;top:50%;transform:translateY(-50%);z-index:5;
  writing-mode:vertical-rl;font-size:8.5px;letter-spacing:.34em;color:rgba(23,23,27,.3);
  pointer-events:none;
}

.device{
  position:relative;width:406px;height:min(872px,calc(100vh - 40px));padding:8px;border-radius:60px;
  background:linear-gradient(155deg,#3A3A3E 0%,#0C0C0F 32%,#1C1C21 70%,#2E2E33 100%);
  box-shadow:
    0 2px 1px rgba(255,255,255,.24) inset,
    0 0 0 1px rgba(0,0,0,.6),
    0 40px 90px -28px rgba(23,23,27,.55),
    0 10px 30px -10px rgba(23,23,27,.35);
  flex:none;z-index:2;
}
.device:before{content:"";position:absolute;left:-2px;top:170px;width:3px;height:64px;border-radius:3px;background:linear-gradient(#3a3a3e,#18181b);box-shadow:0 92px 0 #242428}
.device:after{content:"";position:absolute;right:-2px;top:210px;width:3px;height:96px;border-radius:3px;background:linear-gradient(#3a3a3e,#18181b)}
.screen{
  position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;
  background:var(--paper);display:flex;flex-direction:column;isolation:isolate;
}
.island{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;
  background:#08080A;z-index:300;pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.04);
}
.island:after{content:"";position:absolute;right:11px;top:10px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#243447,#0a0a0c 70%);box-shadow:0 0 0 1px rgba(255,255,255,.06)}

/* status bar */
.statusbar{
  position:absolute;top:0;left:0;right:0;height:var(--status-h);z-index:280;
  display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink);pointer-events:none;
}
.statusbar.dark{color:#fff}
.statusbar .sb-r{display:flex;align-items:center;gap:5px}
.statusbar svg{display:block}

/* page shell */
.page{
  position:absolute;inset:0;z-index:100;background:var(--paper);
  display:flex;flex-direction:column;padding-top:var(--status-h);
  will-change:transform;
}
.page.flush{padding-top:0}
.nav{
  height:var(--nav-h);flex:none;display:flex;align-items:center;gap:2px;padding:0 10px 0 6px;
  position:relative;z-index:20;
  background:rgba(244,242,238,.82);backdrop-filter:blur(20px) saturate(1.2);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.nav.bordered{border-bottom-color:var(--line)}
.nav.on-white{background:rgba(255,255,255,.82)}
.nav-title{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap;max-width:56%;
  overflow:hidden;text-overflow:ellipsis;
}
.nav-back{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-right:0;transition:background .18s,transform .18s}
.nav-back:active{background:rgba(23,23,27,.05);transform:scale(.92)}
.nav-act{margin-left:auto;display:flex;align-items:center;gap:2px;z-index:2}
.nav-act .txt{font-size:12.5px;font-weight:600;padding:0 8px}
.nav-cap{font-size:9px;letter-spacing:.08em;color:var(--muted);padding-left:6px}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.body::-webkit-scrollbar{display:none}
.pad{padding:0 18px}
.pb{padding-bottom:32px}

/* page transitions */
.pg-enter-active,.pg-leave-active{transition:transform .36s var(--ease-out),opacity .3s var(--ease),border-radius .36s var(--ease)}
.pg-enter-from{transform:translateX(102%);border-radius:26px 0 0 26px}
.pg-leave-to{transform:translateX(-26%);opacity:.55}
.pg-pop-enter-from{transform:translateX(-26%);opacity:.55}
.pg-pop-leave-to{transform:translateX(102%);border-radius:26px 0 0 26px}
.pg-enter-active .nav,.pg-leave-active .nav{transition:opacity .2s}

/* ============================================================
   HOME
   ============================================================ */
.home{position:absolute;inset:0;z-index:1;overflow:hidden;background:#E9E5DD}
.wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .45s var(--ease),transform .6s var(--ease)}
.wallpaper.tint{
  background-image:
    radial-gradient(58% 42% at 18% 8%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 70%),
    radial-gradient(70% 50% at 88% 22%,rgba(203,196,183,.55) 0%,rgba(203,196,183,0) 70%),
    radial-gradient(60% 38% at 50% 104%,rgba(173,181,166,.55) 0%,rgba(173,181,166,0) 72%),
    linear-gradient(168deg,#F3F0E8 0%,#E8E2D6 46%,#DAD3C5 100%);
}
.wallpaper.noise:after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(23,23,27,.16) .6px,transparent .6px);
  background-size:4px 4px;opacity:.16;mix-blend-mode:multiply;
}
.home-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 22%,transparent 78%,rgba(255,255,255,.16))}
.home-inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--status-h) 18px 0}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page-grid{
  min-width:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:94px;gap:12px;
  align-content:start;padding:6px 0 0;position:relative;
}
.home-foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 22px}
.dots-nav{display:flex;gap:6px;align-items:center;height:8px}
.dots-nav i{width:5px;height:5px;border-radius:50%;background:rgba(23,23,27,.2);transition:all .3s var(--ease)}
.dots-nav i.on{background:rgba(23,23,27,.62);width:5px}

.dock{
  width:100%;height:78px;border-radius:26px;display:flex;align-items:center;justify-content:space-around;
  padding:0 8px;
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 12px 32px -18px rgba(23,23,27,.4),inset 0 1px 0 rgba(255,255,255,.5);
}
.dock .app-label{display:none}
.dock .app{padding:0}

/* app icon */
.app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .18s var(--ease);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app:active{transform:scale(.93)}
.app-icon{
  width:58px;height:58px;border-radius:16px;display:grid;place-items:center;position:relative;color:#fff;
  box-shadow:0 8px 18px -10px rgba(23,23,27,.55),inset 0 1px 0 rgba(255,255,255,.28);
  overflow:hidden;
}
.app-icon:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 52%);pointer-events:none}
.app-label{font-size:10px;font-weight:500;letter-spacing:.01em;color:#36363B;text-shadow:0 1px 0 rgba(255,255,255,.4);white-space:nowrap}
.dock .app-icon{width:54px;height:54px;border-radius:15px}

/* edit mode */
.home.editing .app{animation:jiggle 1.6s ease-in-out infinite}
.home.editing .app:nth-child(2n){animation-delay:-.5s}
.home.editing .app:nth-child(3n){animation-delay:-.9s}
@keyframes jiggle{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
.del-badge{
  position:absolute;top:-4px;left:calc(50% - 36px);width:19px;height:19px;border-radius:50%;
  background:rgba(23,23,27,.72);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;
  z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:pop .22s var(--ease-out);
}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.edit-bar{
  position:absolute;top:calc(var(--status-h) + 4px);left:0;right:0;z-index:120;
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  animation:fadeIn .25s var(--ease);
}
.edit-bar .eb{font-size:10px;letter-spacing:.1em;color:rgba(23,23,27,.5);text-transform:uppercase}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.home-hint{
  position:absolute;left:0;right:0;bottom:calc(78px + 62px);text-align:center;font-size:9px;
  letter-spacing:.1em;color:rgba(23,23,27,.34);z-index:3;pointer-events:none;
}

/* dragging */
.dragging{position:relative;z-index:200!important;pointer-events:none;animation:none!important}
.dragging .app-icon{transform:scale(1.12);box-shadow:0 20px 34px -14px rgba(23,23,27,.6)}
.drag-ghost{opacity:.16;filter:grayscale(1);animation:none!important}
.drop-hint{
  position:absolute;border-radius:22px;background:rgba(255,255,255,.34);
  border:1px dashed rgba(23,23,27,.22);z-index:2;pointer-events:none;
  transition:all .16s var(--ease);
}
.page-dot-edge{position:absolute;top:50%;width:4px;height:44px;border-radius:4px;background:rgba(23,23,27,.16);z-index:5;opacity:0;transition:opacity .2s}
.home .page-dot-edge.on{opacity:1}

/* ============================================================
   WIDGETS
   ============================================================ */
.widget{position:relative;border-radius:24px;overflow:hidden}
.widget-edit{position:absolute;inset:0;border-radius:24px;border:1.5px dashed transparent;z-index:1;pointer-events:none}
.home.editing .widget .widget-edit{border-color:rgba(23,23,27,.14)}

/* postcard */
.pc{--pc-base:#EFEBE3;background:var(--pc-base);box-shadow:0 16px 36px -26px rgba(23,23,27,.6),0 0 0 1px rgba(255,255,255,.4) inset}
.pc-bg{position:absolute;left:0;right:0;top:0;height:66%;background-size:cover;background-position:center;transition:opacity .3s}
.pc-bg.empty{background:linear-gradient(150deg,#E4DFD4,#D6D0C4)}
.pc-fade{position:absolute;left:0;right:0;top:34%;height:34%;background:linear-gradient(180deg,rgba(239,235,227,0) 0%,var(--pc-base) 92%)}
.pc-grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) .5px,transparent .5px);background-size:3px 3px;opacity:.25;mix-blend-mode:overlay;pointer-events:none}
.pc-inner{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14px}
.pc-av-wrap{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;padding:3px;background:#fff;box-shadow:0 8px 22px -10px rgba(23,23,27,.5)}
.pc-av{width:100%;height:100%;border-radius:50%;object-fit:cover;overflow:hidden;display:grid;place-items:center;background:#DCD8CF;color:#fff}
.pc-name{font-size:14.5px;font-weight:600;letter-spacing:.06em;color:#2A2A2E;line-height:1.2}
.pc-sign{font-size:10px;color:#8C8880;margin-top:4px;letter-spacing:.02em;max-width:82%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-date{position:absolute;top:14px;left:16px;font-size:8px;letter-spacing:.18em;color:#fff;mix-blend-mode:difference;z-index:4}
.pc-mark{position:absolute;top:14px;right:16px;font-size:8px;letter-spacing:.16em;color:#fff;mix-blend-mode:difference;z-index:4}

/* polaroid */
.polaroid{background:transparent;filter:drop-shadow(0 14px 22px rgba(23,23,27,.18))}
.pol-back{position:absolute;width:70%;height:76%;left:15%;top:11%;background:#fff;border-radius:3px;transform:rotate(8deg);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.pol-front{position:absolute;width:72%;height:80%;left:14%;top:9%;background:#fff;border-radius:3px;transform:rotate(-6deg);padding:6px 6px 19px;display:flex;flex-direction:column;transition:transform .3s var(--ease)}
.polaroid:active .pol-front{transform:rotate(-3deg) scale(1.02)}
.pol-img{flex:1;background:#E6E3DC;border-radius:2px;overflow:hidden;display:grid;place-items:center;color:#B4B0A6}
.pol-cap{height:16px;display:flex;align-items:center;justify-content:center;font-size:7.5px;color:#9C988E;letter-spacing:.08em}
.pol-tape{position:absolute;top:-4px;left:50%;transform:translateX(-50%) rotate(-4deg);width:34px;height:11px;background:rgba(226,220,205,.72);z-index:4}

/* music */
.music{background:linear-gradient(155deg,#FDFCFA,#F2EFE8);border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 30px -22px rgba(23,23,27,.5);padding:13px;display:flex;flex-direction:column;justify-content:space-between}
.music-top{display:flex;gap:10px;align-items:flex-start}
.music-art{width:54px;height:54px;border-radius:13px;flex:none;background:conic-gradient(from 210deg,#2E2E33,#54544F,#2A2A2F,#6B6B62,#2E2E33);position:relative;overflow:hidden;display:grid;place-items:center}
.music-art:after{content:"";width:15px;height:15px;border-radius:50%;background:#F4F2EE;box-shadow:0 0 0 5px rgba(255,255,255,.1)}
.music-art.playing{animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.music-meta{flex:1;min-width:0;padding-top:1px}
.music-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-artist{font-size:8.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-bot{display:flex;align-items:center;gap:9px;margin-top:2px}
.music-play{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s}
.music-play:active{transform:scale(.9)}
.music-track{flex:1;min-width:0}
.music-bar{height:2.5px;border-radius:2px;background:rgba(23,23,27,.1);position:relative;overflow:visible;margin-bottom:5px}
.music-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink);transition:width .3s linear}
.music-bar i:after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--ink)}
.music-time{display:flex;justify-content:space-between;font-size:7.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* dialogue */
.dlg{display:flex;flex-direction:column;justify-content:center;gap:11px;padding:16px 12px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);border-radius:24px}
.dlg-row{display:flex;align-items:flex-end;gap:6px;min-width:0}
.dlg-row.me{flex-direction:row-reverse}
.dlg-av{width:18px;height:18px;border-radius:50%;overflow:hidden;flex:none;background:#D8D4CB;display:grid;place-items:center;color:#fff;font-size:7px}
.dlg-bub{font-size:9.5px;line-height:1.4;padding:7px 9px;border-radius:11px 11px 11px 3px;background:#fff;color:#3A3A3F;max-width:112px;box-shadow:0 2px 6px rgba(23,23,27,.05);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dlg-row.me .dlg-bub{background:#1D1D21;color:#fff;border-radius:11px 11px 3px 11px}

/* store / misc tiles */
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}

/* ============================================================
   CHAT
   ============================================================ */
.chat-app{background:var(--paper)}
.chat-head{padding:6px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;flex:none}
.chat-head h1{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.chat-head .sub{font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.chat-head-acts{display:flex;gap:2px;padding-bottom:2px}
.search-pill{
  margin:0 18px 4px;height:34px;border-radius:11px;background:rgba(255,255,255,.72);
  border:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;
  font-size:11.5px;color:var(--muted);flex:none;
}
.search-pill input{flex:1;border:0;background:none;font-size:11.5px}
.list{display:flex;flex-direction:column}
.chat-row{display:flex;gap:11px;padding:11px 18px;align-items:center;position:relative;transition:background .16s}
.chat-row:active{background:rgba(255,255,255,.6)}
.chat-row + .chat-row:before{content:"";position:absolute;top:0;left:69px;right:0;height:1px;background:var(--line)}
.chat-av{position:relative;flex:none}
.chat-av .av{width:45px;height:45px}
.chat-av .dot{position:absolute;right:0;bottom:1px;width:10px;height:10px;border-radius:50%;background:#8FA886;border:2px solid var(--paper)}
.chat-main{flex:1;min-width:0}
.chat-line1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chat-name{font-size:13.5px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:5px;min-width:0}
.chat-time{font-size:9px;color:var(--muted-2);flex:none;font-variant-numeric:tabular-nums}
.chat-preview{font-size:11.5px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4;flex:1;min-width:0}
.chat-preview em{font-style:normal;color:var(--accent-ink);font-size:10px}
.unread{min-width:16px;height:16px;border-radius:9px;background:var(--ink);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 4px;margin-left:4px;flex:none}

.app-tabs{
  flex:none;height:var(--tab-h);display:flex;align-items:center;justify-content:space-around;
  padding-bottom:8px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px);
  border-top:1px solid var(--line);
}
.app-tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--muted-2);width:60px;transition:color .18s}
.app-tabs button.on{color:var(--ink);font-weight:600}
.app-tabs .badge{position:absolute;top:-2px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.app-tabs .t-ico{position:relative}

/* ---------- chat room ---------- */
.room{background:#F3F1EC}
.room-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.room-bg:after{content:"";position:absolute;inset:0;background:rgba(243,241,236,.82);backdrop-filter:blur(1px)}
.room-layer{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;min-height:0}
.room-nav{
  height:50px;flex:none;display:flex;align-items:center;padding:0 8px;gap:2px;
  background:rgba(247,245,241,.8);backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid rgba(23,23,27,.05);
  position:relative;z-index:10;
}
.room-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:58%;width:max-content}
.room-name{font-size:14px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-status{font-size:8.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em;transition:color .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.room-status.typing{color:var(--accent-ink)}
.typing-dots{display:inline-flex;gap:2px;align-items:center}
.typing-dots i{width:2.5px;height:2.5px;border-radius:50%;background:currentColor;animation:blink 1.1s infinite}
.typing-dots i:nth-child(2){animation-delay:.18s}
.typing-dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}

.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 8px;scrollbar-width:none;overscroll-behavior:contain}
.msgs::-webkit-scrollbar{display:none}
.day-sep{display:flex;justify-content:center;margin:10px 0 16px}
.day-sep span{font-size:8.5px;letter-spacing:.1em;color:var(--muted-2);background:rgba(255,255,255,.5);padding:3px 9px;border-radius:8px}
.msg{display:flex;gap:8px;margin-bottom:16px;align-items:flex-start;position:relative}
.msg.me{flex-direction:row-reverse}
.msg-av{width:32px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.msg-av .av{width:32px;height:32px;border-radius:11px;font-size:11px}
.msg-time{font-size:8px;color:var(--muted-2);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;transform:scale(.94)}
.msg-body{width:calc(100% - 84px);max-width:calc(100% - 84px);display:flex;flex-direction:column;gap:5px;min-width:0;align-items:flex-start}
.msg.me .msg-body{align-items:flex-end}
.bubble{
  position:relative;font-size:13px;line-height:1.62;padding:9px 12px;border-radius:16px;
  background:#fff;color:#26262B;box-shadow:0 1px 2px rgba(23,23,27,.04);
  word-break:break-word;white-space:pre-wrap;width:fit-content;max-width:86%;
  transition:transform .16s var(--ease),box-shadow .16s;
}
.msg.them .bubble{border-bottom-left-radius:5px}
.msg.me .bubble{background:#1E1E23;color:#F4F3EF;border-bottom-right-radius:5px;box-shadow:0 6px 16px -10px rgba(23,23,27,.5)}
.msg.me .bubble.multi{border-bottom-right-radius:16px}
.msg.them .bubble.multi{border-bottom-left-radius:16px}
.msg.them .bubble:last-child{border-bottom-left-radius:5px}
.msg.me .bubble:last-child{border-bottom-right-radius:5px}
.msg .bubble.pressed{transform:scale(.975)}
.narr{align-self:stretch;text-align:center;font-size:10.5px;color:#9B978F;line-height:1.7;letter-spacing:.02em;padding:3px 20px;max-width:100%;align-self:center}
.msg.me .narr{color:#9B978F}
.think{width:fit-content;max-width:100%;border-radius:9px;background:rgba(255,255,255,.46);border:1px solid rgba(23,23,27,.055);overflow:hidden;transition:background .2s}
.think.open{width:100%;background:rgba(255,255,255,.62)}
.think-head{display:flex;align-items:center;gap:5px;padding:4px 9px;font-size:9px;color:#9A968D;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.think-head .arr{transition:transform .2s;opacity:.7}.think.open .think-head .arr{margin-left:4px}
.think.open .think-head .arr{transform:rotate(180deg)}
.think-body{padding:0 9px 8px;font-size:10px;line-height:1.65;color:#8A867E;font-style:italic;white-space:pre-wrap;border-top:1px solid rgba(23,23,27,.05);padding-top:7px;margin-top:1px}
.tool{
  width:fit-content;max-width:100%;border-radius:9px;background:rgba(255,255,255,.55);border:1px dashed rgba(23,23,27,.14);
  font-family:var(--mono);font-size:8.5px;color:#7C786F;overflow:hidden;
}
.tool-head{display:flex;align-items:center;gap:5px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.tool.open{width:100%}
.tool-head .tname{color:#5D594F}
.tool-head .arr{margin-left:auto;transition:transform .2s}
.tool.open .tool-head .arr{transform:rotate(180deg)}
.tool-body{padding:6px 8px;border-top:1px dashed rgba(23,23,27,.12);white-space:pre-wrap;line-height:1.6;color:#8A867E}

/* composer */
.composer{
  flex:none;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(247,245,241,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(23,23,27,.05);
  display:flex;align-items:flex-end;gap:7px;position:relative;z-index:8;
}
.comp-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#6E6A62;background:rgba(23,23,27,.05);flex:none;transition:transform .18s,background .18s;margin-bottom:1px}
.comp-btn:active{transform:scale(.9);background:rgba(23,23,27,.09)}
.comp-input{
  flex:1;min-height:32px;max-height:100px;background:#fff;border:1px solid rgba(23,23,27,.07);
  border-radius:16px;padding:7px 12px;font-size:13px;line-height:1.5;overflow-y:auto;scrollbar-width:none;
  transition:border-color .2s;
}
.comp-input::-webkit-scrollbar{display:none}
.comp-input:focus{border-color:rgba(23,23,27,.18)}
.send-btn{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;margin-bottom:1px;transition:transform .18s,opacity .18s}
.send-btn:active{transform:scale(.9)}
.send-btn.off{opacity:.28;pointer-events:none}
.send-btn.sending{background:var(--muted)}

/* drawer */
.drawer{padding:4px 0 2px}
.drawer .d-sec{border-top:1px solid var(--line);padding:14px 0}
.drawer .d-sec:first-child{border-top:0;padding-top:2px}
.d-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.d-title{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.d-desc{font-size:9.5px;color:var(--muted);line-height:1.55;margin-top:5px}
.narr-input{min-height:62px;font-size:12.5px}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* bubble menu */
.bub-menu{
  position:absolute;z-index:400;background:rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;box-shadow:0 18px 40px -16px rgba(23,23,27,.4);
  padding:4px;display:flex;flex-direction:column;min-width:132px;animation:menuIn .18s var(--ease-out);
}
@keyframes menuIn{from{opacity:0;transform:scale(.92) translateY(4px)}to{opacity:1;transform:none}}
.bub-menu button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:11.5px;color:var(--ink);text-align:left;transition:background .15s}
.bub-menu button:active{background:rgba(23,23,27,.06)}
.bub-menu button.danger{color:var(--danger)}
.bub-menu .sep{height:1px;background:var(--line);margin:3px 6px}

/* ---------- login ---------- */
.login{position:absolute;inset:0;z-index:110;background:var(--paper);display:flex;flex-direction:column;padding-top:var(--status-h);overflow:hidden}
.login-bg{position:absolute;inset:0;background:
  radial-gradient(60% 40% at 70% 4%,rgba(190,199,183,.5),transparent 70%),
  radial-gradient(50% 36% at 12% 72%,rgba(210,198,185,.45),transparent 70%),
  linear-gradient(180deg,#F7F5F0,#EDE9E2);}
.login-bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(23,23,27,.12) .5px,transparent .5px);background-size:5px 5px;opacity:.2}
.login-inner{position:relative;z-index:2;flex:1;overflow-y:auto;scrollbar-width:none;padding:0 26px 30px}
.login-inner::-webkit-scrollbar{display:none}
.login-mark{padding:26px 0 18px;display:flex;flex-direction:column;gap:7px}
.login-mark .lm1{font-size:26px;letter-spacing:.3em;font-weight:400}
.login-mark .lm2{font-size:8.5px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.login-mark .lm3{font-size:11px;color:var(--muted);line-height:1.7;margin-top:6px;max-width:240px}
.login-card{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(16px);border-radius:24px;padding:16px;box-shadow:0 20px 50px -30px rgba(23,23,27,.4)}
.login-tabs{display:flex;gap:16px;margin-bottom:16px;padding:0 2px}
.login-tabs button{font-size:14px;font-weight:600;color:var(--muted-2);position:relative;padding-bottom:4px;transition:color .2s}
.login-tabs button.on{color:var(--ink)}
.login-tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--ink)}
.avatar-upload{display:flex;align-items:center;gap:14px}
.au-ring{width:62px;height:62px;border-radius:50%;padding:2px;background:rgba(255,255,255,.9);box-shadow:0 4px 14px -6px rgba(0,0,0,.2);flex:none}
.au-ring .av{width:100%;height:100%;display:grid;place-items:center;color:#fff;background:#D6D2C9}
.gender-row{display:flex;gap:6px}
.gender-row button{flex:1;height:34px;border-radius:11px;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid transparent;transition:all .2s}
.gender-row button.on{background:var(--ink);color:#fff}
.form-stack{display:flex;flex-direction:column;gap:13px}
.reg-more{border-top:1px solid var(--line);padding-top:12px}
.reg-toggle{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);cursor:pointer}

/* ---------- contacts / discover / me ---------- */
.alpha-head{padding:14px 20px 5px;font-size:9px;letter-spacing:.16em;color:var(--muted-2);font-weight:600}
.contact-row{display:flex;align-items:center;gap:11px;padding:9px 18px;transition:background .16s}
.contact-row:active{background:rgba(255,255,255,.6)}
.contact-row .av{width:38px;height:38px}
.contact-name{font-size:13px;font-weight:500}
.contact-id{font-size:9.5px;color:var(--muted-2);font-family:var(--mono);margin-top:2px}
.profile-card{margin:8px 18px 0;padding:20px 18px;border-radius:24px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);display:flex;align-items:center;gap:14px;backdrop-filter:blur(12px)}
.profile-card .av{width:62px;height:62px;border-radius:22px}
.profile-name{font-size:17px;font-weight:600}
.profile-sig{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.stat-row{display:flex;gap:0;margin:14px 18px 0;background:rgba(255,255,255,.66);border-radius:20px;border:1px solid rgba(255,255,255,.8);padding:12px 0}
.stat{flex:1;text-align:center;position:relative}
.stat + .stat:before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--line)}
.stat .n{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.04em}

/* moments */
.moments{position:absolute;inset:0;z-index:200;background:#F2F0EB;display:flex;flex-direction:column;padding-top:0;animation:momentIn .4s var(--ease-out)}
@keyframes momentIn{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.mo-cover{height:236px;position:relative;flex:none;background:linear-gradient(150deg,#C9C3B6,#8E9585)}
.mo-cover .cover-img{position:absolute;inset:0;background-size:cover;background-position:center}
.mo-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.14),rgba(0,0,0,0) 42%,rgba(0,0,0,.2))}
.mo-top{position:absolute;top:var(--status-h);left:0;right:0;padding:6px 16px;display:flex;justify-content:space-between;z-index:4;color:#fff}
.mo-top button{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.22);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center}
.mo-id{position:absolute;right:18px;bottom:-26px;display:flex;align-items:flex-end;gap:12px;z-index:5}
.mo-id .av{width:64px;height:64px;border-radius:18px;border:3px solid #F2F0EB}
.mo-id .nm{color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.3);padding-bottom:26px}
.mo-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:38px 18px 30px}
.mo-body::-webkit-scrollbar{display:none}
.mo-sig{font-size:10.5px;color:var(--muted);line-height:1.6;padding:0 2px 14px;display:flex;justify-content:space-between;gap:10px}
.mo-card{background:#fff;border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 1px 2px rgba(23,23,27,.04);border:1px solid rgba(23,23,27,.04)}
.mo-card .mh{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.mo-card .mh .av{width:32px;height:32px;border-radius:10px}
.mo-card .mh .nm{font-size:11.5px;font-weight:600}
.mo-card .mh .tm{font-size:8.5px;color:var(--muted-2);margin-top:2px}
.mo-text{font-size:12.5px;line-height:1.72;color:#33333A;white-space:pre-wrap;word-break:break-word}
.mo-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:9px;border-radius:8px;overflow:hidden}
.mo-imgs div{aspect-ratio:1;background-size:cover;background-position:center;background-color:#E7E3DA}
.mo-foot{display:flex;align-items:center;gap:16px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:9.5px;color:var(--muted)}
.mo-foot button{display:flex;align-items:center;gap:4px;color:var(--muted)}
.mo-foot button.on{color:var(--danger)}
.mo-likes{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding:7px 8px;background:#F8F7F4;border-radius:8px;font-size:9.5px;color:var(--accent-ink);line-height:1.5}
.mo-cmts{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.mo-cmt{font-size:9.5px;line-height:1.55;color:#55555E;background:#F8F7F4;border-radius:8px;padding:6px 8px}
.mo-cmt b{font-weight:600;color:#7A8A74;margin-right:4px}
.mo-empty{text-align:center;padding:40px 20px;font-size:10.5px;color:var(--muted);line-height:1.7}

/* ---------- chat settings ---------- */
.set-hero{padding:18px 18px 6px;display:flex;align-items:center;gap:12px}
.set-hero .av{width:54px;height:54px;border-radius:18px}
.set-hero .nm{font-size:16px;font-weight:600}
.set-hero .id{font-size:9.5px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.css-area{min-height:118px;font-family:var(--mono);font-size:10.5px;line-height:1.7;background:#FBFBF9;color:#3E3E45}
.bg-pick{height:92px;border-radius:14px;background:var(--surface-3);border:1px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;color:var(--muted);background-size:cover;background-position:center;overflow:hidden}

.login-back{
  position:absolute;top:calc(var(--status-h) - 8px);left:14px;z-index:5;
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.6);border:1px solid rgba(23,23,27,.06);
  backdrop-filter:blur(14px);box-shadow:0 2px 8px rgba(23,23,27,.06);color:var(--ink);
}

/* ============================================================
   APP PAGES · worldbook / memory / archive / store / notices /
   beauty / settings / data
   ============================================================ */
.app-head{padding:10px 18px 14px;flex:none}
.app-head .ah-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.app-head h1{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.app-head .desc{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:6px;max-width:250px}
.app-head .mark{font-size:8.5px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase}
.app-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.app-scroll::-webkit-scrollbar{display:none}

/* worldbook */
.wb-card{display:flex;gap:13px;padding:13px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);margin-bottom:10px;position:relative;transition:transform .18s}
.wb-card:active{transform:scale(.988)}
.wb-cover{width:54px;height:70px;border-radius:9px;flex:none;position:relative;overflow:hidden;background:linear-gradient(155deg,#B9B3A4,#8F8A7D);box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.wb-cover:after{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28)}
.wb-cover span{position:absolute;left:13px;top:12px;right:5px;font-size:8px;line-height:1.5;color:rgba(255,255,255,.92);letter-spacing:.06em}
.wb-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.wb-title{font-size:14px;font-weight:600;letter-spacing:.01em}
.wb-sub{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wb-foot{display:flex;align-items:center;gap:7px;margin-top:8px}
.tag{font-size:8.5px;padding:2.5px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.tag.pre{background:#EEF0E9;color:#6D7A66}
.tag.mid{background:#F1EEF4;color:#7A6F86}
.tag.post{background:#F4EFE9;color:#8A7864}
.tag.on{background:var(--ink);color:#fff}
.tag.off{opacity:.5}
.dot-sep{width:2px;height:2px;border-radius:50%;background:var(--muted-2)}

.entry{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;transition:border-color .2s}
.entry.off{opacity:.52}
.entry-top{display:flex;align-items:flex-start;gap:8px}
.entry-name{font-size:12.5px;font-weight:600;flex:1;min-width:0}
.entry-keys{font-size:9px;color:var(--muted);margin-top:4px;font-family:var(--mono);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-content{font-size:10.5px;color:var(--ink-2);line-height:1.65;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;align-items:center}

/* memory */
.mem-summary{margin:0 18px 12px;padding:15px;border-radius:20px;background:linear-gradient(150deg,#24242A,#16161A);color:#F2F1ED;position:relative;overflow:hidden}
.mem-summary:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(180,196,171,.28),transparent 70%);right:-40px;top:-50px}
.mem-summary .ms-t{font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.5);text-transform:uppercase}
.mem-summary .ms-n{font-size:22px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
.mem-summary .ms-s{font-size:9.5px;color:rgba(255,255,255,.55);margin-top:5px;line-height:1.55}
.ms-actions{display:flex;gap:7px;margin-top:12px}
.ms-btn{height:30px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font-size:10.5px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(6px)}
.ms-btn.solid{background:#F2F1ED;color:#1B1B1F;font-weight:600}
.mem-card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:9px}
.mem-card .mt{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.mem-card .mc{font-size:10.5px;line-height:1.7;color:var(--ink-2);margin-top:7px;white-space:pre-wrap}
.mem-card .mf{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:9px;color:var(--muted-2)}
.mem-card.pin{background:linear-gradient(160deg,#FFFDF7,#FBF8F0)}
.threshold{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.threshold .t-n{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;height:26px}
.stepper button{width:26px;height:100%;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.stepper span{font-size:10px;padding:0 8px;border-left:1px solid var(--line);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.trace{padding:10px;border-radius:12px;background:var(--surface-2);font-size:9.5px;color:var(--ink-2);line-height:1.6;margin-top:8px;border-left:2px solid rgba(23,23,27,.14)}
.trace .trace-t{font-size:8.5px;color:var(--muted);margin-bottom:4px;font-family:var(--mono)}

/* archive */
.char-card{display:flex;gap:12px;padding:13px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:9px;align-items:center}
.char-card .av{width:50px;height:50px;border-radius:16px}
.char-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.char-meta{font-size:9px;color:var(--muted);margin-top:4px;font-family:var(--mono);letter-spacing:.02em}
.char-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.upload-row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.up-box{width:66px;height:66px;border-radius:16px;background:var(--surface);border:1px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8.5px;color:var(--muted);overflow:hidden;background-size:cover;background-position:center;flex:none}

/* store */
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.store-item{padding:13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.store-item .si-top{display:flex;align-items:center;gap:9px}
.store-item .app-icon{width:38px;height:38px;border-radius:11px}
.store-item .si-n{font-size:11.5px;font-weight:600}
.store-item .si-d{font-size:9px;color:var(--muted);line-height:1.5;min-height:26px}
.si-btn{height:26px;border-radius:8px;background:var(--surface-2);font-size:9.5px;font-weight:600;color:var(--ink-2);display:grid;place-items:center}
.si-btn.ok{background:var(--accent-soft);color:var(--accent-ink)}

/* notices */
.note-card{padding:15px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;position:relative}
.note-card .n-ver{font-size:8.5px;letter-spacing:.12em;color:var(--accent-ink);font-family:var(--mono)}
.note-card .n-t{font-size:13px;font-weight:600;margin-top:5px}
.note-card .n-b{font-size:10.5px;color:var(--ink-2);line-height:1.75;margin-top:7px;white-space:pre-wrap}
.note-card .n-time{font-size:8.5px;color:var(--muted-2);margin-top:9px}
.tut-step{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tut-step .idx{width:20px;height:20px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:9px;color:var(--muted);flex:none;font-family:var(--mono)}
.tut-step .tt{font-size:11.5px;font-weight:600}
.tut-step .td{font-size:10px;color:var(--muted);line-height:1.6;margin-top:3px}

/* beauty */
.wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wp-cell{aspect-ratio:.62;border-radius:12px;border:1.5px solid transparent;position:relative;overflow:hidden;background-size:cover;background-position:center}
.wp-cell.on{border-color:var(--ink)}
.wp-cell.on:after{content:"";position:absolute;right:3px;bottom:3px;width:13px;height:13px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.wp-cell span{position:absolute;left:4px;top:4px;font-size:7px;color:rgba(255,255,255,.85);letter-spacing:.08em;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.editor-area{width:100%;min-height:130px;border-radius:14px;border:1px solid var(--line);background:#FBFBF9;padding:11px 12px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#3E3E45}
.editor-area:focus{outline:none;border-color:rgba(23,23,27,.22)}

/* settings */
.set-group{margin-bottom:16px}
.set-list{background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.api-card{padding:13px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;display:flex;align-items:center;gap:11px}
.api-card .a-ico{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.api-card .a-n{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.api-card .a-d{font-size:9px;color:var(--muted);margin-top:3px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.api-card.default{border-color:rgba(23,23,27,.22);box-shadow:0 0 0 2px rgba(23,23,27,.04)}
.badge-def{font-size:7.5px;background:var(--ink);color:#fff;padding:1.5px 4px;border-radius:4px;letter-spacing:.06em}

.prompt-block{display:flex;gap:9px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;align-items:center}
.prompt-block .pb-i{width:18px;height:18px;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-size:8px;color:var(--muted);font-family:var(--mono);flex:none}
.prompt-block .pb-n{font-size:10.5px;font-weight:500;flex:1;min-width:0}
.prompt-block .pb-m{font-size:8px;color:var(--muted-2);font-family:var(--mono)}
.prompt-block .pb-arrows{display:flex;flex-direction:column;gap:1px}
.prompt-block .pb-arrows button{width:16px;height:11px;display:grid;place-items:center;color:var(--muted-2);border-radius:3px}
.prompt-block .pb-arrows button:active{background:var(--surface-2)}
.prompt-block.off{opacity:.45}

/* data */
.storage-card{margin:0 18px 14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.storage-total{display:flex;align-items:baseline;gap:6px}
.storage-total .st-n{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.storage-total .st-u{font-size:11px;color:var(--muted)}
.storage-bar{height:9px;border-radius:5px;background:var(--surface-3);display:flex;overflow:hidden;margin:12px 0 6px;gap:1.5px}
.storage-bar i{height:100%;transition:width .5s var(--ease)}
.storage-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:9px}
.lg{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted)}
.lg i{width:6px;height:6px;border-radius:2px}
.store-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.store-row .sr-n{font-size:11px;font-weight:500;flex:1}
.store-row .sr-k{font-size:8.5px;color:var(--muted-2);font-family:var(--mono);margin-top:2px}
.store-row .sr-s{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.var-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-family:var(--mono);font-size:9px;color:var(--ink-2);border-top:1px solid var(--line)}
.var-row .v-k{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var-row .v-t{font-size:8px;color:var(--muted-2);background:var(--surface-2);padding:1px 4px;border-radius:4px;font-family:inherit}

/* music wave */
.music-wave{display:flex;align-items:flex-end;gap:2px;height:26px;padding:2px 1px 0;opacity:.5}
.music-wave i{flex:1;background:linear-gradient(180deg,#8E8A80,#3A3A3F);border-radius:1px;min-height:2px;transition:height .3s}
.music-wave i.on{opacity:.9}
.dlg-cap{position:absolute;top:12px;left:16px;font-size:8px;letter-spacing:.14em;color:var(--muted-2);text-transform:uppercase}
@keyframes eq{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
.music-wave i{transform-origin:bottom}
.music-wave.playing i{animation:eq .75s ease-in-out infinite alternate}

/* ============================================================
   layout fixes & responsive
   ============================================================ */
#app{height:100%}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;touch-action:manipulation}
.cell.dim{opacity:.55;transition:opacity .2s}
.cell .widget,.cell > .app{width:100%;height:100%}
.dock-slot{flex:1;display:flex;align-items:center;justify-content:center;height:100%;min-width:0}
.home{font-family:var(--home-font,inherit)}
.home .app-label{font-family:var(--home-font,inherit)}

.btn.txt,.nav-act .txt{height:32px;padding:0 8px}
button.txt{font-size:12.5px;font-weight:600;color:var(--ink)}

.backdrop{animation:fadeIn .2s var(--ease)}
.sheet{will-change:transform}

input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(23,23,27,.12)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.25)}

.f.g6::-webkit-scrollbar{display:none}
.f.g6{scrollbar-width:none}

/* moments status bar */
.screen .moments ~ *{}

/* small phones */
@media (max-width:520px), (max-height:720px){
  .device{width:100vw;height:100vh;height:100dvh;padding:0;border-radius:0;box-shadow:none}
  .device:before,.device:after{display:none}
  .screen{border-radius:0}
  .brand,.stage-side,.stage-hint{display:none}
  .stage:after{display:none}
  .island{top:7px;width:100px;height:27px}
  .statusbar{padding:0 22px 0 26px}
}
@media (max-width:360px){
  .app-icon{width:52px;height:52px;border-radius:15px}
  .dock .app-icon{width:48px;height:48px}
  .page-grid{grid-auto-rows:86px;gap:10px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

</style>
</head>

/* ============================================================
   Storage layer — IndexedDB only, single gateway
   Everything the phone owns lives here. No scattered localStorage
   except a tiny "last account" pointer.
   ============================================================ */
window.DB = (function () {
  const NAME = 'LIWU_DB';
  const VER = 1;
  const STORES = {
    accounts: 'id',
    characters: 'id',
    chats: 'id',
    messages: 'id',
    worldbooks: 'id',
    memories: 'id',
    settings: 'key',
    files: 'key',
    meta: 'key'
  };
  const LABEL = {
    accounts: '账号', characters: '角色档案', chats: '会话', messages: '聊天记录',
    worldbooks: '世界书', memories: '记忆', settings: '设置', files: '图片文件', meta: '元信息'
  };
  let db = null;
  const urlCache = new Map();

  function open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('NO_IDB'));
      let req;
      try { req = indexedDB.open(NAME, VER); } catch (e) { return reject(e); }
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        Object.keys(STORES).forEach((s) => {
          if (!d.objectStoreNames.contains(s)) {
            const os = d.createObjectStore(s, { keyPath: STORES[s] });
            if (s === 'messages') os.createIndex('chatId', 'chatId', { unique: false });
            if (s === 'chats') os.createIndex('accountId', 'accountId', { unique: false });
            if (s === 'characters') os.createIndex('accountId', 'accountId', { unique: false });
            if (s === 'memories') os.createIndex('accountId', 'accountId', { unique: false });
            if (s === 'worldbooks') os.createIndex('accountId', 'accountId', { unique: false });
          }
        });
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error || new Error('IDB_OPEN_FAILED'));
      req.onblocked = () => reject(new Error('IDB_BLOCKED'));
    });
  }

  function tx(store, mode) {
    if (!db) throw new Error('DB_CLOSED');
    return db.transaction(store, mode || 'readonly').objectStore(store);
  }
  function wrap(req) {
    return new Promise((res, rej) => {
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  const put = (s, v) => { v.updatedAt = Date.now(); return wrap(tx(s, 'readwrite').put(v)); };
  const get = (s, k) => wrap(tx(s).get(k));
  const del = (s, k) => wrap(tx(s, 'readwrite').delete(k));
  const all = (s) => wrap(tx(s).getAll());
  const clear = (s) => wrap(tx(s, 'readwrite').clear());

  /* ---- files: blobs keyed, explicit cleanup ---- */
  async function putFile(blob, meta) {
    const key = 'f_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    await put('files', {
      key, blob, type: blob.type || 'image/jpeg', size: blob.size,
      name: (meta && meta.name) || 'image', created: Date.now()
    });
    return key;
  }
  async function fileURL(key) {
    if (!key) return '';
    if (urlCache.has(key)) return urlCache.get(key);
    const rec = await get('files', key);
    if (!rec || !rec.blob) return '';
    const u = URL.createObjectURL(rec.blob);
    urlCache.set(key, u);
    return u;
  }
  async function delFile(key) {
    if (!key) return;
    if (urlCache.has(key)) { URL.revokeObjectURL(urlCache.get(key)); urlCache.delete(key); }
    await del('files', key);
  }
  /* replace an image field, old file is destroyed after the new one lands */
  async function replaceFile(oldKey, blob, meta) {
    const key = await putFile(blob, meta);
    if (oldKey && oldKey !== key) await delFile(oldKey);
    return key;
  }

  function bytesOf(v) {
    if (!v) return 0;
    if (v.blob instanceof Blob) return v.blob.size + 90;
    try { return new Blob([JSON.stringify(v)]).size; } catch (e) { return 0; }
  }

  async function sizes() {
    const out = [];
    for (const s of Object.keys(STORES)) {
      const rows = await all(s);
      let bytes = 0;
      rows.forEach((r) => { bytes += bytesOf(r); });
      out.push({ store: s, label: LABEL[s], count: rows.length, bytes });
    }
    return out;
  }

  async function wipeStore(s) {
    if (s === 'files') {
      urlCache.forEach((u) => URL.revokeObjectURL(u));
      urlCache.clear();
    }
    await clear(s);
  }

  async function wipeAll() {
    for (const s of Object.keys(STORES)) await wipeStore(s);
  }

  return { open, put, get, del, all, clear, putFile, fileURL, delFile, replaceFile, sizes, wipeStore, wipeAll, STORES, LABEL, bytesOf };
})();

window.U = {
  uid(prefix) {
    return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  },
  bytes(n) {
    if (!n) return '0 B';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  },
  pad(n) { return n < 10 ? '0' + n : '' + n; },
  hhmm(ts) {
    const d = new Date(ts);
    return U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
  },
  dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); },
  dayLabel(ts) {
    const d = new Date(ts), now = new Date();
    const k = U.dayKey(ts);
    if (k === U.dayKey(now.getTime())) return '今天';
    const y = new Date(now.getTime() - 864e5);
    if (k === U.dayKey(y.getTime())) return '昨天';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  },
  rel(ts) {
    const diff = Date.now() - ts;
    if (diff < 60e3) return '刚刚';
    if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
    if (U.dayKey(ts) === U.dayKey(Date.now())) return U.hhmm(ts);
    if (diff < 7 * 864e5) return Math.floor(diff / 864e5) + ' 天前';
    const d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate();
  },
  fullTime(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate()) + ' ' + U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
  },
  esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  stripTags(s) {
    return String(s || '')
      .replace(/<think>[\s\S]*?<\/think>/gi, '')
      .replace(/<narratage>([\s\S]*?)<\/narratage>/gi, '$1')
      .replace(/<[^>]+>/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  },
  clip(s, n) {
    s = String(s || '');
    return s.length > n ? s.slice(0, n) + '…' : s;
  },
  initial(name) { return String(name || '?').trim().slice(0, 1).toUpperCase(); },
  hash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  },
  async fileToBlob(file, max) {
    max = max || 1600;
    if (!file.type.startsWith('image/')) return file;
    try {
      const bmp = await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      const ctx = c.getContext('2d');
      ctx.drawImage(bmp, 0, 0, c.width, c.height);
      URL.revokeObjectURL(bmp.src);
      const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.86));
      return blob || file;
    } catch (e) { return file; }
  }
};

  async appendMessage(chatId, role, raw, meta) {

      id: U.uid('m'), accountId: state.account.id, chatId, role, raw, seq, ts: Date.now()
    }, meta || {});
    await DB.put('messages', JSON.parse(JSON.stringify(msg)));
    const arr = state.msgs[chatId] || (state.msgs[chatId] = []);
    arr.push(msg);
    if (chat) {
      chat.seq = seq;
      chat.updatedAt = msg.ts;
      chat.lastText = role === 'user' ? raw : U.stripTags(raw);
      if (role === 'char') chat.unread = (chat.unread || 0) + 1;
      await DB.put('chats', JSON.parse(JSON.stringify(chat)));

    // threshold check
    if (role === 'char' && chat) A.maybeSummarize(chat);

  async deleteMessage(chatId, msgId) {

    state.msgs[chatId] = (state.msgs[chatId] || []).filter((m) => m.id !== msgId);
    const chat = A.chatById(chatId);
    if (chat) {
      const arr = state.msgs[chatId] || [];
      chat.lastText = arr.length ? (arr[arr.length - 1].role === 'user' ? arr[arr.length - 1].raw : U.stripTags(arr[arr.length - 1].raw)) : '';
      chat.updatedAt = arr.length ? arr[arr.length - 1].ts : chat.updatedAt;
      await DB.put('chats', JSON.parse(JSON.stringify(chat)));

  async updateMessage(chatId, msgId, raw) {

    m.raw = raw; m.edited = true;
