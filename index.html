<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1'>
<meta name='theme-color' content='#EFEBE2'>
<meta name='description' content='里屋。屋子不大，够两个人住。'>
<title>里屋</title>
<link rel='icon' href='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23EFEBE2%27/%3E%3Crect x=%2715.2%27 y=%277%27 width=%271.4%27 height=%2718%27 fill=%27%238A3B2C%27/%3E%3C/svg%3E'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link rel='preconnect' href='https://unpkg.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@300;400;500&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='assets/style.css'>
</head>
<body>

<canvas id='stage'></canvas>

<div class='hud'>
  <span class='brand'>里屋</span>
  <span class='meta' id='hudDays'></span>
</div>

<div class='boot' id='boot'>正在开门……</div>

<div class='dock' id='dock'></div>

<div class='panel' id='panel' hidden>
  <div class='panel-in'>
    <div class='panel-head'>
      <div>
        <h2 id='pTitle'></h2>
        <span class='en' id='pEn'></span>
      </div>
      <button class='mini' id='pClose' type='button'>关</button>
    </div>
    <div class='panel-body' id='pBody'></div>
  </div>
</div>

<div class='sheet' id='sheet' hidden>
  <div class='sheet-in'>
    <div class='sheet-head'>
      <h3>接线的地方</h3>
      <button class='mini' id='sheetClose' type='button'>关</button>
    </div>

    <div class='presets'>
      <button class='chip' data-preset='deepseek' type='button'>DeepSeek</button>
      <button class='chip' data-preset='openai' type='button'>OpenAI</button>
      <button class='chip' data-preset='go' type='button'>OpenCode Go</button>
    </div>

    <label class='field'>
      <span>接口地址</span>
      <input id='cfgBase' placeholder='https://api.deepseek.com/v1' autocomplete='off' spellcheck='false'>
    </label>
    <label class='field'>
      <span>Key</span>
      <input id='cfgKey' type='password' placeholder='sk-…' autocomplete='off'>
    </label>
    <label class='field'>
      <span>模型</span>
      <input id='cfgModel' placeholder='deepseek-chat' autocomplete='off' spellcheck='false'>
    </label>
    <label class='field'>
      <span>它怎么说话</span>
      <textarea id='cfgSys' rows='5'></textarea>
    </label>

    <div class='row'>
      <button class='ghost solid' id='cfgSave' type='button'>存好</button>
      <button class='ghost' id='cfgTest' type='button'>试一下</button>
      <button class='ghost' id='cfgClear' type='button'>清空对话</button>
    </div>

    <p class='tip' id='cfgTip'></p>
    <p class='tip'>Key 只存在这台手机的浏览器里，不进仓库，也不会上传。</p>
  </div>
</div>

<script>
(function(){
  var slow = setTimeout(function(){
    var b = document.getElementById('boot');
    if (b && !b.hidden) b.textContent = '网有点慢，3D 还在下载。下面那排先用着。';
  }, 7000);

  window.addEventListener('error', function(e){
    var b = document.getElementById('boot');
    if (b && !b.hidden){
      clearTimeout(slow);
      b.textContent = '屋子里出了点问题：' + (e.message || '未知错误') + ' —— 告诉我就行。';
    }
  });
})();
</script>

<script src='data.js'></script>
<script src='assets/panel.js'></script>
<script type='module' src='assets/room3d.js'></script>
</body>
</html>
