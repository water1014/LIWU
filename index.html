<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1'>
<meta name='theme-color' content='#BFB29C'>
<meta name='description' content='里屋。屋子不大，够两个人住。'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<title>里屋</title>
<link rel='icon' href='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23F7F3EA%27/%3E%3Crect x=%2715.4%27 y=%278%27 width=%271.2%27 height=%2716%27 fill=%27%238A3B2C%27/%3E%3C/svg%3E'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='assets/style.css?v=34'>
<style>
:root{
  --paper:#F7F3EA; --ink:#2B2823; --soft:#5A5348; --mute:#928B7E; --line:#DFD8C8; --red:#8A3B2C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#9C8F79; color:var(--ink); overflow:hidden;
  font-family:'Noto Serif SC',serif; font-weight:300; -webkit-font-smoothing:antialiased;
}
body:not(.desk) .stage{display:none}
body.desk #app,body.desk .view,body.desk .drawer{display:none}

/* ============ 桌面 ============ */
.stage{
  position:fixed; inset:0; overflow:hidden; touch-action:none;
  perspective:1000px; perspective-origin:50% 36%;
  background:radial-gradient(120% 90% at 34% -10%, #C4B7A0 0%, #A8997F 58%, #8A7C66 100%);
}
.desk{
  position:absolute; inset:3% 4% 3.5% 4%;
  transform-style:preserve-3d;
  transform:rotateX(8deg) rotateZ(-.5deg);
  transition:transform .65s cubic-bezier(.22,.61,.36,1);
}

/* 杂志那一面：一张纸，不是草稿本 */
.paper{
  position:absolute; inset:0;
  background:linear-gradient(168deg, #FCFAF4 0%, #F6F1E6 46%, #EDE6D6 100%);
  box-shadow:0 22px 50px rgba(38,28,16,.42), 0 3px 10px rgba(38,28,16,.2);
}
.paper::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(146,132,108,.028) 0 1px, transparent 1px 5px);
}
.paper::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.3), transparent 16%);
}

/* ============ 版面 ============ */
.mag{position:absolute; inset:0; padding:26px 24px 22px; display:flex; flex-direction:column}

.mag-top{display:flex; align-items:flex-start; justify-content:space-between}
.t-time{font-family:'Cormorant Garamond',serif; font-size:29px; font-weight:400; letter-spacing:.03em; line-height:1}
.t-date{font-size:9.5px; letter-spacing:.16em; color:var(--mute); margin-top:6px}
.t-vol{text-align:right; font-family:'Cormorant Garamond',serif; font-size:9.5px; letter-spacing:.2em; color:var(--mute); line-height:1.7}

.masthead{margin-top:34px; text-align:center}
.masthead h1{margin:0; font-size:40px; font-weight:400; letter-spacing:.2em; text-indent:.2em; line-height:1}
.masthead .en{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:8.5px; letter-spacing:.24em; color:var(--mute); margin-top:10px}
.masthead .rule{width:34px; height:1px; background:var(--red); opacity:.5; margin:14px auto 0}

.lede{margin-top:30px; text-align:center}
.lede .big{font-size:18px; letter-spacing:.2em; line-height:2.15; color:var(--ink)}
.lede .big span{display:block}
.lede .sub{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:8.5px; letter-spacing:.05em; color:var(--mute); margin-top:8px}

/* 中间留给东西，什么都不写 */
.spacer{flex:1; min-height:120px}

.bottom{display:flex; align-items:flex-end; justify-content:space-between; gap:16px}
.b-left{flex:1; min-width:0}
.b-label{font-size:8px; letter-spacing:.24em; color:var(--mute); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:9px}
.b-left .row{font-size:9.5px; line-height:1.7; color:var(--soft); margin-bottom:6px; padding-left:11px; position:relative}
.b-left .row::before{content:''; position:absolute; left:0; top:6.5px; width:4px; height:4px; border:1px solid var(--mute); border-radius:50%}
.b-right{text-align:right}
.b-right .wx{font-family:'Cormorant Garamond',serif; font-size:31px; line-height:1; font-weight:400}
.b-right .wx .deg{font-size:16px; vertical-align:super}
.b-right .wx-s{font-size:8.5px; letter-spacing:.14em; color:var(--mute); margin-top:7px}
.b-right .dy{font-size:9.5px; letter-spacing:.1em; color:var(--soft); margin-top:14px}
.b-right .dy b{font-size:14px; font-weight:400; margin:0 3px}

.mag-foot{margin-top:20px; border-top:1px solid var(--line); padding-top:8px; display:flex; align-items:center; justify-content:space-between}
.mag-foot .l{font-size:8px; letter-spacing:.2em; color:var(--mute)}
.mag-foot .r{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:9px; color:var(--mute)}

/* ============ 桌上的东西 ============ */
.item{
  position:absolute; transform-style:preserve-3d;
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  will-change:transform;
  transition:box-shadow .3s ease, filter .3s ease;
}
.item.grabbing{cursor:grabbing; filter:brightness(1.04)}

/* 拍立得 */
.polaroid{ width:23%; padding:2.6% 2.6% 0; background:#FFFEF9; border-radius:1px }
.polaroid .ph{ width:100%; padding-top:110%; position:relative; overflow:hidden;
  background:linear-gradient(150deg,#EFE8D9,#E2D9C6) }
.polaroid .ph img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.polaroid .ph .empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  text-align:center; font-size:7.5px; line-height:1.8; color:#AFA492; padding:5px }
.polaroid .cap{ padding:5px 0 6px; font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:8.5px; color:#6E6657; text-align:center }
.tape{
  position:absolute; left:50%; top:-6px; width:40%; height:12px; margin-left:-20%;
  background:rgba(232,196,196,.72); transform:rotate(-2deg);
  box-shadow:0 1px 3px rgba(120,90,80,.16);
}

/* 便签 */
.note{
  width:21%; padding:9px 8px 12px;
  background:#F7E7A2;
  font-size:8.5px; line-height:1.85; color:#5E5331;
}
.note .h{ font-size:8.5px; letter-spacing:.1em; color:#6D5F35; margin-bottom:6px }
.note .ln{ height:1px; background:rgba(110,95,50,.2); margin:0 0 7px }

/* 唱片 + 纸套 */
.vinylset{ width:30%; }
.vinylset .disc{
  position:absolute; left:36%; top:2%; width:62%; padding-top:62%; border-radius:50%;
  background:radial-gradient(circle at 46% 44%, #2B2B2B 0 14%, #161616 15% 58%, #0E0E0E 100%);
  z-index:1;
}
.vinylset .disc .lb{
  position:absolute; left:50%; top:50%; width:30%; height:30%; margin:-15% 0 0 -15%; border-radius:50%;
  background:#8A3B2C; display:flex; align-items:center; justify-content:center;
  text-align:center; font-size:5.5px; line-height:1.35; letter-spacing:.06em; color:#F8F0E5;
}
.vinylset .disc .ho{
  position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px;
  border-radius:50%; background:#0A0908;
}
.vinylset .disc .gr{ position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.05) }
.vinylset .disc .g1{ inset:22% } .vinylset .disc .g2{ inset:32% }
.vinylset .bag{
  position:absolute; left:0; top:0; width:64%; height:100%;
  background:linear-gradient(160deg,#FFFEF8,#F4EEE0); z-index:2;
}
.vinylset .bag .mark{
  position:absolute; left:10%; bottom:9%; font-family:'Cormorant Garamond',serif;
  font-style:italic; font-size:7.5px; letter-spacing:.18em; color:#9A9284;
}
.vinylset .bag .bar{ position:absolute; left:10%; top:12%; width:24%; height:1px; background:var(--red); opacity:.45 }

/* 工牌 */
.badge{ width:14%; padding:5px 5px 7px; background:#FFFEF9; border-radius:2px }
.badge .cord{ position:absolute; left:50%; bottom:100%; width:1.5px; height:24px; margin-left:-.75px; background:#7C8C66 }
.badge .clip{ position:absolute; left:50%; top:-4px; width:8px; height:6px; margin-left:-4px; border-radius:1.5px; background:#C2BCAF }
.badge .pic{ width:100%; padding-top:112%; background:#EFE7D6; border-radius:1px; position:relative }
.badge .pic .f{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'Cormorant Garamond',serif; font-size:15px; color:#C3B8A2 }
.badge .nm{ margin-top:5px; font-size:7px; letter-spacing:.06em; color:var(--soft) }
.badge .en{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:6.5px; color:var(--mute); margin-top:1px }

/* 小卡叠 */
.cards{ width:17%; padding-top:23% }
.cards .c{ position:absolute; inset:0; background:#FFFEF9; border-radius:2px }
.cards .c1{ transform:rotate(-7deg) translate(-2px,2px) }
.cards .c2{ transform:rotate(2deg) translate(2px,-2px) }
.cards .c3{ transform:rotate(-1.5deg); display:flex; flex-direction:column; justify-content:center; padding:7px }
.cards .c3 .k{ font-size:7px; letter-spacing:.14em; color:var(--mute) }
.cards .c3 .v{ font-family:'Cormorant Garamond',serif; font-size:19px; line-height:1; margin-top:2px }

/* 光盘 */
.cd{ width:11%; padding-top:11%; border-radius:50%;
  background:conic-gradient(from 24deg,#8FB0C6,#CBD8E1,#7C9DB4,#B4C9D6,#8FB0C6) }
.cd .h{ position:absolute; left:50%; top:50%; width:26%; height:26%; margin:-13% 0 0 -13%;
  border-radius:50%; background:#F7F3EA }

.hint-tap{ position:fixed; left:0; right:0; bottom:6px; text-align:center;
  font-size:8px; letter-spacing:.22em; color:rgba(247,243,234,.42); z-index:400; pointer-events:none }

.back-gate{
  position:fixed; left:10px; bottom:16px; z-index:500;
  padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.18);
  background:rgba(26,22,18,.66); color:#F1EBDD; font-family:inherit; font-size:11px;
  transition:transform .28s;
}
.back-gate:active{ transform:scale(.93) }
body.desk .back-gate{ display:none }
</style>
</head>

    <div class='paper'></div>

        <div>
          <div class='t-time' id='magTime'>--:--</div>

<script>
(function(){
  var D = window.LIWU || {};
  var p2 = function(n){ return n < 10 ? '0' + n : '' + n; };
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

  function paintClock(){
    var d = new Date();
    var t = document.getElementById('magTime'), dt = document.getElementById('magDate');
    if (t) t.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
    if (dt) dt.textContent = (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + WEEK[d.getDay()];
  }
  paintClock(); setInterval(paintClock, 20000);

  function days(){
    var s = D.since || localStorage.getItem('liwu.since') || '';
    if (!s) return '';
    var t = Date.parse(String(s).replace(/\./g, '-'));
    if (isNaN(t)) return '';
    var n = Math.floor((Date.now() - t) / 86400000);
    return n >= 0 ? String(n) : '';
  }
  var md = document.getElementById('magDays');
  if (md) md.textContent = days() || '—';
  if (D.weather){
    var w = document.getElementById('magWx'), ws = document.getElementById('magWxS');
    if (w && D.weather.temp) w.innerHTML = String(D.weather.temp).replace('°','') + '<span class="deg">°</span>';
    if (ws && D.weather.text) ws.textContent = D.weather.text;
  }
  var mm = document.getElementById('magMem');
  if (mm && D.memory) mm.textContent = D.memory.length;
  if (D.album && D.album[0] && D.album[0].src){
    var ph = document.getElementById('polPh');
    if (ph) ph.innerHTML = '<img src="' + D.album[0].src + '" alt="">';
  }

  /* ---------- 拖动 ---------- */
  var items = document.querySelectorAll('.item');
  var store = {};
  try{ store = JSON.parse(localStorage.getItem('liwu.desk6') || '{}') || {}; }catch(e){}

  function shadowFor(z){
    var k = Math.max(0, Math.min(1, z / 56));
    var sx = 2 + 3 * k, sy = 3 + 5 * k, sb = 8 + 18 * k, sa = 0.24 + 0.14 * k;
    return sx.toFixed(1)+'px '+sy.toFixed(1)+'px 0 rgba(124,104,74,.16), '+
           sx.toFixed(1)+'px '+sy.toFixed(1)+'px 1px rgba(124,104,74,.08), '+
           (sx+2).toFixed(1)+'px '+(sy+4).toFixed(1)+'px '+sb.toFixed(0)+'px rgba(44,32,18,'+sa.toFixed(2)+')';
  }

  function place(el, lift){
    el.style.left = el._x + '%';
    el.style.top = el._y + '%';
    var z = el._z + (lift || 0);
    var sc = 1 + (lift ? 0.04 : 0);
    el.style.transform = 'translateZ(' + z + 'px) rotate(' + el._r + 'deg) scale(' + sc + ') translate3d(0,0,0)';
    el.style.zIndex = Math.round(z) + '';
    el.style.boxShadow = shadowFor(z);
  }

  for (var i = 0; i < items.length; i++){
    (function(el){
      var key = el.getAttribute('data-go') || el.className.replace('item ', '');
      var sv = store[key];
      el._x = sv ? sv.x : parseFloat(el.getAttribute('data-x'));
      el._y = sv ? sv.y : parseFloat(el.getAttribute('data-y'));
      el._r = sv ? sv.r : parseFloat(el.getAttribute('data-r') || '0');
      el._z = parseFloat(el.getAttribute('data-z') || '0');
      place(el, 0);

      var sx = 0, sy = 0, ox = 0, oy = 0, moved = false, down = false;

      el.addEventListener('pointerdown', function(ev){
        down = true; moved = false;
        sx = ev.clientX; sy = ev.clientY; ox = el._x; oy = el._y;
        el.classList.add('grabbing');
        el.style.transition = 'none';
        place(el, 26);
        try{ el.setPointerCapture(ev.pointerId); }catch(e){}
      });

      el.addEventListener('pointermove', function(ev){
        if (!down) return;
        var dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        var dw = document.getElementById('desk').offsetWidth || 1;
        var dh = document.getElementById('desk').offsetHeight || 1;
        el._x = Math.max(-4, Math.min(94, ox + (dx / dw) * 100));
        el._y = Math.max(-3, Math.min(92, oy + (dy / dh) * 100));
        el.style.left = el._x + '%';
        el.style.top = el._y + '%';
      });

      function up(){
        if (!down) return;
        down = false;
        el.classList.remove('grabbing');
        el.style.transition = 'box-shadow .25s ease, transform .25s cubic-bezier(.22,.61,.36,1)';
        place(el, 0);
        store[key] = { x: el._x, y: el._y, r: el._r };
        try{ localStorage.setItem('liwu.desk6', JSON.stringify(store)); }catch(e){}
      }

      el.addEventListener('pointerup', function(){
        var wasMoved = moved;
        up();
        if (wasMoved) return;
        var go = el.getAttribute('data-go');
        if (go) open(go);
      });
      el.addEventListener('pointercancel', up);
    })(items[i]);
  }

  /* ---------- 桌面倾角 ---------- */
  var desk = document.getElementById('desk');
  var stage = document.getElementById('stage');
  var REST = 'rotateX(8deg) rotateZ(-.5deg)';
  function tilt(cx, cy){
    var w = window.innerWidth, h = window.innerHeight;
    var rx = 8 + ((cy / h) - 0.5) * -4;
    var rz = -0.5 + ((cx / w) - 0.5) * 1.2;
    desk.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateZ(' + rz.toFixed(2) + 'deg)';
  }
  stage.addEventListener('pointermove', function(ev){
    if (document.body.classList.contains('desk')) tilt(ev.clientX, ev.clientY);
  });
  stage.addEventListener('pointerleave', function(){ desk.style.transform = REST; });

  /* ---------- 开门 ---------- */
  function open(key){
    document.body.classList.remove('desk');
    if (key === 'chat'){
      var inp = document.getElementById('input');
      if (inp) setTimeout(function(){ inp.focus(); }, 200);
      return;
    }
    var b = document.querySelector('.drawer-nav [data-view="' + key + '"]');
    if (b) setTimeout(function(){ b.click(); }, 40);
  }

  function toDesk(){
    document.body.classList.add('desk');
    var v = document.getElementById('view');
    if (v) v.hidden = true;
    desk.style.transform = REST;
  }
  document.getElementById('backGate').addEventListener('click', toDesk);
  var homeNav = document.querySelector('.drawer-nav [data-view="home"]');
  if (homeNav) homeNav.addEventListener('click', function(){ setTimeout(toDesk, 20); });

})();
</script>
</body>
</html>
