<head>

<style>
:root{
  --paper:#F8F4EB; --ink:#2B2823; --soft:#5A5348; --mute:#9A9285; --line:#E2DBCB; --red:#8A3B2C;
  --sh:92,74,52;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#0a0908; color:var(--ink); overflow:hidden;
  font-family:'Noto Serif SC',serif; font-weight:300; -webkit-font-smoothing:antialiased;
}
body:not(.desk) .stage{display:none}
body.desk #app,body.desk .view,body.desk .drawer{display:none}

/* ================= 雨夜书房 ================= */
.stage{
  position:fixed; inset:0; overflow:hidden; touch-action:none;
  background:#0a0908;
}
.desk{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  perspective:1200px;
}

/* ---- 墙面 ---- */
.wall{
  position:absolute; inset:0;
  background:linear-gradient(180deg,#120f0c 0%,#1a1612 45%,#221d18 100%);
}
/* 墙面微妙纹理 */
.wall::after{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.35;
  background-image:repeating-linear-gradient(90deg,transparent 0 120px,rgba(0,0,0,.08) 120px 121px);
}

/* ---- 窗户 ---- */
.window-frame{
  position:absolute; left:3%; top:4%; width:40%; height:58%;
  border:10px solid #14100c;
  border-radius:0 0 36px 36px;
  background:linear-gradient(180deg,#1a2630 0%,#243440 35%,#1c2a35 70%,#162029 100%);
  box-shadow:
    inset 0 0 50px rgba(0,0,0,.55),
    0 8px 28px rgba(0,0,0,.45);
  overflow:hidden;
}
/* 窗外远处光 */
.window-frame::before{
  content:''; position:absolute; left:-20%; top:-10%; width:140%; height:70%;
  background:radial-gradient(ellipse at 60% 30%,rgba(180,195,210,.08),transparent 55%);
}
/* 窗格 */
.pane-h{
  position:absolute; left:0; right:0; top:33%; height:2px;
  background:rgba(10,8,6,.55);
  box-shadow:0 1px 0 rgba(255,255,255,.04);
}
.pane-h2{ top:66%; }
.pane-v{
  position:absolute; top:0; bottom:0; left:50%; width:2px;
  background:rgba(10,8,6,.55);
  box-shadow:1px 0 0 rgba(255,255,255,.04);
}
/* 窗台 */
.sill{
  position:absolute; left:2%; top:62%; width:42%; height:3.5%;
  background:linear-gradient(180deg,#2a1f16,#1f1710);
  border-radius:0 0 4px 4px;
  box-shadow:0 6px 14px rgba(0,0,0,.5);
}
/* 窗台上的小盆栽 */
.plant-pot{
  position:absolute; left:8%; top:59%; width:3.2%; aspect-ratio:1/1.1;
  background:linear-gradient(180deg,#c4a882,#8f7355);
  border-radius:30% 30% 40% 40%;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
  z-index:5;
}
.plant-pot::after{
  content:''; position:absolute; left:15%; top:-40%; width:70%; height:60%;
  background:radial-gradient(circle at 40% 80%,#4a6b3a 0%,#2d4224 60%,transparent 61%);
  border-radius:50% 50% 40% 40%;
}

/* ---- 雨滴 canvas ---- */
#rainCanvas{
  position:absolute; left:3%; top:4%; width:40%; height:58%;
  pointer-events:none; z-index:3;
}

/* ---- 桌面 ---- */
.desk-surface{
  position:absolute; left:-5%; top:64%; width:110%; height:40%;
  background:linear-gradient(180deg,#3d2e22 0%,#2a1f16 60%,#1f1710 100%);
  transform-origin:top center;
  transform:perspective(900px) rotateX(6deg);
  box-shadow:0 -12px 40px rgba(0,0,0,.55), inset 0 6px 12px rgba(0,0,0,.25);
}
/* 桌面木纹 */
.desk-surface::before{
  content:''; position:absolute; inset:0; opacity:.18; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.06) 3px 4px);
}

/* ---- 台灯 ---- */
.lamp{
  position:absolute; right:10%; top:18%; width:90px; height:160px; z-index:8;
  transform-origin:bottom center;
}
.lamp-shade{
  position:absolute; left:5px; top:0; width:80px; height:50px;
  background:linear-gradient(180deg,#f5e6c8 0%,#e8d5a8 60%,#d4c194 100%);
  border-radius:50% 50% 8% 8%;
  box-shadow:
    0 0 100px 40px rgba(245,230,200,.18),
    0 0 160px 80px rgba(245,230,200,.08),
    inset 0 -4px 8px rgba(0,0,0,.08);
  animation:lampBreath 5s ease-in-out infinite;
}
.lamp-shade::after{
  content:''; position:absolute; left:10%; top:15%; width:80%; height:60%;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);
  border-radius:50% 50% 0 0;
}
.lamp-stem{
  position:absolute; left:50%; top:48px; width:5px; height:70px; margin-left:-2.5px;
  background:linear-gradient(90deg,#5c4a3a,#8a7560,#5c4a3a);
  border-radius:3px;
}
.lamp-base{
  position:absolute; left:50%; bottom:0; width:50px; height:18px; margin-left:-25px;
  background:linear-gradient(180deg,#6b5440,#3d2e22);
  border-radius:4px;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}
/* 台灯光锥 */
.light-cone{
  position:absolute; right:0; top:30%; width:55%; height:55%;
  background:radial-gradient(ellipse at 70% 20%,rgba(245,230,200,.10),transparent 60%);
  pointer-events:none; z-index:4;
  animation:coneBreath 5s ease-in-out infinite;
}
@keyframes lampBreath{
  0%,100%{ filter:brightness(1); box-shadow:0 0 100px 40px rgba(245,230,200,.18),0 0 160px 80px rgba(245,230,200,.08),inset 0 -4px 8px rgba(0,0,0,.08);}
  50%{ filter:brightness(1.06); box-shadow:0 0 110px 48px rgba(245,230,200,.22),0 0 180px 90px rgba(245,230,200,.10),inset 0 -4px 8px rgba(0,0,0,.08);}
}
@keyframes coneBreath{
  0%,100%{ opacity:.85; }
  50%{ opacity:1; }
}

/* ---- 通用物件 ---- */
.item{
  position:absolute; transform-style:preserve-3d;
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  will-change:transform;
  transition:box-shadow .3s ease, filter .3s ease, transform .25s cubic-bezier(.22,.61,.36,1);
}
.item.grabbing{ cursor:grabbing; filter:brightness(1.06) }
.item .tagline{
  position:absolute; left:50%; top:-18px; transform:translateX(-50%); white-space:nowrap;
  font-size:7.5px; letter-spacing:.22em; color:rgba(245,240,230,.55);
  text-shadow:0 1px 6px rgba(0,0,0,.6);
  pointer-events:none;
}

/* ---- 日记本 diary ---- */
.obj-diary{
  width:19%; aspect-ratio:5/3.6;
  background:linear-gradient(135deg,#5c3d2e,#3d2618);
  border-radius:3px 6px 6px 3px;
  box-shadow:0 10px 28px -6px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.3);
  display:flex; align-items:center; justify-content:center;
}
.obj-diary::before{
  content:''; position:absolute; left:48%; top:6%; bottom:6%; width:2px;
  background:rgba(0,0,0,.25); border-radius:1px;
}
.diary-page-l,.diary-page-r{
  position:absolute; top:8%; bottom:8%; width:42%;
  background:#f5f0e6;
  border-radius:1px;
}
.diary-page-l{ left:5%; background:linear-gradient(90deg,#e8e2d6,#f5f0e6); }
.diary-page-r{ right:5%; }
.diary-lines{
  position:absolute; left:8%; right:8%; top:14%; bottom:10%;
  background:repeating-linear-gradient(0deg,transparent 0 10px,rgba(0,0,0,.06) 10px 11px);
}
.diary-scribble{
  position:absolute; left:12%; top:22%; right:12%;
  height:2px; background:rgba(0,0,0,.12); border-radius:1px;
}
.diary-scribble.s2{ top:38%; width:70%; }
.diary-scribble.s3{ top:54%; width:55%; }

/* ---- 唱片机 chat ---- */
.obj-player{
  width:20%; aspect-ratio:1/1;
  background:linear-gradient(145deg,#2a1f16,#1f1710);
  border-radius:10px;
  box-shadow:0 12px 32px -8px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);
  display:flex; align-items:center; justify-content:center;
}
.player-platter{
  width:68%; aspect-ratio:1/1; border-radius:50%;
  background:linear-gradient(145deg,#1a1a1a,#0d0d0d);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 2px 4px rgba(255,255,255,.03);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.vinyl{
  width:78%; aspect-ratio:1/1; border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,#1a1a1a 0 8%,#222 9% 12%,#1a1a1a 13% 18%,#222 19% 22%,#1a1a1a 23% 28%,#222 29% 32%,#1a1a1a 33% 38%,#222 39% 42%,#1a1a1a 43% 48%,#0f0f0f 49% 100%);
  animation:vinylSpin 4s linear infinite;
  position:relative;
}
.vinyl::after{
  content:''; position:absolute; left:50%; top:50%; width:18%; height:18%; margin:-9% 0 0 -9%;
  background:#8A3B2C; border-radius:50%;
}
.player-arm{
  position:absolute; right:10%; top:10%; width:4px; height:42%;
  background:linear-gradient(90deg,#8a7560,#a08e78);
  border-radius:2px; transform-origin:top center; transform:rotate(28deg);
}
.player-arm::after{
  content:''; position:absolute; left:-3px; bottom:-4px; width:10px; height:10px;
  background:#666; border-radius:50%;
}
@keyframes vinylSpin{ to{ transform:rotate(360deg);} }

/* ---- 相框 album ---- */
.obj-frame{
  width:14%; aspect-ratio:3/4;
  background:linear-gradient(145deg,#c9a84c,#a08438);
  padding:2.5%;
  border-radius:2px;
  box-shadow:0 10px 28px -6px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.3);
  display:flex; align-items:center; justify-content:center;
}
.frame-inner{
  width:100%; height:100%;
  background:#2a2520;
  border-radius:1px;
  overflow:hidden;
  position:relative;
}
.frame-inner img{
  width:100%; height:100%; object-fit:cover; display:block;
}
.frame-stand{
  position:absolute; left:50%; bottom:-6px; width:20%; height:6px; margin-left:-10%;
  background:#6b5440; border-radius:0 0 2px 2px;
}

/* ---- 玻璃瓶 memory ---- */
.obj-bottle{
  width:9%; aspect-ratio:1/1.7;
  background:rgba(200,220,230,.12);
  border:1px solid rgba(255,255,255,.1);
  border-radius:45% 45% 50% 50%;
  box-shadow:
    inset 0 0 20px rgba(255,255,255,.06),
    0 8px 20px -4px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.bottle-neck{
  position:absolute; left:35%; top:-14%; width:30%; height:16%;
  background:rgba(200,220,230,.15);
  border:1px solid rgba(255,255,255,.12);
  border-radius:3px 3px 0 0;
  border-bottom:0;
}
.bottle-cork{
  position:absolute; left:38%; top:-18%; width:24%; height:6%;
  background:#a08060; border-radius:2px;
}
.bottle-note{
  position:absolute; left:15%; top:35%; width:70%; height:40%;
  background:rgba(255,245,220,.75);
  border-radius:1px;
  transform:rotate(-6deg);
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.bottle-note::after{
  content:''; position:absolute; left:10%; top:30%; width:80%; height:1px; background:rgba(0,0,0,.1);
}

/* ---- 设置盒 settings ---- */
.obj-box{
  width:11%; aspect-ratio:1/1;
  background:linear-gradient(145deg,#3d2618,#2a1a10);
  border-radius:4px;
  box-shadow:0 8px 22px -5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.obj-box .box-lid{
  position:absolute; left:-2%; top:-6%; width:104%; height:18%;
  background:linear-gradient(180deg,#4a3020,#3d2618);
  border-radius:3px 3px 1px 1px;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.obj-box .box-mark{
  font-family:'Noto Serif SC',serif; font-size:22px; color:rgba(245,240,230,.35);
  letter-spacing:.1em;
}

/* ---- 咖啡杯（装饰） ---- */
.obj-cup{
  width:7%; aspect-ratio:1/1;
  background:linear-gradient(145deg,#c4b8a8,#a69888);
  border-radius:50%;
  box-shadow:0 6px 14px -3px rgba(0,0,0,.4),inset 0 -2px 4px rgba(0,0,0,.1);
  position:relative;
}
.obj-cup::after{
  content:''; position:absolute; right:-28%; top:28%; width:28%; height:36%;
  border:3px solid #b0a290; border-radius:0 40% 40% 0; border-left:0;
}
.cup-steam{
  position:absolute; left:30%; top:-30%; width:40%; height:30%;
  background:linear-gradient(0deg,rgba(255,255,255,.08),transparent);
  border-radius:50%;
  animation:steam 3s ease-in-out infinite;
}
@keyframes steam{
  0%,100%{ transform:translateY(0) scale(1); opacity:.5; }
  50%{ transform:translateY(-6px) scale(1.1); opacity:.2; }
}

/* ---- 底部提示 ---- */
.hint-tap{ position:fixed; left:0; right:0; bottom:6px; text-align:center;
  font-size:8px; letter-spacing:.28em; color:rgba(245,240,230,.25); z-index:400; pointer-events:none }

.back-gate{ position:fixed; left:10px; bottom:14px; z-index:500;
  padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.12);
  background:rgba(20,16,12,.6); color:#e8e2d6; font-family:inherit; font-size:11px;
  transition:transform .28s; backdrop-filter:blur(6px);
  letter-spacing:.08em;
}
.back-gate:active{ transform:scale(.93) }
body.desk .back-gate{ display:none }

/* 阴影跟随 z 的函数在 JS 里复用 */
</style>

<script>
(function(){
  var D = window.LIWU || {};

  /* ---- 雨滴 ---- */
  var canvas = document.getElementById('rainCanvas');
  var ctx = canvas.getContext('2d');
  var rains = [];
  var W, H;
  function resizeRain(){
    var rect = canvas.getBoundingClientRect();
    W = canvas.width = rect.width;
    H = canvas.height = rect.height;
  }
  resizeRain();
  window.addEventListener('resize', resizeRain);

  for(var i=0;i<70;i++){
    rains.push({
      x: Math.random()*W,
      y: Math.random()*H,
      sp: 1.5 + Math.random()*3,
      len: 6 + Math.random()*10,
      op: 0.15 + Math.random()*0.25
    });
  }
  function drawRain(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<rains.length;i++){
      var r = rains[i];
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(200,215,230,'+r.op+')';
      ctx.lineWidth = 1;
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x, r.y + r.len);
      ctx.stroke();
      r.y += r.sp;
      if(r.y > H){ r.y = -r.len; r.x = Math.random()*W; }
    }
    requestAnimationFrame(drawRain);
  }
  drawRain();

  /* ---- 数据绑定 ---- */
  if(D.weather){
    // 天气已在 data.js 中，这里仅占位保持兼容
  }
  if(D.album && D.album[0] && D.album[0].src){
    var ph = document.getElementById('polPh');
    if(ph){
      var img = document.createElement('img');
      img.src = D.album[0].src;
      img.alt = '';
      img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;';
      ph.innerHTML = '';
      ph.appendChild(img);
    }
  }

  /* ---- 桌面交互（兼容原有 desk8 存档） ---- */
  var items = document.querySelectorAll('.item');
  var store = {};
  try{ store = JSON.parse(localStorage.getItem('liwu.desk8') || '{}') || {}; }catch(e){}

  function shadowFor(z){
    var k = Math.max(0, Math.min(1, z / 60));
    var y = 8 + 12 * k;
    var b = 18 + 26 * k;
    var s = -6 - 5 * k;
    var a1 = 0.30 + 0.18 * k;
    var a2 = 0.12 + 0.07 * k;
    return '0 ' + y.toFixed(1) + 'px ' + b.toFixed(1) + 'px ' + s.toFixed(1) + 'px rgba(0,0,0,' + a1.toFixed(2) + '), ' +
           '0 ' + (y * 0.45).toFixed(1) + 'px ' + (b * 0.42).toFixed(1) + 'px rgba(0,0,0,' + a2.toFixed(2) + ')';
  }

  function place(el, lift){
    el.style.left = el._x + '%';
    el.style.top = el._y + '%';
    var z = el._z + (lift || 0);
    var sc = 1 + (lift ? 0.035 : 0);
    el.style.transform = 'translateZ(' + z + 'px) rotate(' + el._r + 'deg) scale(' + sc + ') translate3d(0,0,0)';
    el.style.zIndex = Math.round(z) + '';
    el.style.boxShadow = shadowFor(z);
  }

  for(var i=0;i<items.length;i++){
    (function(el){
      var key = el.getAttribute('data-go') || el.className.replace('item ', '').replace(/obj-\w+/,'').trim().split(' ')[0];
      var sv = store[key];
      el._x = sv ? sv.x : parseFloat(el.getAttribute('data-x'));
      el._y = sv ? sv.y : parseFloat(el.getAttribute('data-y'));
      el._r = sv ? sv.r : parseFloat(el.getAttribute('data-r') || '0');
      el._z = parseFloat(el.getAttribute('data-z') || '0');
      place(el, 0);

      var sx=0, sy=0, ox=0, oy=0, moved=false, down=false;

      el.addEventListener('pointerdown', function(ev){
        down = true; moved = false;
        sx = ev.clientX; sy = ev.clientY; ox = el._x; oy = el._y;
        el.classList.add('grabbing');
        el.style.transition = 'none';
        place(el, 28);
        try{ el.setPointerCapture(ev.pointerId); }catch(e){}
      });

      el.addEventListener('pointermove', function(ev){
        if(!down) return;
        var dx = ev.clientX - sx, dy = ev.clientY - sy;
        if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        var dw = document.getElementById('desk').offsetWidth || 1;
        var dh = document.getElementById('desk').offsetHeight || 1;
        el._x = Math.max(-4, Math.min(92, ox + (dx / dw) * 100));
        el._y = Math.max(-2, Math.min(90, oy + (dy / dh) * 100));
        el.style.left = el._x + '%';
        el.style.top = el._y + '%';
      });

      function up(){
        if(!down) return;
        down = false;
        el.classList.remove('grabbing');
        el.style.transition = 'box-shadow .25s ease, transform .25s cubic-bezier(.22,.61,.36,1)';
        place(el, 0);
        if(key) store[key] = { x: el._x, y: el._y, r: el._r };
        try{ localStorage.setItem('liwu.desk8', JSON.stringify(store)); }catch(e){}
      }

      el.addEventListener('pointerup', function(){
        var wasMoved = moved;
        up();
        if(wasMoved) return;
        var go = el.getAttribute('data-go');
        if(go) open(go);
      });
      el.addEventListener('pointercancel', up);
    })(items[i]);
  }

  /* 桌面轻微倾斜（取消指针跟随，雨夜书房不需要） */
  var desk = document.getElementById('desk');
  desk.style.transform = 'rotateX(2deg)';

  function open(key){
    document.body.classList.remove('desk');
    if(key === 'chat'){
      var inp = document.getElementById('input');
      if(inp) setTimeout(function(){ inp.focus(); }, 200);
      return;
    }
    var b = document.querySelector('.drawer-nav [data-view="' + key + '"]');
    if(b) setTimeout(function(){ b.click(); }, 40);
  }

  function toDesk(){
    document.body.classList.add('desk');
    var v = document.getElementById('view');
    if(v) v.hidden = true;
    desk.style.transform = 'rotateX(2deg)';
  }
  document.getElementById('backGate').addEventListener('click', toDesk);
  var homeNav = document.querySelector('.drawer-nav [data-view="home"]');
  if(homeNav) homeNav.addEventListener('click', function(){ setTimeout(toDesk, 20); });

})();
</script>
</body>
</html>
