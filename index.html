<body data-theme="paper">



<!-- App —— 与原有结构完全一致 -->
<section class="home-screen" id="homeScreen" aria-label="里屋首页">
  <div class="home-scene" aria-hidden="true"></div>
  <header class="home-top">
    <button class="home-menu icon" id="homeMenuBtn" type="button" aria-label="打开导航">☰</button>
    <span class="home-brand">里屋</span>
    <span class="home-day" id="homeDays"></span>
  </header>
  <main class="home-content" id="homeContent">
    <div class="home-grid">
      <section class="home-hero">
        <div class="home-kicker">只属于我们的生活空间</div>
        <div class="home-portraits">
          <div class="home-portrait home-portrait-you"><span>我</span></div>
          <span class="home-heart">♡</span>
          <div class="home-portrait home-portrait-him"><span>祁</span></div>
        </div>
        <h1>你与宋祁</h1>
        <p class="home-quote" id="homeHero">把日子过成我们自己的故事。</p>
        <div class="home-stats">
          <div class="home-stat"><strong id="homeCount">—</strong><span>相伴天数</span></div>
          <div class="home-stat"><strong>02</strong><span>专属角色</span></div>
        </div>
        <div class="home-anniversary"><span>▦</span><span id="homeSinceLabel">我们的纪念日</span></div>
      </section>
      <section class="home-features">
        <article class="home-surface home-music">
          <div class="home-surface-head"><span>共同收藏</span><span class="home-round home-round-static" aria-hidden="true">♪</span></div>
          <div class="home-music-title">留一首歌给今天</div>
          <p>把喜欢的旋律，放进我们的日常。</p>
          <div class="home-music-foot"><span>音乐收藏</span><span>音乐入口待接入</span></div>
        </article>
        <article class="home-surface home-photo">
          <div class="home-surface-head"><span>我们的照片</span><button type="button" class="home-round" id="homePhotoPick" aria-label="选择照片">＋</button></div>
          <input type="file" id="homePhotoFile" accept="image/*" hidden>
          <div class="home-photo-window" id="homePhotoWindow">
            <img id="homePhotoImg" alt="我们选择的照片">
            <div class="home-photo-placeholder"><strong>留一张照片在这里</strong><small>选择一张属于你们的照片</small></div>
          </div>
          <button class="home-photo-link" type="button" data-home-go="album">打开相册　↗</button>
        </article>
      </section>
    </div>
    <button class="home-chat-link" type="button" data-home-go="chat">
      <span><small>我们的日常</small><strong>去和宋祁说说话</strong><em>继续上一段对话</em></span><b>↗</b>
    </button>
    <section class="home-lower">
      <article class="home-agenda">
        <div class="home-section-title">今天的安排 <span>日常</span></div>
        <div class="home-agenda-content" id="homeAgenda"><p>给今天留一点空白，也留一点期待。</p></div>
      </article>
      <article class="home-memory-card">
        <div class="home-section-title">一段共同记忆 <button type="button" data-home-go="memory">继续翻阅　↗</button></div>
        <div id="homeMemory" class="home-memory-content"></div>
      </article>
    </section>
    <section class="home-diary-strip">
      <div class="home-section-title">共同生活 <button type="button" data-home-go="diary">打开日记　↗</button></div>
      <div id="homeDiary" class="home-diary-content"></div>
    </section>
  </main>
  <nav class="home-tabbar" aria-label="首页快捷导航">
    <button class="home-tab active" type="button" data-home-tab="home"><span>⌂</span><small>首页</small></button>
    <button class="home-tab" type="button" data-home-tab="chat"><span>◌</span><small>聊天</small></button>
    <button class="home-tab" type="button" data-home-tab="diary"><span>▤</span><small>日常</small></button>
    <button class="home-tab" type="button" data-home-tab="settings"><span>⌘</span><small>设置</small></button>
  </nav>
</section>
<div id="app" hidden>
  <header class="top">
    <button class="icon" id="menuBtn" type="button" aria-label="打开导航">≡</button>
    <div class="top-mid"><span class="top-title" id="topTitle">里屋</span><span class="top-sub" id="topSub"></span></div>
    <div class="top-right"><span class="days" id="topDays"></span><button class="icon" id="newBtn" type="button" aria-label="新的一段">＋</button></div>
  </header>
  <main class="thread" id="thread"></main>
  <footer class="composer">
    <form class="in-row" id="form">
      <textarea id="input" rows="1" placeholder="说一句" autocapitalize="off" aria-label="发消息给宋祁"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="发">↑</button>
      <button class="stop" id="stopBtn" type="button" aria-label="停" hidden>■</button>
    </form>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-in">
    <div class="drawer-top"><div><span class="brandmark">里屋</span><span class="drawer-caption">LIWU · PRIVATE SPACE</span></div><span class="drawer-days" id="drawerDays"></span></div>
    <div class="drawer-presence"><span class="presence-mark" aria-hidden="true"></span><div><strong>两个人的空间</strong><small>只在这里，慢慢生活</small></div></div>
    <button class="newchat" id="newChat" type="button">新的一段</button>
    <input class="search" id="search" placeholder="找一段话" autocomplete="off" aria-label="搜索会话">
    <div class="sessions" id="sessions"></div>
    <div class="drawer-section-label">相处</div>
    <nav class="drawer-nav" aria-label="空间导航">
      <button type="button" data-view="home"><span class="nav-index">00</span><span class="nav-copy"><strong>首页</strong><small>回到里屋</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
      <div class="drawer-section-label nav-subhead">相处</div><button type="button" data-view="chat" class="nav-current"><span class="nav-index">01</span><span class="nav-copy"><strong>聊天</strong><small>继续和宋祁说话</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="profile"><span class="nav-index">01</span><span class="nav-copy"><strong>人设档案</strong><small>外观、性格与关系设定</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="notice"><span class="nav-index">01</span><span class="nav-copy"><strong>通知</strong><small>重要消息与提醒</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="moments"><span class="nav-index">01</span><span class="nav-copy"><strong>动态</strong><small>两个人的生活片段</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="proactiveImage"><span class="nav-index">01</span><span class="nav-copy"><strong>主动生图</strong><small>聊天情境触发的画面</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
      <div class="drawer-section-label nav-subhead">共同生活</div><button type="button" data-view="diary"><span class="nav-index">02</span><span class="nav-copy"><strong>日记</strong><small>写下今天</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="calendar"><span class="nav-index">02</span><span class="nav-copy"><strong>日历</strong><small>查看日期与纪念日</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="schedule"><span class="nav-index">02</span><span class="nav-copy"><strong>安排</strong><small>共同日程计划</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="todo"><span class="nav-index">02</span><span class="nav-copy"><strong>待办</strong><small>待完成的小事</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="countdown"><span class="nav-index">02</span><span class="nav-copy"><strong>倒计时</strong><small>等待与纪念日</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="mood"><span class="nav-index">02</span><span class="nav-copy"><strong>心情</strong><small>记录每日心情</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="quotes"><span class="nav-index">02</span><span class="nav-copy"><strong>语录</strong><small>收藏喜欢的话</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>

      <div class="drawer-section-label nav-subhead">创作工坊</div><button type="button" data-view="imageStudio"><span class="nav-index">06</span><span class="nav-copy"><strong>生图室</strong><small>图片生成与参考图编辑</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="beautify"><span class="nav-index">06</span><span class="nav-copy"><strong>美化</strong><small>材质、布局与界面调整</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="wallpaper"><span class="nav-index">06</span><span class="nav-copy"><strong>壁纸</strong><small>首页与空间背景</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="theme"><span class="nav-index">06</span><span class="nav-copy"><strong>主题</strong><small>浅色、夜间与主题细节</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
      <div class="drawer-section-label nav-subhead">系统管理</div><button type="button" data-view="settings"><span class="nav-index">07</span><span class="nav-copy"><strong>设置</strong><small>模型、接口与外观设置</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="data"><span class="nav-index">07</span><span class="nav-copy"><strong>数据管理</strong><small>备份、恢复与数据迁移</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="mcp"><span class="nav-index">07</span><span class="nav-copy"><strong>MCP</strong><small>外部工具与服务连接</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button><button type="button" data-view="plugins"><span class="nav-index">07</span><span class="nav-copy"><strong>插件</strong><small>扩展能力与连接管理</small></span><span class="nav-arrow" aria-hidden="true">↗</span></button>
    </nav>
    <div class="drawer-foot">A SMALL SPACE FOR TWO</div>
  </div>
</aside>

<section class="view" id="view" hidden>
  <header class="view-top">
    <button class="icon" id="viewBack" type="button" aria-label="回去">←</button>
    <span class="view-title" id="viewTitle"></span><span class="view-en" id="viewEn"></span>
  </header>
  <div class="view-body" id="viewBody"></div>
</section><script>
window.addEventListener('error', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.message || '未知');
});
window.addEventListener('unhandledrejection', function(e){
  var h = document.getElementById('hint');
  if (h) h.textContent = '出了点问题：' + (e.reason && e.reason.message || '未知');
});
</script>
