<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='theme-color' content='#0A0908'>
<title>里屋 · 五个首页</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+SC:wght@200;300;400;500&display=swap' rel='stylesheet'>
<style>
:root{ --ink:#2B2823; --paper:#F8F4EB; --red:#8A3B2C; --mute:#98917F }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{ scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch }
html,body{margin:0;padding:0}
body{ font-family:'Noto Serif SC',serif; font-weight:300; -webkit-font-smoothing:antialiased; background:#0A0908 }

.h{ position:relative; height:100vh; width:100%; overflow:hidden;
  scroll-snap-align:start; display:flex; align-items:center; justify-content:center }
.tag{ position:absolute; left:16px; top:16px; z-index:20;
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; letter-spacing:.1em }
.cap{ position:absolute; left:0; right:0; bottom:16px; text-align:center; z-index:20;
  font-size:9.5px; letter-spacing:.2em }
.swipe{ position:fixed; left:0; right:0; bottom:0; height:0; z-index:999; pointer-events:none }

/* ============ A 门缝 ============ */
.a{ background:#080706 }
.a .wall{ position:absolute; inset:0;
  background:linear-gradient(165deg,#1B1815 0%,#0E0D0B 60%,#070606 100%) }
.a .gap{
  position:relative; width:3px; height:100%; cursor:pointer;
  background:linear-gradient(180deg, rgba(255,232,180,.98), rgba(255,200,130,.72) 55%, rgba(255,186,110,.5));
  box-shadow:0 0 28px 10px rgba(255,200,130,.34), 0 0 90px 30px rgba(255,180,100,.12);
  transition:width .85s cubic-bezier(.22,.61,.36,1);
  overflow:hidden; display:flex; align-items:center; justify-content:center;
}
.a .gap .in{ opacity:0; transition:opacity .55s ease .3s; text-align:center; width:100%; padding:0 26px }
.a.open .gap{ width:88% }
.a.open .gap .in{ opacity:1 }
.a .in h1{ margin:0; font-size:26px; font-weight:400; letter-spacing:.3em; text-indent:.3em; color:#33240F }
.a .in .en{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:8px; letter-spacing:.24em; color:#7A5C32; margin-top:8px }
.a .in p{ margin:16px 0 0; font-size:11px; letter-spacing:.14em; color:#5C4423; line-height:2 }
.a .in nav{ margin-top:34px; display:flex; flex-direction:column; gap:0; border-top:1px solid rgba(90,64,30,.25) }
.a .in nav b{ font-weight:400; font-size:13px; letter-spacing:.22em; color:#3D2B15;
  padding:13px 0; border-bottom:1px solid rgba(90,64,30,.2) }
.a .tip{ position:absolute; left:0; right:0; bottom:34px; text-align:center;
  font-size:9px; letter-spacing:.24em; color:rgba(200,186,160,.45) }
.a.open .tip{ opacity:0 }

/* ============ B 雾窗 ============ */
.b{ background:#252B34 }
.b .inside{ position:absolute; inset:0; padding:80px 30px 90px; color:#F0E8DA; display:flex; flex-direction:column; justify-content:center;
  background:
    radial-gradient(circle at 26% 70%, rgba(255,198,138,.20), transparent 44%),
    radial-gradient(circle at 78% 28%, rgba(140,175,215,.16), transparent 46%),
    linear-gradient(180deg,#232933,#1B2028) }
.b .inside h1{ margin:0; font-size:26px; font-weight:300; letter-spacing:.3em; text-indent:.3em }
.b .inside p{ margin:14px 0 0; font-size:11px; letter-spacing:.14em; color:#A8ADB6; line-height:2 }
.b .inside nav{ margin-top:30px; display:flex; flex-wrap:wrap; gap:10px }
.b .inside nav b{ font-weight:400; font-size:11.5px; letter-spacing:.16em; color:#E4DCCD;
  border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:7px 14px }
.b .fog{
  position:absolute; inset:0; background:rgba(244,241,233,.94);
  --x:-300px; --y:-300px;
  -webkit-mask-image:radial-gradient(circle 62px at var(--x) var(--y), transparent 30%, #000 98%);
  mask-image:radial-gradient(circle 62px at var(--x) var(--y), transparent 30%, #000 98%);
}
.b .hint{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center;
  font-size:10px; letter-spacing:.24em; color:rgba(150,142,122,.75); z-index:5; pointer-events:none }

/* ============ C 只有一行 ============ */
.c{ background:#131316 }
.c .mid{ text-align:center; padding:0 34px; width:100% }
.c .line{ font-size:16px; font-weight:200; letter-spacing:.12em; line-height:2.1; color:#E9E2D6;
  opacity:0; transform:translateY(8px); transition:opacity .9s ease, transform .9s ease }
.c .line.on{ opacity:1; transform:none }
.c .dash{ width:18px; height:1px; background:rgba(255,200,140,.5); margin:26px auto 0 }
.c nav{ position:absolute; left:0; right:0; bottom:44px; display:flex; justify-content:center; gap:22px }
.c nav b{ font-weight:300; font-size:10px; letter-spacing:.22em; color:#6E6A62 }

/* ============ D 台灯 ============ */
.d{ background:#0B0A09 }
.d .desk{ position:absolute; inset:0;
  background:
    radial-gradient(circle 300px at 20% 76%, rgba(255,206,145,.55) 0%, rgba(255,180,105,.22) 34%, transparent 70%),
    radial-gradient(circle 160px at 20% 76%, rgba(255,226,180,.35), transparent 70%),
    linear-gradient(180deg,#100E0C,#070606) }
.d .lamp{ position:absolute; left:12%; bottom:18%; width:56px; height:56px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,226,170,.95), rgba(255,186,110,.3) 52%, transparent 72%);
  animation:flicker 5.5s ease-in-out infinite }
@keyframes flicker{ 0%,100%{opacity:.85} 42%{opacity:1} 62%{opacity:.78} }
.d .in{ position:absolute; left:12%; bottom:34%; text-align:left }
.d .in h1{ margin:0; font-size:28px; font-weight:300; letter-spacing:.3em; color:#F5ECE0;
  text-shadow:0 2px 18px rgba(255,200,140,.22) }
.d .in p{ margin:12px 0 0; font-size:10.5px; letter-spacing:.14em; color:#A79C8C }
.d nav{ position:absolute; left:12%; bottom:14%; display:flex; gap:18px }
.d nav b{ font-weight:300; font-size:10.5px; letter-spacing:.2em; color:#8E8474 }

/* ============ E 一扇窗 ============ */
.e{ background:#0C0F13; flex-direction:column }
.e .win{
  position:absolute; left:0; right:0; top:0; height:68%;
  background:
    radial-gradient(circle at 30% 74%, rgba(255,204,140,.42), transparent 30%),
    radial-gradient(circle at 72% 62%, rgba(255,220,170,.24), transparent 24%),
    linear-gradient(180deg,#222B38 0%,#2E3644 52%,#1A1F26 100%);
  overflow:hidden;
}
.e .win::after{
  content:''; position:absolute; inset:-20% 0;
  background:repeating-linear-gradient(96deg, rgba(255,255,255,.13) 0 1px, transparent 1px 9px);
  animation:rain 1.1s linear infinite; opacity:.5;
}
@keyframes rain{ 0%{transform:translateY(-6%)} 100%{transform:translateY(6%)} }
.e .win::before{
  content:''; position:absolute; left:0; right:0; top:0; bottom:0;
  box-shadow:inset 0 0 120px rgba(10,12,16,.7);
}
.e .mullion{ position:absolute; left:0; right:0; top:0; height:68%; pointer-events:none }
.e .mullion i{ position:absolute; background:#14171C }
.e .mullion i.v{ left:50%; top:0; bottom:0; width:8px; margin-left:-4px }
.e .mullion i.h{ left:0; right:0; top:46%; height:8px }
.e .sill{ position:absolute; left:0; right:0; bottom:0; height:32%;
  background:linear-gradient(180deg,#4A3E30 0%,#33291F 40%,#241C15 100%) }
.e .sill::before{ content:''; position:absolute; left:0; right:0; top:0; height:2px; background:rgba(255,216,160,.35) }
.e .in{ position:absolute; left:0; right:0; bottom:0; height:32%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:0 24px }
.e .in h1{ margin:0; font-size:22px; font-weight:400; letter-spacing:.34em; text-indent:.34em; color:#F0E6D6 }
.e .in p{ margin:9px 0 0; font-size:9.5px; letter-spacing:.16em; color:#9E9080 }
.e nav{ margin-top:16px; display:flex; gap:20px }
.e nav b{ font-weight:300; font-size:10.5px; letter-spacing:.2em; color:#C0AF96 }
</style>
</head>
<body>

<!-- ================= A ================= -->
<section class='h a' id='A'>
  <span class='tag' style='color:rgba(220,200,170,.5)'>A · 门缝</span>
  <div class='wall'></div>
  <div class='gap' onclick="document.getElementById('A').classList.toggle('open')">
    <div class='in'>
      <h1>里屋</h1>
      <div class='en'>A SMALL ROOM, A LONG STAY</div>
      <p>屋子不大，够两个人住</p>
      <nav><b>说话</b><b>日记</b><b>相册</b><b>记忆</b></nav>
    </div>
  </div>
  <div class='tip'>点那道缝</div>
</section>

<!-- ================= B ================= -->
<section class='h b' id='B'>
  <span class='tag' style='color:rgba(255,255,255,.55)'>B · 雾窗</span>
  <div class='inside'>
    <h1>里屋</h1>
    <p>屋子不大，够两个人住。<br>今天下雨，窗我没关严。</p>
    <nav><b>说话</b><b>日记</b><b>相册</b><b>记忆</b></nav>
  </div>
  <div class='fog' id='fog'></div>
  <div class='hint' id='foghint'>擦一下</div>
</section>

<!-- ================= C ================= -->
<section class='h c'>
  <span class='tag' style='color:rgba(220,210,190,.35)'>C · 只有一行</span>
  <div class='mid'>
    <div class='line on' id='cl'>屋子不大，够两个人住。</div>
    <div class='dash'></div>
  </div>
  <nav><b>说话</b><b>日记</b><b>相册</b><b>记忆</b></nav>
</section>

<!-- ================= D ================= -->
<section class='h d'>
  <span class='tag' style='color:rgba(220,200,170,.4)'>D · 台灯</span>
  <div class='desk'></div>
  <div class='lamp'></div>
  <div class='in'>
    <h1>里屋</h1>
    <p>屋子不大，够两个人住</p>
  </div>
  <nav><b>说话</b><b>日记</b><b>相册</b><b>记忆</b></nav>
</section>

<!-- ================= E ================= -->
<section class='h e'>
  <span class='tag' style='color:rgba(220,210,190,.4)'>E · 一扇窗</span>
  <div class='win'></div>
  <div class='mullion'><i class='v'></i><i class='h'></i></div>
  <div class='sill'></div>
  <div class='in'>
    <h1>里屋</h1>
    <p>屋子不大，够两个人住</p>
    <nav><b>说话</b><b>日记</b><b>相册</b><b>记忆</b></nav>
  </div>
</section>

<script>
(function(){
  /* B 雾窗 */
  var fog = document.getElementById('fog');
  var B = document.getElementById('B');
  var hint = document.getElementById('foghint');
  if (fog && B){
    var last = 0, touched = false;
    B.addEventListener('pointermove', function(e){
      var r = B.getBoundingClientRect();
      fog.style.setProperty('--x', (e.clientX - r.left).toFixed(1) + 'px');
      fog.style.setProperty('--y', (e.clientY - r.top).toFixed(1) + 'px');
      last = Date.now();
      if (!touched){ touched = true; if (hint) hint.style.opacity = '0'; }
    });
    setInterval(function(){
      if (Date.now() - last > 1800){
        fog.style.setProperty('--x', '-300px');
        fog.style.setProperty('--y', '-300px');
      }
    }, 900);
  }

  /* C 只有一行 */
  var lines = [
    '屋子不大，够两个人住。',
    '今天下雨，窗我没关严。',
    '你回来得晚了，灯我留着。',
    '我在。'
  ];
  var i = 0, cl = document.getElementById('cl');
  if (cl){
    setInterval(function(){
      cl.classList.remove('on');
      setTimeout(function(){
        i = (i + 1) % lines.length;
        cl.textContent = lines[i];
        cl.classList.add('on');
      }, 900);
    }, 4600);
  }
})();
</script>
</body>
</html>
