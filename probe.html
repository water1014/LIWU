<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>probe</title>
</head>
<body style='font:14px monospace;padding:20px;line-height:2'>
<div id='o'>wait</div>
<script type='module'>
(async function(){
  var o = document.getElementById('o');
  var list = [
    ['unpkg', 'https://unpkg.com/three@0.160.0/build/three.module.js'],
    ['jsdelivr', 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'],
    ['cdnjs', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js'],
    ['esmsh', 'https://esm.sh/three@0.160.0']
  ];
  for (var i = 0; i < list.length; i++){
    var name = list[i][0];
    var url = list[i][1];
    var t0 = performance.now();
    try{
      var lib = await import(url);
      var ms = Math.round(performance.now() - t0);
      o.textContent += name + ' OK r' + lib.REVISION + ' ' + ms + 'ms / ';
    }catch(e){
      o.textContent += name + ' FAIL ' + String(e.message || e).slice(0, 60) + ' / ';
    }
  }
  o.textContent += ' done';
})();
</script>
</body>
</html>
